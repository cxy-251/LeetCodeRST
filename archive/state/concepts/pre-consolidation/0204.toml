"algorithm.sieve_of_eratosthenes" = "kind=algorithm; introduced=0204; last=0204; occurrences=1; teaching_state=explained; note=为 [0,n) 建立合数标记，只让未标记候选 p 从 p*p 开始按步长 p 划去倍数，最后统计 2..n-1 的未标记索引。"
"proof.sieve_start_at_square" = "kind=proof; introduced=0204; last=0204; occurrences=1; teaching_state=explained; note=小于 p*p 的 p 倍数写成 p*k 且 k<p，已经包含更小质因子并被更早扫描标记，因此从 p*p 开始不漏合数。"
"proof.smallest_prime_factor_completeness" = "kind=proof; introduced=0204; last=0204; occurrences=1; teaching_state=explained; note=任意合数 x 的最小质因子 p 不超过 sqrt(x)，处理 p 时 x 位于从 p*p 开始的倍数序列中；质数从不可能成为该序列元素。"
"invariant.sieve_candidate_state" = "kind=invariant; introduced=0204; last=0204; occurrences=1; teaching_state=explained; note=处理候选 p 前，小于 p*p 的合数已标记、所有标记都是真合数、未标记 p 没有更小质因子。"
"safety.square_bound_by_division" = "kind=numeric_safety; introduced=0204; last=0204; occurrences=1; teaching_state=explained; note=外层使用 p <= (n-1)/p 表达 p*p<n，在比较前避免固定宽整数平方溢出；内层按语言使用 size_t 或宽整数。"
