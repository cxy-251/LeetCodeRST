[concepts]
"algorithm.reverse_word_scan_from_right" = "kind=algorithm; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=以半开右边界 end 从右向左交替跳过空格、定位 [start,end) 单词并正向写出；每轮越过一个完整单词。"
"invariant.reverse_words_unprocessed_prefix" = "kind=invariant; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=循环入口时 [0,end) 是唯一未处理前缀，输出已包含其右侧全部单词的逆序，且每个原词恰写一次。"
"invariant.single_separator_output" = "kind=invariant; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=首词前不写分隔符，后续提交前恰写一个空格；输出无首尾空格且相邻词间始终恰有一个空格。"
"proof.reverse_words_exact_word_coverage" = "kind=proof; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=跳过的字符全为空格，随后取得未处理前缀最右最大非空格片段；严格左移保证不重不漏和终止。"
"cost.string_slice_and_join_materialization" = "kind=complexity; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=统一区分 O(n) 扫描、O(r) 返回；各语言另计切片复制、单词容器、构建器容量、输入副本与 join 峰值共存。"
"adapter.c_reverse_words_owned_result" = "kind=language_adapter; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=C 按 n+1 分配返回缓冲，r<=n 保证写入与终止符有界；失败返回 NULL，成功结果由调用者释放。"
"semantics.ascii_word_scan_units" = "kind=language_semantics; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=ASCII 合同允许字节或代码单元扫描；该证明不能无条件推广到任意 Unicode 用户感知字符。"
