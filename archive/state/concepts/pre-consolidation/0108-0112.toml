[concepts]
"algorithm.sorted_array_midpoint_bst_partition" = "kind=algorithm; introduced=0108; last=0108; occurrences=1; teaching_state=explained; note=对有序数组半开区间选择中点为根，左右区间分别构造左右子树，顺序与平衡同时由区间划分保证。"
"proof.sorted_array_balance_by_halving" = "kind=proof; introduced=0108; last=0108; occurrences=1; teaching_state=explained; note=每次去掉中点后左右规模至多相差一，递归继续平分，故每个节点左右子树高度至多相差一。"
"interface.nonunique_tree_property_validation" = "kind=interface; introduced=0108; last=0108; occurrences=1; teaching_state=explained; note=偶数长度可选择两个中点之一，验证应检查中序、节点覆盖和高度平衡，不固定唯一序列化树形。"
"algorithm.sorted_list_inorder_cursor_construction" = "kind=algorithm; introduced=0109; last=0109; occurrences=1; teaching_state=explained; note=先统计链表长度，build(size) 先构造左子树，再读取共享游标作为根并前进，最后构造右子树，使游标只扫描一次。"
"proof.sorted_list_exact_consumption" = "kind=proof; introduced=0109; last=0109; occurrences=1; teaching_state=explained; note=每个 build(size) 恰好消费 size 个连续链表节点，调用结束游标指向片段后继，中序序列与原链表片段一致。"
"pattern.cross_recursive_shared_cursor" = "kind=pattern; introduced=0109; last=0109; occurrences=1; teaching_state=explained; note=C 指针槽位、C++ 引用、对象字段、闭包、Rust 借用、Julia Ref 和 R environment 都可表达跨递归共享的单向游标。"
"algorithm.balance_height_or_failure" = "kind=algorithm; introduced=0110; last=0110; occurrences=1; teaching_state=explained; note=后序辅助函数返回真实高度或失衡失败状态，任一子树失败或高度差超过一时立即向上传播。"
"proof.balance_failure_propagation" = "kind=proof; introduced=0110; last=0110; occurrences=1; teaching_state=explained; note=非负返回值同时证明当前子树平衡并给出精确高度；失败状态证明子树内存在失衡节点，沿祖先链传播不会产生伪阳性。"
"algorithm.minimum_depth_bfs_first_leaf" = "kind=algorithm; introduced=0111; last=0111; occurrences=1; teaching_state=explained; note=BFS 按层检查节点，第一次遇到左右孩子都为空的叶节点时返回当前节点数深度。"
"proof.minimum_depth_first_leaf_optimality" = "kind=proof; introduced=0111; last=0111; occurrences=1; teaching_state=explained; note=首个叶节点出现前所有更浅层已完整排除，未处理节点只可能同层或更深，因此当前深度全局最小。"
"boundary.leaf_requires_two_null_children" = "kind=boundary; introduced=0111; last=0112; occurrences=2; teaching_state=reinforced; note=叶节点必须左右孩子同时为空；0111 用于最小深度终点，0112 用于根到叶路径和终点。"
"algorithm.path_sum_remaining_target" = "kind=algorithm; introduced=0112; last=0112; occurrences=1; teaching_state=explained; note=递归状态携带进入当前节点前的剩余目标；叶节点比较 remaining 与 node.val，非叶节点扣除当前值后搜索左右子树。"
"proof.path_sum_root_to_leaf_induction" = "kind=proof; introduced=0112; last=0112; occurrences=1; teaching_state=explained; note=任意合法根到叶路径在非叶节点后必进入一个孩子；扣除当前值后左右递归完整覆盖全部候选且只在叶节点提交。"
"numeric.path_sum_widen_before_subtract" = "kind=numeric; introduced=0112; last=0112; occurrences=1; teaching_state=explained; note=固定宽语言先把 targetSum 与 node.val 扩宽到 64 位再减法，避免窄类型中间结果先溢出。"
"r.environment_recursive_cursor" = "kind=language_boundary; introduced=0109; last=0109; occurrences=1; teaching_state=explained; note=R 用显式 environment 保存 current 槽位，使所有递归调用共享同一游标，不依赖父调用帧局部重绑定或未审计的 superassignment。"
