[updates]
"optimization.longest_palindromic_prefix" = "只能在前端添加字符时，任意添加 k 个字符的回文结果都会迫使原串前 n-k 个字符成为回文；最大化可保留回文前缀等价于最小化新增字符。"
"proof.prepend_overlap_lower_bound" = "通过结果串镜像位置 k+i 与 n-1-i 的下标关系，直接推出 s[0:n-k] 回文，并得到 k>=n-L 的最优性下界。"
"string.kmp_border_palindrome_equivalence" = "在 s + unique_separator + reverse(s) 中，最终 border 长度不超过 n；其前缀是 P，后缀是 reverse(P)，因此 border 与回文前缀双向等价。"
"safety.unique_separator_boundary" = "分隔符必须不属于输入字符域且只出现一次；否则跨边界 border 与长度上界证明失效。"
"adapter.shortest_palindrome_string_materialization" = "C 显式分配序列、size_t 前缀表和答案；Julia codeunits 是视图但拼接与答案物化；R raw、UTF-16 和字节适配只在官方 ASCII 合同下等价。"

