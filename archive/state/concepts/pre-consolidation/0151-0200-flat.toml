[concepts]
"algorithm.reverse_word_scan_from_right" = "kind=algorithm; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=以半开右边界 end 从右向左交替跳过空格、定位 [start,end) 单词并正向写出；每轮越过一个完整单词。"
"invariant.reverse_words_unprocessed_prefix" = "kind=invariant; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=循环入口时 [0,end) 是唯一未处理前缀，输出已包含其右侧全部单词的逆序，且每个原词恰写一次。"
"invariant.single_separator_output" = "kind=invariant; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=首词前不写分隔符，后续提交前恰写一个空格；输出无首尾空格且相邻词间始终恰有一个空格。"
"proof.reverse_words_exact_word_coverage" = "kind=proof; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=跳过的字符全为空格，随后取得未处理前缀最右最大非空格片段；严格左移保证不重不漏和终止。"
"cost.string_slice_and_join_materialization" = "kind=complexity; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=统一区分 O(n) 扫描、O(r) 返回；各语言另计切片复制、单词容器、构建器容量、输入副本与 join 峰值共存。"
"adapter.c_reverse_words_owned_result" = "kind=language_adapter; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=C 按 n+1 分配返回缓冲，r<=n 保证写入与终止符有界；失败返回 NULL，成功结果由调用者释放。"
"semantics.ascii_word_scan_units" = "kind=language_semantics; introduced=0151; last=0151; occurrences=1; teaching_state=explained; note=ASCII 合同允许字节或代码单元扫描；该证明不能无条件推广到任意 Unicode 用户感知字符。"
"algorithm.max_min_product_ending_here" = "kind=algorithm; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=当前位置只比较 value、old_max*value、old_min*value 三个候选；乘负数反转极值角色，乘零令扩展候选合并为零。"
"invariant.maximum_minimum_product_endpoints" = "kind=invariant; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=max_ending/min_ending 是所有恰以当前位置结尾的非空子数组乘积两端极值，answer 覆盖全部已处理右端点。"
"invariant.nonempty_subarray_initialization" = "kind=invariant; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=三个状态从 nums[0] 初始化，避免用 0 或 1 引入不存在的空子数组候选。"
"proof.product_subarray_right_endpoint_partition" = "kind=proof; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=每个以 i 结尾的子数组要么单取 i，要么唯一延长一个以 i-1 结尾的子数组；乘以固定数的单调或反单调性使旧两端充分。"
"technique.scalar_dynamic_programming" = "kind=technique; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=完整 DP 只依赖前一位置双极值，可压缩为常数标量；覆盖前必须先保存同一旧状态的两个扩展候选。"
"semantics.same_old_state_parallel_update" = "kind=language_semantics; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=新最大与新最小必须来自同一组三候选；先覆盖最大值再计算最小值会在一轮内重复使用当前元素。"
"numeric.actual_subarray_product_witness" = "kind=numeric; introduced=0152; last=0152; occurrences=1; teaching_state=explained; note=每个 DP 候选都有真实连续子数组见证，因此官方任意子数组乘积适合 32 位的保证覆盖最大、最小和扩展候选。"
"algorithm.rotated_array_minimum_right_boundary" = "kind=algorithm; introduced=0153; last=0154; occurrences=2; teaching_state=reinforcing; note=互异版本按中点与右端严格比较保留含最小值的一侧；重复值版本在等值无法判向时只删除有中点同值副本的右端。"
"invariant.minimum_index_closed_interval" = "kind=invariant; introduced=0153; last=0153; occurrences=1; teaching_state=explained; note=闭区间始终包含唯一最小值下标；大于分支保留 [mid+1,right]，小于分支保留 [left,mid]。"
"proof.rotated_two_segment_exclusion" = "kind=proof; introduced=0153; last=0153; occurrences=1; teaching_state=explained; note=旋转后由较大值段与从最小值开始的较小值段组成；同段严格递增与跨段值序共同证明两个分支的整段排除。"
"technique.binary_search_keep_mid_candidate" = "kind=technique; introduced=0153; last=0153; occurrences=1; teaching_state=explained; note=小于右端只排除中点右侧，中点可能正是唯一最小值，因此必须 right=mid 而不能 mid-1。"
"complexity.binary_candidate_length_halving" = "kind=complexity; introduced=0153; last=0153; occurrences=1; teaching_state=explained; note=旧闭区间长度 s>=2 时任一分支新长度至多 ceil(s/2)，由长度递推而非二分外形证明最坏 O(log n)。"
"semantics.closed_interval_lower_midpoint" = "kind=language_semantics; introduced=0153; last=0153; occurrences=1; teaching_state=explained; note=left<right 时下中点满足 left<=mid<right，支撑比较不同下标、严格收缩和各语言边界安全。"
"invariant.minimum_value_witness_interval" = "kind=invariant; introduced=0154; last=0154; occurrences=1; teaching_state=explained; note=候选区间始终至少含一个值等于全局最小值的位置；允许删除某个最小下标，不要求保留固定答案身份。"
"technique.equal_right_endpoint_disambiguation" = "kind=technique; introduced=0154; last=0154; occurrences=1; teaching_state=explained; note=nums[mid]==nums[right] 时令 right-=1；若右端是最小值，仍留在新区间的 mid 提供替代见证。"
"proof.opposite_direction_equal_comparison_counterexamples" = "kind=proof; introduced=0154; last=0154; occurrences=1; teaching_state=explained; note=两个中点等于右端但最小值分处左右的输入证明等值比较确实无法固定判向。"
"complexity.duplicate_binary_search_linear_worst_case" = "kind=complexity; introduced=0154; last=0154; occurrences=1; teaching_state=explained; note=每轮至少删一项给出 O(n) 上界；全相等长度 n 输入执行 n-1 个等值分支，给出 Omega(n)，最坏为 Theta(n)。"
"semantics.unsigned_right_decrement_guard" = "kind=language_semantics; introduced=0154; last=0154; occurrences=1; teaching_state=explained; note=right 减一只发生在 left<right 的循环内，保证 Rust usize 及一基 Julia/R 边界不会下溢。"
"data_structure.augmented_stack" = "kind=data_structure; introduced=0155; last=0155; occurrences=1; teaching_state=explained; note=每层保存 (value,prefix_min)，把昂贵的最小值查询提前到 push 时增量计算，并随 pop 回滚。"
"invariant.prefix_minimum_per_entry" = "kind=invariant; introduced=0155; last=0155; occurrences=1; teaching_state=explained; note=第 i 层 minimum 等于当前栈底到该层全部值的最小值；末层同时证实 top 与 getMin，重复最小值逐层保留。"
"proof.min_stack_operation_sequence_induction" = "kind=proof; introduced=0155; last=0155; occurrences=1; teaching_state=explained; note=构造建立空状态，push 建立新层证书，pop 删除完整末层并恢复旧证书，查询只读不变量；对任意合法操作序列归纳。"
"complexity.amortized_dynamic_array_push" = "kind=complexity; introduced=0155; last=0155; occurrences=1; teaching_state=explained; note=前缀最小递推是最坏 O(1)；动态数组个别扩容复制 O(d)，连续 push 摊还 O(1)，不能混写为单次最坏常数。"
"adapter.c_min_stack_resource_atomicity" = "kind=language_adapter; introduced=0155; last=0155; occurrences=1; teaching_state=explained; note=C realloc 使用临时指针，失败保持旧栈；void push 无法报告未压入，资源耗尽时无法完全履行抽象更新合同。"
"semantics.mutable_stack_object_identity" = "kind=language_semantics; introduced=0155; last=0155; occurrences=1; teaching_state=explained; note=各方法必须修改同一持久对象；Go 用指针接收者，Julia 用 mutable struct，R 用环境节点表达引用语义。"
"technique.two_head_pointer_switching" = "kind=technique; introduced=0160; last=0160; occurrences=1; teaching_state=explained; note=两个指针分别枚举 A,null,B 与 B,null,A，同组成不同顺序让第二段自动抵消独有前缀长度差。"
"invariant.concatenated_pointer_identity_sequences" = "kind=invariant; introduced=0160; last=0160; occurrences=1; teaching_state=explained; note=更新 t 次后两个指针分别位于各自组合身份序列第 t 个状态；空哨兵是代码真实经过的状态。"
"contract.linked_list_node_identity" = "kind=contract; introduced=0160; last=0160; occurrences=1; teaching_state=explained; note=相交按节点对象身份判断；值相同或内容相同的独立节点不相交，共享节点后因 next 唯一而共享整条后缀。"
"proof.intersection_alignment_with_null_sentinel" = "kind=proof; introduced=0160; last=0160; occurrences=1; teaching_state=explained; note=独有前缀 a,b、共享后缀 c 时，两指针至迟在 a+b+c+1 次更新后到首个共享节点；无交点时在 m+n+1 次后同为空。"
"adapter.rust_shared_tail_rc" = "kind=adapter; introduced=0160; last=0160; occurrences=1; teaching_state=explained; note=Box 不能被两个头共同拥有；教学适配器用 Rc 表达共享尾链、ptr_eq 比较身份，clone 只调整引用计数。"
"semantics.cross_language_reference_identity" = "kind=language_semantics; introduced=0160; last=0160; occurrences=1; teaching_state=explained; note=Python is、C# ReferenceEquals、Julia ===、R 环境 identical 与各原生指针比较都必须绕开值或结构相等。"
"algorithm.binary_search_adjacent_slope" = "kind=algorithm; introduced=0162; last=0162; occurrences=1; teaching_state=explained; note=比较 nums[mid] 与右邻；上升时保留 [mid+1,right]，下降时保留 [left,mid]，不寻找全局最大值。"
"invariant.peak_exists_in_candidate_interval" = "kind=invariant; introduced=0162; last=0162; occurrences=1; teaching_state=explained; note=候选左端要么在边界要么大于左外邻，右端对称大于右外邻；双边界证书保证闭区间内至少有峰。"
"proof.peak_boundary_certificate_preservation" = "kind=proof; introduced=0162; last=0162; occurrences=1; teaching_state=explained; note=上升分支为新左端建立左证书，下降分支为新右端建立右证书；收缩到单点时两证书直接给出严格峰。"
"contract.virtual_negative_infinity_boundaries" = "kind=contract; introduced=0162; last=0162; occurrences=1; teaching_state=explained; note=数组外侧数学上视为负无穷，使首尾可成峰；代码不以合法 INT_MIN 物化哨兵。"
"semantics.adjacent_read_and_zero_based_return" = "kind=language_semantics; introduced=0162; last=0162; occurrences=1; teaching_state=explained; note=left<right 与下中点保证 mid+1<=right；Julia/R 内部一基，返回时必须减一得到题目零基下标。"
"complexity.peak_candidate_halving" = "kind=complexity; introduced=0162; last=0162; occurrences=1; teaching_state=explained; note=长度 s>=2 的候选在任一分支后至多为 ceil(s/2)，正式支撑最坏 O(log n)。"
"algorithm.pigeonhole_gap_buckets" = "kind=algorithm; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=以 ceil((high-low)/(n-1)) 作为桶宽，每桶只存实际最小/最大，按桶号扫描相邻非空桶边界。"
"invariant.bucket_internal_gap_bound" = "kind=invariant; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=同桶整数落在宽 w 的半开区间，任意差至多 w-1；最大排序间距至少 w，故目标必跨桶。"
"proof.adjacent_nonempty_bucket_sorted_neighbors" = "kind=proof; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=相邻非空桶之间没有输入值，前桶最大值与后桶最小值因此在全局排序序列中真正相邻。"
"complexity.bucket_count_bounded_by_input" = "kind=complexity; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=w>=R/(n-1) 推出 floor(R/w)+1<=n，桶空间随元素数线性而非随 10^9 值域增长。"
"numeric.widened_bucket_arithmetic" = "kind=numeric; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=值域、上取整分子、桶号分子和跨桶差均在运算前提升到 64 位，最终答案不超过 10^9。"
"adapter.c_gap_bucket_allocation_failure" = "kind=language_adapter; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=C calloc 数量由 B<=n 支撑，成功路径 free；失败只能返回与合法结果不可区分的 0，明确为接口限制。"
"algorithm.version_significant_span_compare" = "kind=algorithm; introduced=0165; last=0165; occurrences=1; teaching_state=explained; note=每段定位 end、跳零得 significant，以有效位数和等长 ASCII 字典序比较，不解析任意长整数。"
"invariant.missing_revision_equals_zero" = "kind=invariant; introduced=0165; last=0165; occurrences=1; teaching_state=explained; note=全零段与已结束侧的缺失修订号都规范为有效长度 0；较短版本结束后仍逐段核对非零尾部。"
"proof.decimal_span_numeric_order" = "kind=proof; introduced=0165; last=0165; occurrences=1; teaching_state=explained; note=无前导零十进制串先由位数定序，等长时首个不同高位定序；首次不同修订号决定版本关系。"
"invariant.version_scanner_progress" = "kind=invariant; introduced=0165; last=0165; occurrences=1; teaching_state=explained; note=循环继续时至少一侧未结束，该侧跨过一个合法非空段并严格前进；结束侧可停留为缺失零段而不死循环。"
"string.ascii_segment_scanning" = "kind=string; introduced=0165; last=0165; occurrences=1; teaching_state=explained; note=ASCII 合同支撑 Rust/Go 字节扫描；Julia codeunits 是轻量包装，R utf8ToInt 物化 O(n+m) 整数向量。"
"complexity.version_interface_materialization" = "kind=complexity; introduced=0165; last=0165; occurrences=1; teaching_state=explained; note=核心扫描 O(n+m) 时间/O(1) 索引；另计 C++ 按值副本、Java/TS 短命段对象、Rust 所有权与 R 输入物化。"
"algorithm.long_division_remainder_position_map" = "kind=algorithm; introduced=0166; last=0166; occurrences=1; teaching_state=explained; note=整数部分后以当前非零余数为状态，在乘十前记录 remainder->next_digit_position；余数重复时在首次位置插入左括号。"
"invariant.exact_fraction_decimal_prefix" = "kind=invariant; introduced=0166; last=0166; occurrences=1; teaching_state=explained; note=生成 k 位后保持 N/D=q+sum(d_i/10^i)+r_k/(D*10^k)，且 0<=r_k<D；每轮 10r=dD+r' 精确延伸一位。"
"proof.remainder_finite_or_cycle_dichotomy" = "kind=proof; introduced=0166; last=0166; occurrences=1; teaching_state=explained; note=余数为零恰好有限终止；否则非零余数来自有限集合且转移确定，首次重复状态给出函数图的环入口和循环部分。"
"numeric.widen_before_abs_signed_minimum" = "kind=numeric; introduced=0166; last=0166; occurrences=1; teaching_state=reinforced; note=分子分母先从 32 位提升至 64 位，再取绝对值和处理符号，覆盖 -2^31；零分子先返回避免负零。"
"complexity.output_sensitive_recurring_decimal" = "kind=complexity; introduced=0166; last=0166; occurrences=1; teaching_state=explained; note=以生成位数 L 和不同余数 r 报告期望 O(L) 时间、O(L+r) 空间、一次括号插入 O(L)；哈希极端冲突最坏可达 O(L^2)。"
"resource.c_transactional_builder_and_remainder_hash" = "kind=language_adapter; introduced=0166; last=0166; occurrences=1; teaching_state=explained; note=C 动态字符串检查终止符容量和 realloc，开放寻址表保持二次幂容量并失败清理；成功返回堆字符串所有权。"
"language.javascript_r_exact_integer_range" = "kind=language_adapter; introduced=0166; last=0166; occurrences=1; teaching_state=explained; note=TypeScript/R 的最大 remainder*10 约 2.15e10，低于 2^53；不使用 JS 32 位位运算，R 用固定槽与 environment 避免逐位向量重建。"
"algorithm.sorted_two_pointer_elimination" = "kind=algorithm; introduced=0167; last=0167; occurrences=1; teaching_state=explained; note=在非递减数组两端维护候选区间，和过小时排除左端，和过大时排除右端，命中时返回一基下标。"
"invariant.two_sum_solution_interval" = "kind=invariant; introduced=0167; last=0167; occurrences=1; teaching_state=explained; note=尚未返回时唯一解始终位于 [left,right]；区间外端点均已由单调不等式证明不可能参与解。"
"proof.monotone_endpoint_exclusion" = "kind=proof; introduced=0167; last=0167; occurrences=1; teaching_state=explained; note=sum<target 时 left 与区间内任意元素配对都过小；sum>target 时 right 与区间内任意元素配对都过大。"
"adapter.one_based_index_contract" = "kind=language_adapter; introduced=0167; last=0167; occurrences=1; teaching_state=explained; note=C/C++/Python/Java/Rust/Go/TS/C# 内部零基返回前加一；Julia/R 内部已一基，不能重复加一。"
"resource.c_fixed_pair_return" = "kind=resource; introduced=0167; last=0167; occurrences=1; teaching_state=explained; note=C 成功时分配两个 int 并设置 returnSize=2；分配失败保持长度 0，返回所有权交给调用者。"
"algorithm.bijective_base26_decrement" = "kind=algorithm; introduced=0168; last=0168; occurrences=1; teaching_state=explained; note=每轮先 current-1，再以 26 取余映射 A..Z，高位商继续编码，最后反转低位优先字符。"
"invariant.column_title_place_value" = "kind=invariant; introduced=0168; last=0168; occurrences=1; teaching_state=explained; note=N=current*26^k+sum(x_i*26^i)，其中已生成 x_i 属于 1..26；每轮由 current=26q+x_k 保持。"
"proof.bijective_base26_uniqueness" = "kind=proof; introduced=0168; last=0168; occurrences=1; teaching_state=explained; note=(current-1) 的欧几里得商余唯一决定最低位与剩余高位，递归应用推出标题表示唯一。"
"complexity.title_output_payload" = "kind=complexity; introduced=0168; last=0168; occurrences=1; teaching_state=explained; note=循环、反转和字符串构造均为 O(L)，字符缓冲与返回字符串为 O(L)，不能把返回载荷忽略为常数。"
"numeric.column_title_32bit_length" = "kind=numeric; introduced=0168; last=0168; occurrences=1; teaching_state=explained; note=2^31-1 对应 FXSHRXW，当前输入域标题最多 7 位；C/C#/R 固定缓冲容量由该上界支撑。"
"algorithm.boyer_moore_majority_vote" = "kind=algorithm; introduced=0169; last=0169; occurrences=1; teaching_state=explained; note=用 candidate 与 balance 压缩异值成对抵消；题目保证严格多数存在时最终候选可直接返回。"
"invariant.majority_unpaired_partition" = "kind=invariant; introduced=0169; last=0169; occurrences=1; teaching_state=explained; note=任意已处理前缀可划分为若干异值对和 balance 个 candidate；balance 不是候选真实频次。"
"proof.strict_majority_survives_cancellation" = "kind=proof; introduced=0169; last=0169; occurrences=1; teaching_state=explained; note=删除任意异值对后 2m>n 的严格多数关系保持，因此真正多数不可能被全部抵消。"
"contract.majority_verification_precondition" = "kind=contract; introduced=0169; last=0169; occurrences=1; teaching_state=explained; note=官方保证多数存在，故省略第二遍；扩展到任意输入时必须验证最终候选频次。"
"algorithm.bijective_base26_decode" = "kind=algorithm; introduced=0171; last=0171; occurrences=1; teaching_state=explained; note=按 A=1..Z=26 从左到右执行 answer=answer*26+digit；解码侧不使用 0168 的先减一。"
"invariant.column_number_prefix_fold" = "kind=invariant; introduced=0171; last=0171; occurrences=1; teaching_state=explained; note=处理前 k 位后累计值恰等于该标题前缀的位权和，读下一位时整体乘 26 再加数位。"
