"algorithm.tree_decimal_prefix_accumulation" = "kind=algorithm; introduced=0129; last=0129; occurrences=1; teaching_state=explained; note=沿根到节点路径维护 prefix*10+digit，使每层只携带一个数值状态。"
"boundary.leaf_requires_no_children" = "kind=boundary; introduced=0129; last=0129; occurrences=1; teaching_state=explained; note=只有左右孩子都为空才是叶节点；单侧缺失不能提前结算路径。"
"algorithm.boundary_connected_complement" = "kind=algorithm; introduced=0130; last=0130; occurrences=1; teaching_state=explained; note=先标记所有与边界连通的 O，剩余 O 恰好是被包围区域。"
"algorithm.grid_mark_on_enqueue" = "kind=algorithm; introduced=0130; last=0130; occurrences=1; teaching_state=explained; note=网格 BFS 在入队时标记，防止同一单元格被多个邻居重复加入队列。"
"algorithm.palindrome_interval_dp" = "kind=algorithm; introduced=0131; last=0131; occurrences=1; teaching_state=explained; note=按起点从右向左预计算回文闭区间，使回溯查询为 O(1)。"
"proof.partition_cut_sequence_unique" = "kind=proof; introduced=0131; last=0131; occurrences=1; teaching_state=explained; note=每个分割由严格递增的片段终点序列唯一确定，因此回溯枚举无重复。"
