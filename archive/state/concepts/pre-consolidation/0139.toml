"algorithm.word_break_reachable_prefix" = "kind=algorithm; introduced=0139; last=0139; occurrences=1; teaching_state=explained; note=把 0..n 字符边界视为 DAG 顶点；reachable[i] 表示长度 i 的前缀可由字典词完整覆盖，只从可达起点沿真实匹配边向右传播。"
"proof.word_break_last_token_completeness" = "kind=proof; introduced=0139; last=0139; occurrences=1; teaching_state=explained; note=合法性按标记来源归纳；完整性按切分词数归纳，去掉最后一个词所得前缀先可达，循环随后必枚举该末词。"
"complexity.dictionary_character_budget" = "kind=complexity; introduced=0139; last=0139; occurrences=1; teaching_state=explained; note=以字典总字符数 C 表达逐可达起点扫描全部单词的 O(nC) 上界，并分别记录 C++ 按值输入、Julia codeunits 包装和 R 码点物化。"
"language.ascii_coordinate_equivalence" = "kind=language_boundary; introduced=0139; last=0139; occurrences=1; teaching_state=explained; note=官方小写英文字母前提使字节、UTF-16 码元和 Unicode 码点边界重合；十语言实现因此等价，但不能无条件推广到任意 Unicode。"
