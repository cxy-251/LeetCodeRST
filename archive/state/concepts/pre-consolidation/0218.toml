[updates]
"geometry.skyline_half_open_buildings" = "建筑 [left,right,height] 只在 left<=x<right 时活跃；right==x 必须在读取当前高度前失效。"
"sweep.boundary_coordinate_compression" = "高度只可能在左右边界变化；排序去重后每个横坐标整体处理全部开始与结束，避免重复横坐标和中间伪高度。"
"heap.lazy_expiration_by_right_endpoint" = "堆保存 height 与 right；过期非顶部元素暂留无害，成为顶部时持续按 right<=x 清理。"
"invariant.active_building_maximum" = "加入全部 left<=x 建筑并清理过期顶部后，堆顶若存在既活跃又不低于任何活跃建筑，等于当前轮廓高度。"
"output.normalized_skyline_keypoints" = "仅在高度变化时追加 [x,height]，保证横坐标严格递增、相邻高度不同，并在最大右边界回到 0。"
"adapter.c_skyline_owned_rows" = "C 显式分配边界、堆、行指针、列长度与每个二元行；失败释放部分资源，成功所有权交给调用方。"

