[problems."0098"]
status = "reviewed"
file = "problems/0001-0100/0098-validate-binary-search-tree.rst"
positive = [
  "BST 合法性与完整中序序列严格递增的充要关系证明正确，能够检测跨层祖先约束。",
  "has_previous 与 previous 分离表示可选状态，避免 32 位最小值与数据哨兵碰撞。",
  "比较使用 <= 拒绝重复值，显式栈仍保持 O(n) 时间与 O(h) 工作空间。",
]
observations = [
  "用相邻中序前驱检测全局严格有序，依赖输入是无环、唯一父节点的二叉树。",
  "尚无前驱是一种控制状态，不应编码为可能出现在输入域中的普通整数。",
  "布尔接口把分配失败映射为 false 时，需要明确它与算法判定 false 无法区分。",
]
rule_ids = [
  "optional_state_not_data_sentinel",
  "global_order_from_adjacent_witnesses",
  "strict_order_rejects_equal_values",
]

[problems."0099"]
status = "reviewed"
file = "problems/0001-0100/0099-recover-binary-search-tree.rst"
positive = [
  "第一次下降左端和最后一次下降右端同时覆盖相邻与非相邻交换。",
  "扫描阶段只收集两个错误节点，完成见证后才交换值，全部父子链接和节点身份保持不变。",
  "Rust 先分别读取两个值再顺序可变借用，避免 RefCell 借用冲突。",
]
observations = [
  "first 只在首次下降设置，second 在每次下降更新；两者的更新策略不能对称化。",
  "题目保证原 BST 键互异且仅交换两值，因此下降检测使用 >；该条件不能直接复制到允许重复键的模型。",
  "把实际写入延迟到完整扫描后，使 C 栈分配失败和提前退出不会留下半完成修复。",
]
rule_ids = [
  "swapped_order_endpoint_detection",
  "topology_preserving_value_repair",
  "defer_mutation_until_witness_complete",
]

[problems."0100"]
status = "reviewed"
file = "problems/0001-0100/0100-same-tree.rst"
positive = [
  "成对递归状态同时比较对应位置的存在性、值、左子树和右子树，结构归纳完整。",
  "双空为真、单边空为假的对称基例保留全部空位置结构信息。",
  "布尔短路只减少实际访问量，不改变最坏 O(n) 时间和 O(h) 调用栈边界。",
]
observations = [
  "只比较非空节点值序列会丢失空孩子位置，无法证明结构相同。",
  "左右子问题必须同方向配对，交叉配对判断的是镜像而不是相同。",
  "Rust 克隆 Rc 孩子引用只延长共享所有权，不复制或修改输入树。",
]
rule_ids = [
  "paired_structural_recursion",
  "null_position_is_structural_data",
  "short_circuit_preserves_worst_case_bound",
]

[rules."count_state_quotients_irrelevant_labels"]
status = "promoted"
problems = [96]
requirement = "计数 DP 删除具体标签、坐标或身份前，证明任意两个具有同一摘要状态的实例之间存在保持合法结构的双射。"

[rules."wide_intermediate_before_narrow_return"]
status = "promoted"
problems = [96]
requirement = "最终返回值可窄化时，乘法和加法必须先在足够宽的类型中执行；返回范围保证不能修复已经发生的窄类型溢出。"

[rules."compressed_dp_dependency_direction"]
status = "promoted"
problems = [97]
requirement = "一维覆盖二维 DP 时，逐项标明更新前槽位与更新后邻居的语义，并由依赖边确定遍历方向；不能凭习惯选择正序或逆序。"

[rules."adapter_materialization_separate_from_core"]
status = "promoted"
problems = [97]
requirement = "核心工作数组空间与按值参数复制、编码转换、collect、split 等适配器物化分别报告；完整峰值空间取同时存活对象之和。"

[rules."optional_state_not_data_sentinel"]
status = "promoted"
problems = [98]
requirement = "尚未初始化、无前驱或无边界属于控制状态时，使用独立标志、Option 或可空引用，不能选择输入域内普通值充当哨兵。"

[rules."global_order_from_adjacent_witnesses"]
status = "promoted"
problems = [98, 99]
requirement = "用相邻下降证明全局有序或定位异常时，先证明遍历序列覆盖全部对象，以及全局违规必然产生可检测的相邻见证。"

[rules."swapped_order_endpoint_detection"]
status = "promoted"
problems = [99]
requirement = "恢复严格递增序列中的两值交换时，第一次下降保存左端，之后每次下降更新右端，并分别证明一次下降与两次下降情形。"

[rules."defer_mutation_until_witness_complete"]
status = "promoted"
problems = [99]
requirement = "修复算法先完成见证收集和资源申请，再集中执行不可逆写入；失败或提前退出路径不得留下部分修改状态。"

[rules."paired_structural_recursion"]
status = "promoted"
problems = [100]
requirement = "比较两棵树或嵌套结构时，以对应位置对作为递归状态，同时检查空性、当前载荷和同方向子结构。"

[rules."null_position_is_structural_data"]
status = "promoted"
problems = [100]
requirement = "结构比较或序列化必须保留空位置；忽略 null 标记的值遍历不能作为树结构相等证据。"

