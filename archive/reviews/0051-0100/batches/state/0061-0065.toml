[problems."0061"]
status = "reviewed"
file = "problems/0001-0100/0061-rotate-list.rst"
positive = [
  "先以 k mod n 消除整圈旋转，再通过临时成环和目标断点重连，切分位置、节点守恒与最终无环证明完整。",
  "验证计划要求比较节点身份、节点集合和最终无环，不会被相同节点值掩盖拓扑错误。",
  "Rust 不强行构造 Box 引用环，而是用 take 分离后缀并移动旧前缀，得到等价线性所有权变换。",
]
observations = [
  "临时成环使中间结构短暂违反输入无环不变量；所有成环后的控制流必须唯一汇聚到断环，新增提前返回时需要重新审计。",
  "跨语言算法不必逐语句同构；当所有权模型不允许环时，应证明线性断开拼接与环断开在节点身份和最终顺序上等价。",
  "仅比较值序列不足以验证原地链表算法；重复值情况下必须检查节点身份、节点数和环状态。",
]
rule_ids = [
  "temporary_topology_restoration",
  "ownership_equivalent_topology_transform",
  "identity_based_mutation_validation",
