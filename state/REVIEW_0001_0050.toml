[review]
mode = "prospective_rules_only"
source = "complete_rst_content"
start = 1
end = 50
current = 6
reviewed_count = 5
modify_historical_rst = false
pr_metadata_is_evidence = false
status = "in_progress"

[batch]
start = 1
end = 5
status = "completed"
summary = "完整读取 0001-0005 的 RST 正文，只提炼 0051-0100 的前向规则，不修改历史题目。"

[problems."0001"]
status = "reviewed"
file = "problems/0001-0100/0001-two-sum.rst"
observations = [
  "哈希表复杂度需要统一区分期望与最坏情况。",
  "标准库导入或平台预置边界需要明确。",
]
rule_ids = ["hash_expected_and_worst", "explicit_import_boundary"]

[problems."0002"]
status = "reviewed"
file = "problems/0001-0100/0002-add-two-numbers.rst"
observations = [
  "C 分配失败返回部分链表，会把不完整结果伪装成正常答案。",
  "Rust 通过 take 消费输入所有权，输入消费语义应明确。",
]
rule_ids = ["failure_path_not_partial_answer", "input_mutation_and_ownership"]

[problems."0003"]
status = "reviewed"
file = "problems/0001-0100/0003-longest-substring-without-repeating-characters.rst"
observations = [
  "字符单位需要绑定精确题目约束，不能只写常见测试字符。",
  "Go 的 []byte 和 R 的 strsplit 产生 O(n) 输入复制，复杂度未单独计入。",
]
rule_ids = ["exact_character_model", "language_specific_copy_cost"]

[problems."0004"]
status = "reviewed"
file = "problems/0001-0100/0004-median-of-two-sorted-arrays.rst"
observations = [
  "证明覆盖合法分割结果，但二分方向、排除安全性和存在性需要更完整。",
  "不可达路径返回 0.0 会与合法答案混淆。",
  "Go max/min 存在版本前提，正文未声明。",
]
rule_ids = [
  "binary_search_direction_proof",
  "impossible_path_not_valid_value",
  "version_dependent_api",
]

[problems."0005"]
status = "reviewed"
file = "problems/0001-0100/0005-longest-palindromic-substring.rst"
observations = [
  "字符单位仍需要绑定精确约束。",
  "Julia collect 和 R strsplit 产生 O(n) 输入规范化空间。",
  "返回子串复制成本需要按语言真实语义说明。",
]
rule_ids = [
  "exact_character_model",
  "language_specific_copy_cost",
  "return_copy_cost",
]

[rules."hash_expected_and_worst"]
status = "promoted"
first_problem = 1
problems = [1]
requirement = "使用哈希表时区分期望、平均与最坏复杂度，说明实现或题目约束。"

[rules."explicit_import_boundary"]
status = "promoted"
first_problem = 1
problems = [1, 3]
requirement = "每种语言包含必要导入，或明确说明由平台预置。"

[rules."failure_path_not_partial_answer"]
status = "promoted"
first_problem = 2
problems = [2]
requirement = "失败路径不得返回部分结果或看似合法的普通答案。"

[rules."input_mutation_and_ownership"]
status = "promoted"
first_problem = 2
problems = [2]
requirement = "输入被消费、移动、排序或原地修改时必须明确说明。"

[rules."exact_character_model"]
status = "promoted"
first_problem = 3
problems = [3, 5]
requirement = "字符串题先写精确字符约束，再定义字节、代码单元、码点或字形簇模型。"

[rules."language_specific_copy_cost"]
status = "promoted"
first_problem = 3
problems = [3, 5]
requirement = "计入 []byte、collect、strsplit、切片和重新编码等语言特有复制成本。"

[rules."binary_search_direction_proof"]
status = "promoted"
first_problem = 4
problems = [4]
requirement = "二分证明覆盖搜索区间、移动方向、排除安全性、存在性和终止性。"

[rules."impossible_path_not_valid_value"]
status = "promoted"
first_problem = 4
problems = [4]
requirement = "不可达或失败路径不得返回可能合法的默认值。"

[rules."version_dependent_api"]
status = "promoted"
first_problem = 4
problems = [4]
requirement = "版本相关 API 声明最低版本，或改用兼容辅助函数。"

[rules."return_copy_cost"]
status = "promoted"
first_problem = 5
problems = [5]
requirement = "字符串或集合返回值的复制成本按目标语言真实语义说明。"

[next_batch]
start = 6
end = 10
purpose = "完整读取 0006-0010 的 RST，继续提炼前向规则，不修改历史题目。"
