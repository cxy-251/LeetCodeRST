[rules."return_copy_cost"]
status = "promoted"
first_problem = 5
problems = [5, 14]
requirement = "字符串或集合返回值的复制成本按目标语言真实语义说明。"

[rules."index_type_consistency"]
status = "promoted"
first_problem = 6
problems = [6]
requirement = "循环下标、容器长度和差值使用一致且可证明安全的类型，避免有符号与无符号混用和下溢。"

[rules."shared_derivation_no_duplication"]
status = "promoted"
first_problem = 7
problems = [7, 8]
requirement = "一个核心推导只保留一个完整主位置；后续章节和复现题只引用结论并解释新增差异，避免重复堆叠。"

[rules."widen_before_arithmetic"]
status = "promoted"
first_problem = 7
problems = [7, 8, 11, 15]
requirement = "边界常量和危险中间表达式必须先把操作数扩宽再运算；内部宽类型不能改变平台要求的外部返回类型。"

[rules."numeric_complexity_domain"]
status = "promoted"
first_problem = 9
problems = [9]
requirement = "整数逐位算法优先以位数 d 表示复杂度；使用对数时写 O(log(|x|+1)) 或明确限定 x > 0。"

[rules."r_mutable_memo_cost"]
status = "promoted"
first_problem = 10
problems = [10]
requirement = "R 的 <<- 只表示父绑定更新，不自动保证矩阵或列表单元为 O(1) 原地写入；记忆化优先使用 environment，或单独证明复制成本。"

[rules."recursion_depth_against_constraints"]
status = "promoted"
first_problem = 10
problems = [10]
requirement = "递归解法必须把最坏深度与题目长度约束和目标语言栈限制对应；无法保证时改用迭代或显式栈。"

[rules."platform_signature_exact"]
status = "promoted"
first_problem = 11
problems = [11]
requirement = "内部可使用宽类型，但公开函数名、参数、返回类型和返回结构必须与平台接口完全一致。"

[rules."constraint_derived_numeric_width"]
status = "promoted"
first_problem = 11
problems = [11, 15]
requirement = "先列出精确输入上界，再证明加法、乘法、下标差和返回值需要的数值宽度；禁止使用常见约束代替证明。"

[rules."greedy_exchange_or_canonical_proof"]
status = "promoted"
first_problem = 12
problems = [12]
requirement = "贪心题必须用交换论证、上界排除或规范表示语法证明局部选择，不得只声称更自然或更短。"

[rules."fixed_capacity_bound_proof"]
status = "promoted"
first_problem = 12
problems = [12]
requirement = "固定缓冲区容量必须由输入约束和最大输出长度推导，并保留终止符或元数据空间。"

[rules."fixed_domain_vs_output_complexity"]
status = "promoted"
first_problem = 12
problems = [12]
requirement = "输入域有固定上界时，同时说明题目约束下的常数界与推广模型下按输出长度或输入规模表示的复杂度。"

[rules."valid_input_precondition_contract"]
status = "promoted"
first_problem = 13
problems = [13, 14]
requirement = "依赖非空、合法字符或有效语法等题目保证时明确写成前提；不要添加不完整的伪校验，也不要把默认值伪装成通用错误处理。"

[rules."preprocess_once_outside_hot_loop"]
status = "promoted"
first_problem = 14
problems = [14]
requirement = "整串解码、字符向量转换、哈希构建和排序等 O(n) 预处理不得放进内层循环；预处理一次并计入复杂度。"

[rules."realloc_transactional_update"]
status = "promoted"
first_problem = 15
problems = [15]
requirement = "C 的 realloc 使用临时指针并在全部相关扩容成功后提交；失败时保留旧指针、清理已分配资源并保持并行数组一致。"

[rules."empty_range_guard"]
status = "promoted"
first_problem = 15
problems = [15]
requirement = "Julia、R 等语言中可能为空的循环范围必须先守卫或使用安全序列构造，禁止让 a:b 在 a>b 时形成意外递减序列。"

