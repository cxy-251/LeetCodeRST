[contract]
schema_version = 2
batch_id = "quality-repair-0146"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [146]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0146 需要在十语言中同时承载对象接口、哈希定位、双向链表拓扑、容量淘汰、分配失败和所有权替代；单题完整返工优先于难度分数目标。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0138-copy-list-with-random-pointer.rst",
  "problems/0101-0200/0143-reorder-list.rst",
  "state/concepts/0146.toml",
]
fact_sources_may_provide = [
  "节点身份、哈希定位、链表断接和引用对象术语",
  "C 分配责任、Rust 所有权与 R environment 的事实连续性",
  "当前范围、进度和既有概念记录",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0146"]
title = "LRU Cache"
difficulty = "Medium"
primary_risks = [
  "构造器固定正容量；get 命中和 put 更新都必须刷新最近使用顺序，get 未命中返回 -1，插入新键满容时淘汰唯一最久未使用项",
  "状态必须同时保持哈希表键到节点的唯一映射、双向链表从 MRU 到 LRU 的严格顺序、有效节点数不超过容量以及两个哨兵边界完整",
  "摘除、头插、更新、插入和淘汰的更新顺序若不同步，会产生悬空哈希项、重复键、断链、环或错误 size",
  "平均 O(1) 依赖哈希容器平均界和已知节点双向摘除；任何扫描链表找键、扫描最小时间戳或线性删除都不满足操作合同",
  "C 构造、桶数组、节点池、失败清理、victim 复用和 free 必须闭合；void put 发生分配失败时不能留下部分状态或伪装成成功插入",
  "Rust 需要可通过借用检查的安全结构，可用键到稳定索引与预分配节点池替代自引用裸指针；必须重新证明槽位复用、索引合法和空间界",
  "R environment 的映射键、节点 prev/next 引用和缓存对象修改可见性需要明确；Julia mutable node、JavaScript Map 和各语言标准容器接口不得机械同构",
]
minimum_static_review = [
  "人工逐操作推演 capacity=2 的插入、命中刷新、更新已有键、满容淘汰、淘汰后未命中与再插入，并覆盖 capacity=1 和重复 put",
  "每次操作后列出 MRU 到 LRU 键序列、哈希键集合、size 与哨兵相邻关系，核对 map/list 双射和容量不变量",
  "逐辅助操作静态证明 detach、push_front、remove_lru 的前置条件、修改边、保持条件和有限终止",
  "逐语言检查构造器及 get/put 命名、缺失哨兵、键值域、引用或迭代器稳定性、哈希平均界和对象状态持久性",
  "专项审查 C 容量算术、整体分配、节点复用、哈希桶增删、全部释放路径以及 put 无错误返回接口的失败语义",
  "专项审查 Rust 稳定索引池、HashMap 更新、同一 Vec 的多节点修改借用路径和淘汰槽复用；禁止 unsafe 或伪自引用代码",
  "专项审查 R environment 键编码和共享修改、Julia 可变节点、C++ list iterator、Java/C#/Go/TypeScript/Python 容器语义",
]

must_preserve = [
  "精确对象契约、完整自建操作序列和能区分错误刷新顺序的反例",
  "哈希表与双向链表组合的解法取舍、状态字段和每个辅助操作的变量映射",
  "map/list 双射、MRU-LRU 顺序、容量、哨兵拓扑和 size 的完整不变量",
  "get 未命中、get 命中、put 更新、put 新增未满、put 新增已满五类路径的保持与返回证明",
  "平均 O(1) 操作界、最坏哈希退化、O(capacity) 状态及各语言分配和对象成本",
  "十语言完整类或对象实现，C 与 Rust 使用真实资源和所有权安全路径",
  "准确静态审查证据、失败路径、学习链和带答案自检",
]

forbidden = [
  "参考 0143–0145 或其他最近题目的章节结构",
  "只说哈希加链表所以 O(1) 而不证明结构同步",
  "get 命中不刷新、put 更新重复创建节点或淘汰后保留哈希项",
  "通过扫描链表、时间戳数组或全表寻找最久未使用项",
  "C realloc 或分配失败后留下半更新结构、泄漏节点或让 size 与真实节点数不一致",
  "Rust 使用 unsafe、裸自引用指针或无法通过借用检查的伪代码",
  "把哈希操作最坏界无条件写成 O(1)",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "当前题逐项对照合同选定的 0050 与 0076 黄金题",
  "命中 DRIFT_LOG 的回归检查均通过",
  "0146 只有一个自包含 RST，十语言代码全部内联",
  "PROGRESS、README、AGENTS 当前状态、范围索引和知识账本同步",
  "原子提交后 BATCH_CONTRACT 被替换为下一批合同",
]
