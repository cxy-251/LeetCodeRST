[budget]
algorithm_score = 2
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "medium"
scope_may_shrink = false
scope_reason = "0179 单题的严格弱序证明、十种排序接口、C 资源路径和 R 自定义归并已构成高风险批次；完成后再跳到 0187。"

[references]
style_baselines = [
  "problems/0001-0100/0001-two-sum.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
style_roles = [
  "0001 提供紧凑数组契约、C 返回所有权、十语言容器接口和失败路径基线",
  "0076 提供全局最优性、不变量、局部安全性证明与字符串适配成本基线",
]
fact_sources = [
  "state/PROGRESS.toml",
