[contract]
schema_version = 2
batch_id = "generation-0217"
status = "ready"
phase = "generation"
kind = "generation"
scope = [217]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 218

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 1
target_min = 1
target_max = 2
proof_risk = "medium"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "medium"
scope_may_shrink = false
scope_reason = "0217 虽为 Easy，但 C 开放寻址需要安全容量、负数与整数极值哈希、独立占用标记和失败语义；R 环境键必须无歧义，且所有语言都要准确区分哈希平均复杂度与最坏复杂度。本批只处理 0217，不追加 0218。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0201-0300/0216-combination-sum-iii.rst",
  "https://leetcode.com/problems/contains-duplicate/description/",
]
fact_sources_may_provide = [
  "0217 判断数组中是否存在至少一对下标不同且值相同元素的合同",
  "当前目录、完成范围和静态审查状态",
  "已有哈希集合、输入只读和整数适配术语连续性",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0217"]
title = "Contains Duplicate"
difficulty = "Easy"
primary_risks = [
  "扫描元素时先查询已见集合；命中返回 true，未命中再插入",
  "必须证明首次命中对应更早的同值元素，扫描结束未命中则所有元素两两不同",
  "重复可能相邻或远隔，负数、零、INT_MIN 和 INT_MAX 都按整数值比较",
  "哈希集合方法平均 O(n) 时间、O(n) 空间；不能把对抗碰撞下的最坏情况写成保证线性",
  "C 开放寻址必须使用独立 occupied 数组区分空槽和任意合法 int 值",
  "C 容量应保持低负载并安全计算至少 2*n 的二次幂；长度乘法、分配失败和清理必须完整",
  "C 哈希必须先把有符号 int 映射到固定宽度无符号值，不能对负数直接取可能为负的数组下标",
  "R 环境字符串键必须对负数、零和极值保持一一对应；TypeScript Set、Julia Set 和托管语言集合语义需准确",
  "排序方案会修改输入或复制数组，不能在采用哈希方案时混淆其资源合同",
]
minimum_static_review = [
  "人工推演 [1,2,3,1]、[1,2,3,4]、[1,1]、单元素、负数、零、整数极值和远距离重复",
  "证明 seen 在扫描位置 i 前恰好包含 nums[0:i] 的值集合",
  "证明集合命中与存在更早相同元素双向对应",
  "逐语言核对集合键相等语义、输入只读、平均/最坏复杂度和额外空间",
  "专项核对 C 容量溢出、occupied 标记、探测终止、负数哈希、分配失败和释放",
  "专项核对 R 环境键编码不会把不同整数映射为同一字符串",
]

must_preserve = [
  "已见集合不变量与正确性双向证明",
  "哈希平均/最坏复杂度边界和输入只读合同",
  "C 开放寻址容量、占用标记、负数哈希和失败清理",
  "R 无歧义整数键与十语言集合适配",
  "固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0216 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "把哈希最坏复杂度写成保证 O(n)",
  "C 使用某个整数哨兵表示空槽并与合法输入值冲突",
  "C 对负整数直接取模后未经处理作为数组下标",
  "排序修改输入却声称输入保持只读",
  "R 使用格式不稳定或可能碰撞的整数键",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "对照 0050 的状态/数值边界和 0076 的资源深度",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "单题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
