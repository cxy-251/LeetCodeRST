  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problem]
id = 179
title = "Largest Number"
path = "problems/0101-0200/0179-largest-number.rst"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "核对比较器只在 ab>ba 时把 a 放在 b 前，不能按整数值、普通字典序、长度或前缀启发式排序",
  "核对 ab 与 ba 为等长 ASCII 数字串，字典序等于数值顺序；实现不得解析可能溢出的拼接整数",
  "核对虚拟拼接的 m+n 个字符映射与首个差异，等价项返回 equal/false 而非强造顺序",
  "证明有限 ab/ba 比较与无限周期串顺序一致，并由此建立非自反、不对称、传递和等价类传递性",
  "用相邻交换证明任意排列可不减地转为排序排列，并证明等价项和排序稳定性不影响最终拼接",
  "核对首项为 0 当且仅当全部输入为 0，返回单个 0；其他结果保留完整 Theta(D) 输出载荷",
  "逐语言核对 qsort/std::sort/cmp_to_key/List.sort/sort_by/sort.Slice/Array.sort/List.Sort/sort! 的比较方向和等价语义",
  "核对十语言只比较 ASCII 十进制字节或代码单元，字符串化 10^9、总长度 D、构建器容量和输入不修改",
  "核对 C 的 calloc、snprintf 两阶段转换、比较器无分配、长度乘加、部分清理、答案终止符和返回所有权",
  "核对 R 底向上归并覆盖每轮全部槽位、宽度倍增、尾段边界、记录字节物化和 O(n) 工作缓冲",
  "审计拼接比较器、交换证明、排序合同和输出归一化与既有稳定 concept 的关系，禁止近义重复",
]

minimum_static_review = [
  "人工推演 [10,2]、[3,30,34,5,9]、[0,0]、[121,12]、[8308,830] 与等价周期 [12,1212]",
  "选择三个字符串核对比较传递链，并完整复核周期串严格弱序、相邻交换、等价类和全零证明",
  "逐语言核对公开签名、排序 API 比较方向、相等返回、ASCII 单位、输入所有权、字符串构建和输出载荷",
  "纸面推演 R 在奇数 n 和非二次幂 n 下的归并轮次，核对 C 每个分配失败点的清理集合",
  "知识账本只从 state/concepts 的五十题平面状态读取，完成后越过 Database 与 Premium 登记把入口推进到 0187",
]

must_preserve = [
  "精确字符串合同、数值与前缀反例、虚拟拼接、周期串严格弱序、相邻交换和全零规范化证明",
  "固定十语言实现、C 无分配比较器和失败清理、R 自定义归并、真实 D 载荷、静态审查和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "按整数值、普通字典序或长度排序，构造并解析拼接整数，或只凭示例声称比较器可传递",
  "把一种排序 API 的负值、布尔值或 Ordering 方向外推为十语言一致",
  "忽略等价项、全零归一化、临时字符串分配、返回载荷或 R 归并工作缓冲",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

[completion]
required = [
  "正文只在审查发现明确问题时修改",
