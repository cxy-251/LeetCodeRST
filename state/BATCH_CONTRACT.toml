[contract]
schema_version = 2
batch_id = "historical-review-0189-0191"
status = "ready"
phase = "historical_review"
kind = "targeted_review"
scope = [189, 190, 191]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true
next_review_after_batch = 198

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "medium"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0189 为 Medium 原地数组变换，0190–0191 为连续 Easy 固定宽位题，总分 4；三题共享索引与跨语言数值审查，但原地可见性和无符号适配均为高风险。若后一题开始压缩证明或语言说明，只提交完整连续前缀并同步下一入口。"

[references]
style_baselines = [
  "problems/0001-0100/0001-two-sum.rst",
  "problems/0001-0100/0050-powx-n.rst",
]
style_roles = [
  "0001 提供紧凑数组题仍保留契约、状态、证明、接口和十语言语义的基线",
  "0050 提供固定宽整数、位级循环状态、终止证明和跨语言数值边界基线",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "state/concepts/0101-0150.toml",
  "state/concepts/0151-0200.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0136-single-number.rst",
  "https://leetcode.com/problems/rotate-array/description/",
  "https://leetcode.com/problems/reverse-bits/description/",
  "https://leetcode.com/problems/number-of-1-bits/description/",
]
fact_sources_may_provide = [
  "0189 的数组右旋、原地目标、k 规范化、输入范围和语言变异接口",
  "0190 的固定 32 位无符号输入、位序反转合同和前导零语义",
  "0191 的 32 位汉明重量、最低有效 1 消除与计数范围",
  "既有数组索引、固定宽位模式、TypeScript/R 无符号适配和 concept 连续性",
  "0192–0195 已登记 Shell、0196–0197 已登记 Database，下一公开算法题为 0198",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problems."0189"]
title = "Rotate Array"
path = "problems/0101-0200/0189-rotate-array.rst"
difficulty = "Medium"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "右旋 k 步必须先做 k mod n；不能把方向写成左旋，也不能在空扩展、n=1 或 k=0 时构造错误区间",
  "三次反转顺序应为全数组、前 shift 项、后 n-shift 项；证明需说明每段元素相对顺序如何恢复",
  "主算法要求 O(1) 核心额外空间；不能复制完整数组后仍宣称所有语言都原地常数空间",
  "C 至 Julia 应修改调用者可见数组；R 普通向量局部绑定应返回结果，不能宣称调用者绑定原地改变",
  "逐语言核对取模、闭区间端点、交换类型、一基坐标、空范围、输入可变性和公开返回约定",
  "审计三次反转、闭区间不变量和数组变异 concept，优先复用既有旋转、原地修改与边界知识",
]
minimum_static_review = [
  "人工推演 [1,2,3,4,5,6,7],k=3、[-1,-100,3,99],k=6、k=0、k>n、n=1、重复元素和空扩展",
  "证明 rev(A+B)=rev(B)+rev(A) 与两段恢复得到 B+A，并核对每个位置最终归属",
  "逐语言核对接口、取模、反转端点、交换、原地可见性、R 返回适配和 O(1) 核心空间",
]

[problems."0190"]
title = "Reverse Bits"
path = "problems/0101-0200/0190-reverse-bits.rst"
difficulty = "Easy"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "必须处理恰好 32 位，包括输入前导零；不能只循环到数值变为 0 而遗漏剩余输出位置",
  "循环不变量需说明已处理低位如何按反序进入 answer，未处理位仍如何保留在 input 中",
  "C/C++/Rust/Go/C# 使用无符号 32 位，Java 使用逻辑右移，TypeScript 每轮与返回前规范为无符号",
  "R 没有直接无符号 32 位整数结果域，应使用精确 double 的除二取余适配，避免 bitw 符号解释",
  "逐语言核对左移截断、逻辑右移、位模式与显示数值的区别、返回类型和输入是否消费",
  "审计固定宽反转与既有位模式适配 concept，不为通用 32 位无符号语义新造近义 ID",
]
minimum_static_review = [
  "人工推演标准位串、全零、最低位 1、最高位 1 和全 1，始终保留完整 32 位位置",
  "证明 32 轮循环不变量、每个输入位的唯一目标位置和终止后位序完全反转",
  "逐语言核对逻辑右移、32 位截断、无符号返回解释、TypeScript 规范化和 R 精确域",
]

[problems."0191"]
title = "Number of 1 Bits"
path = "problems/0101-0200/0191-number-of-1-bits.rst"
difficulty = "Easy"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "n & (n-1) 每轮必须恰好清除最低有效 1；证明不能只用样例代替位级必要性",
  "循环不变量需把已计数置位与 value 剩余置位建立守恒，终止次数恰为汉明重量",
  "Java/TypeScript 的有符号显示不改变 32 位模式；TypeScript 每轮需保持无符号规范化",
  "R 的固定 32 轮除二取余是独立适配器，应单独说明状态、正确性和固定常数成本",
  "不能对最高位为 1 的 Java int 使用算术右移循环并导致永不归零",
  "审计最低 1 消除、位计数与跨语言无符号 concept，优先强化 0190 的稳定适配 ID",
]
minimum_static_review = [
  "人工推演 11、128、0、2^31 和 2^32-1，核对每轮清除或取余结果",
  "证明最低有效 1 消除、计数守恒、循环次数、终止和结果范围 0..32",
  "逐语言核对位模式、溢出语义、无符号规范化、R 特化状态和输入不修改",
]

must_preserve = [
  "0189 的右旋方向、k 规范化、三次反转证明、原地合同和 R 适配差异",
  "0190 的固定 32 轮反转、前导零、逻辑右移和跨语言无符号语义",
  "0191 的最低有效 1 消除证明、计数不变量和 Java/TypeScript/R 特化语义",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "0189 复制完整数组却声明 O(1) 核心空间，或把右旋写成左旋",
  "0190 只循环到输入变 0，或在 Java 使用算术右移",
  "0191 对负 Java int 使用算术右移循环，或把位计数解释为数值正负",
  "把一种语言的无符号、位移、原地修改或返回语义外推为十语言一致",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

[completion]
required = [
  "按 0189、0190、0191 顺序逐题审查，后一题出现压缩迹象时只提交完整连续前缀",
  "正文只在审查发现明确问题时修改",
  "知识账本保留稳定 concept ID，并准确区分首次引入、强化和关联",
  "PROGRESS、REVIEW_INDEX 与下一份 BATCH_CONTRACT 同步到下一公开算法题 0198",
  "不修改完成题数和 0219 的生成进度事实",
  "一个原子 main 提交，不创建分支或 PR",
]
