  "https://leetcode.com/problems/minimum-size-subarray-sum/description/",
]
fact_sources_may_provide = [
  "0207 的课程编号、先修对方向、可完成判定、重复边和标量返回合同",
  "0208 的小写英文字母单词、insert/search/startsWith 操作序列和对象接口合同",
