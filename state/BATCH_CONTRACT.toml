[contract]
schema_version = 2
batch_id = "generation-0210-0211"
status = "ready"
phase = "generation"
kind = "generation"
scope = [210, 211]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 212

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0210 要在与 0207 相同的依赖图上返回实际拓扑序并区分无解空结果，涉及 C 输出数组和非唯一顺序；0211 在状态化 Trie 上加入点号通配符分支 DFS，涉及最坏搜索规模、递归深度和对象生命周期。先完整验收 0210；若继续 0211 会压缩通配符证明或十语言资源边界，则提交连续前缀并重建 0211 单题合同。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0201-0300/0207-course-schedule.rst",
  "problems/0201-0300/0208-implement-trie-prefix-tree.rst",
  "https://leetcode.com/problems/course-schedule-ii/description/",
  "https://leetcode.com/problems/design-add-and-search-words-data-structure/description/",
]
fact_sources_may_provide = [
  "0210 的课程编号、先修对语义、返回任意合法顺序或无解空数组合同",
  "0211 的 addWord/search 状态对象、小写字母与点号匹配任意单字符合同",
  "已有 Kahn 入度、Trie 路径/终止标记、对象生命周期和递归搜索术语连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0210"]
title = "Course Schedule II"
difficulty = "Medium"
primary_risks = [
  "先修对 [course, prerequisite] 仍建立 prerequisite -> course；输出弹出零入度课程的实际顺序",
  "processed==numCourses 时返回长度 V 的拓扑序；队列耗尽且 processed<V 时必须返回空结果，不能返回部分顺序",
  "合法拓扑序通常不唯一，十语言队列顺序可以不同；正确性验证依赖边的先后关系而非固定示例数组",
  "重复边的邻接次数与入度次数保持一致，自环、两节点环、孤立课程、多分量和菱形 DAG 要覆盖",
  "C 需要分配邻接、入度、队列和返回数组，并通过 returnSize 表示成功长度；任一失败要清理且返回 NULL/0",
  "R/Julia 零基课程编号映射到一基数组；Rust/Go/TypeScript/C# 的输出容器和队列头索引需静态核对",
]
minimum_static_review = [
  "人工推演单边、菱形 DAG、多个合法顺序、自环、两节点环、孤立课程、重复边和多分量",
  "证明输出前缀始终满足所有已输出节点先修边，且完整输出当且仅当图无环",
  "证明有环时不会把部分顺序误作答案；无环时有限 DAG 零入度引理保证处理全部节点",
  "逐语言核对输出长度、空结果、建边方向、重复边、队列头索引和 C 失败清理",
  "复杂度报告 O(V+E) 时间、O(V+E) 工作空间和 O(V) 输出载荷",
]

[problems."0211"]
title = "Design Add and Search Words Data Structure"
difficulty = "Medium"
primary_risks = [
  "addWord 复用 Trie 路径并只在完整单词终点设置标记；search 中小写字母只走一个分支，点号必须尝试所有非空子链接",
  "点号匹配恰好一个字符，不是零个或任意长度；搜索消费完模式后仍必须检查 is_word",
  "连续点号、共享前缀、完整词/前缀区分、重复插入、无匹配分支和空字符串扩展要覆盖",
  "无通配符搜索 O(L)；含通配符时用实际访问节点数表达，最坏可达 Trie 中深度 L 的大量分支，不能统一声称 O(L)",
  "C 插入仍需一致的分配失败策略和释放函数，递归通配符搜索有 O(L) 调用栈；平台 void 插入缺少失败通道",
  "Rust Box、Julia mutable struct、R environment 和托管语言对象图的所有权/回收与递归分支需静态核对",
]
minimum_static_review = [
  "人工推演 add bad/dad/mad，search pad/bad/.ad/b..，连续点号、仅前缀、重复插入和空字符串扩展",
  "证明字母分支、点号分支和终点标记覆盖且只覆盖所有匹配单词",
  "按访问节点数和模式长度报告时间，报告 O(L) 递归栈并区分 Trie 持久存储",
  "逐语言核对字符索引、通配符分支、递归终止、节点生命周期和 C 失败/释放路径",
]

must_preserve = [
  "0210 的实际拓扑序、无解空结果、非唯一顺序和输出载荷",
  "0211 的点号单字符语义、分支 DFS、终止标记和真实最坏搜索规模",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0208–0209 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "0210 在有环时返回已经生成的部分课程顺序",
  "0210 把某一个官方示例顺序当成唯一正确输出",
  "0211 把点号当成零个字符、任意长度或只尝试第一个子节点",
  "0211 模式结束后不检查单词终止标记",
  "把通配符搜索统一写成 O(L)，忽略分支访问",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐题对照 0050 的状态/数值边界和 0076 的最优性/语言资源深度",
  "每题完成后立即执行质量门；0211 出现压缩迹象时按合同缩批",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "每道算法题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
