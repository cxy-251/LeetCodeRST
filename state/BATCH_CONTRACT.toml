[contract]
schema_version = 2
batch_id = "historical-review-0204-0206"
status = "ready"
phase = "historical_review"
kind = "targeted_review"
scope = [204, 205, 206]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true
next_review_after_batch = 207

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0204 为 Medium，0205–0206 为 Easy，总分 4；三题依次涉及筛法边界与动态存储、ASCII 字符双射和原地链表重接所有权。主体已存在，可连续审查；若 0205 或 0206 的字符单位、平台节点或资源语义出现压缩迹象，只提交完整连续前缀并同步下一入口。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0100-same-tree.rst",
  "problems/0101-0200/0128-longest-consecutive-sequence.rst",
]
style_roles = [
  "0050 提供固定宽数值边界、循环不变量、更新顺序和终止证明基线",
  "0100 提供平台节点复用、空引用、结构保持和十语言对象接口基线",
  "0128 提供集合状态、工作量不重复证明、容器真实成本和哈希边界基线",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "state/concepts/0001-0050.toml",
  "state/concepts/0051-0100.toml",
  "state/concepts/0101-0150.toml",
  "state/concepts/0151-0200.toml",
  "state/concepts/0201-0250.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0001-0100/0082-remove-duplicates-from-sorted-list-ii.rst",
  "problems/0001-0100/0092-reverse-linked-list-ii.rst",
  "problems/0101-0200/0128-longest-consecutive-sequence.rst",
  "problems/0201-0300/0203-remove-linked-list-elements.rst",
  "https://leetcode.com/problems/count-primes/description/",
  "https://leetcode.com/problems/isomorphic-strings/description/",
  "https://leetcode.com/problems/reverse-linked-list/description/",
]
fact_sources_may_provide = [
  "0204 的非负 n、严格小于 n 的质数数量、标量返回和输入只读合同",
  "0205 的等长 ASCII 字符串、逐位置替换一致性、目标唯一性和布尔返回合同",
  "0206 的无环单链表、节点身份保持、全部 next 反转和新头返回合同",
  "0128 的容器成本术语，0082/0092/0203 的 ListNode、虚拟头、链接槽位与节点复用连续性",
  "当前完成范围、0219 生成暂停和 0206 后下一公开算法题为 0207 的状态事实",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problems."0204"]
title = "Count Primes"
path = "problems/0201-0300/0204-count-primes.rst"
difficulty = "Medium"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "统计范围必须是 [0,n)，0 和 1 不是质数，n<=2 必须在数组访问前返回，不能把 n 本身计入",
  "composite 状态只表示已获得合数见证；未标记候选成为质数的结论必须由更小质因子证明支撑",
  "从 p*p 开始的安全性和最小质因子完备性必须双向证明，不能只把筛法步骤当作结论",
  "外层用 p<=(n-1)/p 避免比较乘法溢出；内层 p*p、倍数递增、数组长度和索引仍须逐语言独立核对",
  "C 的容量检查、分配失败域外返回、成功释放与 size_t 索引必须闭合；托管语言不得把分配异常写成正常答案",
  "核对字节数组、Java boolean[]、Julia BitVector、R logical 与 TypeScript Uint8Array 的真实存储差异",
  "复杂度必须说明标准 O(n log log n) 标记界、O(n) 计数和 O(n) 筛存储，不得误称线性筛或常数空间",
  "审计筛法、平方起点、最小质因子和容量安全 concept，强化既有稳定 ID 时不得新造近义项",
]
minimum_static_review = [
  "人工推演 n=0、1、2、3、10、20、25、26 与一个较大边界的循环条件",
  "逐轮记录 p、composite[p]、首个 multiple 和最终计数，核对严格小于 n",
  "完整证明候选质性、p*p 起点安全、合数全覆盖、不误标质数和终止",
  "逐语言核对签名、容量、乘法与加法位宽、零基/一基索引、释放责任和真实存储成本",
]

[problems."0205"]
title = "Isomorphic Strings"
path = "problems/0201-0300/0205-isomorphic-strings.rst"
difficulty = "Easy"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "必须同时维护 source->target 与 target->source；单向一致性不能阻止不同源字符占用同一目标",
  "证明需覆盖函数一致性、单射、对实际出现字符集合的满射、冲突拒绝必要性和双向充要性",
  "官方 ASCII 域允许字节、UTF-16 单元和码点适配一致；超出 ASCII 时不得混称字符或索引单位",
  "固定表的空槽哨兵不能与合法代码值冲突；C/C++/Rust/Go 字节索引必须先转为无符号域",
  "TypeScript/C# 的 65536 项表是固定但较大的适配器空间；Julia collect 与 R utf8ToInt 的 O(n) 物化必须计入",
  "逐语言核对长度、必要导入、映射缺失与合法零值、输入只读和布尔返回，不能外推一种字符模型",
  "审计双向映射、字符单位和哈希查询 concept，通用字符边界与映射知识优先沿用稳定 ID",
]
minimum_static_review = [
  "人工推演 egg/add、paper/title、foo/bar、ab/aa、badc/baba、空扩展、单字符与长度不同",
  "逐位置记录双向表，分别触发源冲突与目标占用冲突",
  "完整证明映射合法、单射、满射、失败必要性、算法充要性和终止",
  "逐语言核对字符单位、无符号表索引、哨兵编码、物化与哈希成本、只读输入和 O(n) 扫描",
]

[problems."0206"]
title = "Reverse Linked List"
path = "problems/0201-0300/0206-reverse-linked-list.rst"
difficulty = "Easy"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "每轮必须先保存 current.next，再令 current.next=previous；覆盖顺序错误会丢失未处理后缀",
  "不变量需把已反转前缀与原向后缀定义为不交且合并覆盖全部原节点，并映射 previous/current/next_node",
  "证明需覆盖节点身份与数量守恒、顺序完全反转、原头成为空尾、新头返回、无环和终止",
  "平台 ListNode 不得重复定义；Julia/R 必须复用统一共享可变节点模型并说明旧 head 引用的可见变化",
  "C/C++ 只借用并重接，不分配、不释放；Rust 用 Option<Box<ListNode>> 的 take 和移动转交唯一所有权",
  "返回值必须是 previous；空链、单节点、两节点、重复值和外部仍持有原头引用都要静态核对",
  "审计链表反转、节点守恒、原地重接、平台节点复用和 Rust Box concept，合并既有稳定 ID 与近义记录",
]
minimum_static_review = [
  "人工推演空链、单节点、两节点、五节点和重复值链表",
  "逐轮记录 previous/current/next_node 和两段可达集合，核对先保存后继",
  "完整证明后缀不丢失、每轮移动一个节点、节点身份顺序、无环、终态和终止",
  "逐语言核对 ListNode、指针/引用重接、C/C++ 生命周期、Rust 所有权、Julia/R 共享变异和 O(n)/O(1) 核心成本",
]

must_preserve = [
  "0204 的半开统计范围、筛数组不变量、p*p 起点、最小质因子证明、溢出与存储成本",
  "0205 的双向映射、双射充要证明、ASCII 字符单位、哨兵表和物化成本",
  "0206 的三链接更新、前缀/后缀不变量、节点守恒、无环证明、所有权和新头返回",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "0204 把 n 计入、从错误倍数开始、先做可能溢出的 p*p 比较或把筛法复杂度写错",
  "0205 只检查单向映射、覆盖既有冲突、混用字符单位或把固定大表写成零成本",
  "0206 覆盖 next 后才保存后缀、复制节点、返回 current、擅自释放或重复声明平台节点类型",
  "把一种语言的数组布局、字符模型、节点所有权或垃圾回收语义外推为十语言一致",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

[completion]
required = [
  "按 0204、0205、0206 顺序逐题审查，出现压缩迹象时只提交完整连续前缀",
  "正文只在审查发现明确问题时修改",
  "知识账本保留稳定 concept ID，并准确区分首次引入、强化和关联",
  "PROGRESS、REVIEW_INDEX 与下一份 BATCH_CONTRACT 同步到下一公开算法题 0207",
  "不修改完成题数和 0219 的生成进度事实",
  "一个原子 main 提交，不创建分支或 PR",
]
