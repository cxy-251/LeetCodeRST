[contract]
schema_version = 2
batch_id = "historical-review-0201-0203"
status = "ready"
phase = "historical_review"
kind = "targeted_review"
scope = [201, 202, 203]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true
next_review_after_batch = 204

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0201 为 Medium，0202–0203 为 Easy，总分 4；三题依次叠加固定宽位运算、有限函数图 Floyd 状态坐标、链表节点所有权与 Rust 可变链接槽位。主体已存在，可连续审查；若 0202 或 0203 的证明、平台适配或资源语义出现压缩迹象，只提交完整连续前缀并同步下一入口。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0100-same-tree.rst",
  "problems/0101-0200/0128-longest-consecutive-sequence.rst",
]
style_roles = [
  "0050 提供位级滚动状态、固定宽数值边界、循环不变量和终止证明基线",
  "0100 提供平台节点、空引用、结构保持、对象引用语义和十语言节点接口基线",
  "0128 提供有限状态覆盖、哈希备选、工作不重复证明和容器最坏成本基线",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "state/concepts/0001-0050.toml",
  "state/concepts/0051-0100.toml",
  "state/concepts/0101-0150.toml",
  "state/concepts/0151-0200.toml",
  "state/concepts/0201-0250.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0001-0100/0082-remove-duplicates-from-sorted-list-ii.rst",
  "problems/0101-0200/0141-linked-list-cycle.rst",
  "problems/0101-0200/0190-reverse-bits.rst",
  "problems/0201-0300/0206-reverse-linked-list.rst",
  "https://leetcode.com/problems/bitwise-and-of-numbers-range/description/",
  "https://leetcode.com/problems/happy-number/description/",
  "https://leetcode.com/problems/remove-linked-list-elements/description/",
]
fact_sources_may_provide = [
  "0201 的非负闭区间、32 位上界、区间按位与标量返回和只读输入合同",
  "0202 的正整数平方位和过程、到达 1 或进入环的判定和布尔返回合同",
  "0203 的无环单链表、删除全部目标值、保留节点顺序与新头返回合同",
  "0190 的无符号移位适配、0141 的 Floyd 状态术语、0082/0206 的 ListNode 与 Rust 所有权连续性",
  "当前完成范围、0219 生成暂停和 0203 后下一公开算法题为 0204 的状态事实",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problems."0201"]
title = "Bitwise AND of Numbers Range"
path = "problems/0201-0300/0201-bitwise-and-of-numbers-range.rst"
difficulty = "Medium"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "答案必须是 left 与 right 的最长公共二进制前缀补零；不能只对两个端点求与或枚举整个区间",
  "证明需说明公共前缀在整个闭区间保持、首个差异位及全部更低位各存在零见证，避免把块边界直觉当证明",
  "循环每轮同步逻辑右移两个非负端点并记录相同 shift；单点区间 shift=0，恢复左移不得越过官方非负 31 位结果域",
  "逐语言核对 C/C++/Rust/Go/C# 无符号状态、Java >>>、TypeScript >>>0、Julia/R 非负整除与恢复乘法",
  "核对 left=0、right=2^31-1 时最多 31 轮，TypeScript/R 精确整数与固定宽返回转换均由约束支撑",
  "审计公共前缀、逻辑右移和 32 位无符号适配 concept，优先合并到 0190 等稳定 ID",
]
minimum_static_review = [
  "人工推演 [5,7]、[26,30]、[0,0]、[1,2]、最大单点与 [0,2^31-1]",
  "逐轮记录 low/high/shifts，核对第一次相等、最长公共前缀坐标和恢复位数",
  "完整证明高位不变、全部删除低位归零、循环终止和返回值非负有界",
  "逐语言核对签名、移位种类、32 位转换、局部输入状态和真实 O(W)/O(1) 成本",
]

[problems."0202"]
title = "Happy Number"
path = "problems/0201-0300/0202-happy-number.rst"
difficulty = "Easy"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "平方位和辅助函数必须逐位取余与整除，说明 32 位正整数首轮最多 810，不能误称全部状态单调下降",
  "有限状态证明必须把大数降阶与有限集合闭包接起来，再推出状态最终到达 1 或进入非 1 环",
  "Floyd 初始化 slow=x0、fast=x1；每轮后状态坐标与退出条件必须一致，slow==fast 本身不代表快乐",
  "证明需覆盖快乐不动点、非快乐环相遇、两类退出的充分必要性和终止",
  "逐语言核对整数除法、取余、平方和位宽、TypeScript Math.floor、R 精确 double 与扩展 n=0 行为",
  "审计 Floyd 判环 concept，强化 0141 的稳定 ID，避免用 happy-number 近义 ID 替代通用判环知识",
]
minimum_static_review = [
  "人工推演 19、2、1、7、100、0 扩展和 32 位最大正整数的首轮上界",
  "逐轮核对 slow=x_t、fast=x_(2t+1)，分别检查 fast 到 1 与非 1 相遇退出",
  "完整证明 digit-square 正确、有限状态、Floyd 必相遇、判定双向正确和终止",
  "逐语言核对签名、整数运算、局部状态、布尔返回与 O(mu+lambda)/O(1) 核心成本",
]

[problems."0203"]
title = "Remove Linked List Elements"
path = "problems/0201-0300/0203-remove-linked-list-elements.rst"
difficulty = "Easy"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "虚拟头必须统一原头与中间删除；删除分支保持 previous 不动，保留分支才推进，连续目标节点不能跳过",
  "证明需覆盖全部匹配节点删除、保留节点身份与相对顺序、后缀不丢失、不成环、每节点恰好检查一次",
  "返回值必须是 dummy.next，可能为空或位于原链表内部；平台 ListNode 类型不得在各题重复定义",
  "C 的 free 只能建立在显式所有权假设上，必须先保存后继再重接释放；C++ 不得把评测借用误写成拥有",
  "Rust 必须静态核对 Option<Box<ListNode>> 的 take、放回和可变链接槽位生命周期，不使用 unsafe 或节点克隆",
  "Julia/R 复用统一共享可变节点模型并返回新头；逐语言核对外部旧 head 引用、垃圾回收与节点可达性",
  "审计 dummy node、Rust mutable link slot、节点复用和移除所有权 concept，合并既有稳定 ID 与近义记录",
]
minimum_static_review = [
  "人工推演普通删除、连续头删、连续中段删除、尾删、全部删除、无匹配和空链表",
  "逐轮记录 previous/candidate/successor 与返回头，核对删除后不推进前驱",
  "完整证明虚拟头统一性、删除与保留分支、不重不漏、身份顺序保持、无环和终止",
  "逐语言核对 ListNode、指针/引用重接、C 释放、Rust 所有权、Julia/R 节点复用与 O(n)/O(1) 核心成本",
]

must_preserve = [
  "0201 的公共二进制前缀、变化后缀归零证明、同步移位、无符号语义和固定轮数界",
  "0202 的平方位和状态、有限集合证明、Floyd 状态坐标、两类退出和十进制运算语义",
  "0203 的虚拟头、连续删除、连接不变量、节点身份、C/Rust 所有权和新头返回",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "0201 枚举宽区间、只对端点求与、使用错误算术右移或忘记恢复低位零",
  "0202 把状态写成全程单调下降、相遇即快乐、遗漏有限状态证明或让快指针只走一步",
  "0203 删除后推进前驱、返回旧 head、复制保留节点、未声明所有权就 free 或重复声明平台节点类型",
  "把一种语言的位宽、取整、节点所有权或垃圾回收语义外推为十语言一致",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

[completion]
required = [
  "按 0201、0202、0203 顺序逐题审查，出现压缩迹象时只提交完整连续前缀",
  "正文只在审查发现明确问题时修改",
  "知识账本保留稳定 concept ID，并准确区分首次引入、强化和关联",
  "PROGRESS、REVIEW_INDEX 与下一份 BATCH_CONTRACT 同步到下一公开算法题 0204",
  "不修改完成题数和 0219 的生成进度事实",
  "一个原子 main 提交，不创建分支或 PR",
]
