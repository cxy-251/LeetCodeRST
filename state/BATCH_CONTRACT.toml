[contract]
schema_version = 2
batch_id = "generation-0198"
status = "ready"
phase = "generation"
kind = "generation"
scope = [198]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "medium"
language_semantics_risk = "medium"
platform_type_risk = "medium"
output_volume_risk = "medium"
scope_may_shrink = false
scope_reason = "0198 从原 0189–0198 高输出批次中拆出，必须独立恢复完整前缀 DP 证明、滚动变量语义和十语言边界；本批不追加 0199。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0101-0200/README.rst",
  "https://leetcode.com/problems/house-robber/description/",
]
fact_sources_may_provide = [
  "0198 的非负金额数组、不能同时选择相邻房屋、返回最大可得金额与官方示例",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0198"]
title = "House Robber"
difficulty = "Medium"
primary_risks = [
  "状态必须定义为前 i 间房屋的最大可得金额；选择当前房屋只能接到 i-2 前缀，不能同时使用 i-1",
  "递推 max(dp[i-1],dp[i-2]+nums[i]) 需要分别证明最后一间不选与选择两类策略的完备性和最优性",
  "滚动变量 prev2/prev1 更新前分别代表 i-2 与 i-1 前缀，必须先计算 current 再整体推进，不能覆盖后读取",
  "金额非负使空策略提供 0 下界；官方数组非空，但扩展空输入应返回 0，并覆盖单房、双房、全零和交替大值",
  "固定宽语言使用足够宽中间金额；C/C++/Java/Rust/Go/C# 的返回接口通常为 int，但状态可用 64 位后安全转换",
  "R/Julia 一基索引和空输入分支需逐项核对；输入数组只读，不构造完整 DP 数组",
]
minimum_static_review = [
  "人工推演 [1,2,3,1]、[2,7,9,3,1]、单元素、两个元素、全零、空输入扩展与交替大值",
  "证明最后一间不选/选择的完备分类、前缀最优递推和滚动不变量",
  "逐语言核对宽整数、循环起点、输入只读、空输入、返回类型和 R/Julia 索引",
  "复杂度报告 O(n) 时间、O(1) 核心空间，并明确没有完整 DP 数组",
]

must_preserve = [
  "前缀 DP 状态定义与最后一间二分分类",
  "递推的必要性、充分性、归纳证明和滚动更新顺序",
  "非负金额、空策略、单房/双房/全零边界",
  "固定十语言完整实现、宽整数与语言适配成本",
  "人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0189–0191 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "使用每次选择较大邻居的局部贪心",
  "覆盖 prev1 后再把它当作旧 i-1 状态读取",
  "构造完整 DP 数组却声明 O(1) 核心空间",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐项对照 0050 的状态/数值边界和 0076 的语言适配/资源成本深度",
  "0198 只有一个自包含 RST，十语言代码全部内联",
  "人工推演全部要求边界，完成状态、转移、终止和最优性证明",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "完成范围、completed_count、next_problem、README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
