  "0050 提供固定宽数值边界、循环不变量、更新顺序和终止证明基线",
  "0100 提供平台对象复用、空引用、结构保持和十语言接口基线",
  "0128 提供集合状态、工作量不重复证明、容器真实成本和哈希边界基线",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "state/concepts/0001-0050.toml",
  "state/concepts/0051-0100.toml",
  "state/concepts/0101-0150.toml",
  "state/concepts/0151-0200.toml",
  "state/concepts/0201-0250.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
  "problems/0101-0200/0127-word-ladder.rst",
  "problems/0101-0200/0133-clone-graph.rst",
  "problems/0201-0300/0210-course-schedule-ii.rst",
  "problems/0201-0300/0211-design-add-and-search-words-data-structure.rst",
  "https://leetcode.com/problems/course-schedule/description/",
