[contract]
schema_version = 2
batch_id = "quality-repair-0144-0145"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [144, 145]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "medium"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "medium"
scope_may_shrink = true
shrink_rule = "若 0145 的全局反转证明、C 资源失败路径或 R 输出物化成本无法完整承载，只提交已完整达标的连续前缀 0144，并把 0145 保留到下一合同。"

[references]
style_baselines = [
  "problems/0001-0100/0076-minimum-window-substring.rst",
  "problems/0001-0100/0100-same-tree.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0102-binary-tree-level-order-traversal.rst",
  "problems/0101-0200/0114-flatten-binary-tree-to-linked-list.rst",
  "state/concepts/0144.toml",
  "state/concepts/0145.toml",
]
fact_sources_may_provide = [
  "二叉树平台字段、空树、树高和节点只读术语",
  "显式栈、返回容器、Rust Rc<RefCell<TreeNode>> 与 R environment 的事实连续性",
  "当前范围、进度和既有概念记录",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0144"]
title = "Binary Tree Preorder Traversal"
difficulty = "Easy"
primary_risks = [
  "契约要求返回根、左、右值序列，空树返回空容器且整棵输入树只读；不能把结果顺序或节点引用集合混为一谈",
  "迭代栈必须先压右孩子再压左孩子；证明要说明栈表示尚未访问子树的有序前沿，而不只是声称后进先出",
  "需要证明根和每个非根节点恰好入栈一次、左子树完整先于右子树，以及循环有限终止",
  "显式栈峰值按树高 O(h) 分析，返回序列 O(n) 是输出载荷；C 分配缓冲和 R 容器物化必须计入语言成本",
  "Rust 克隆 Rc 只增加临时句柄计数，不复制树节点；RefCell 借用范围必须在访问字段后安全结束且不修改树",
]
minimum_static_review = [
  "人工推演空树、单节点、只有左链、只有右链、不平衡树和带重复值树的栈内容与输出",
  "逐轮核对弹出当前节点、记录值、先压右再压左以及每个非空节点唯一入栈来源",
  "逐语言检查平台签名、空容器、树节点字段、栈操作、返回类型、输入只读和输出物化成本",
  "专项审查 C 容量增长、realloc 临时指针、失败清理、returnSize 与返回缓冲所有权",
  "专项审查 Rust Rc 克隆与 RefCell 借用、Julia/R 引用树节点和 R 栈/结果容器语义",
]

[problems."0145"]
title = "Binary Tree Postorder Traversal"
difficulty = "Easy"
primary_risks = [
  "契约要求左、右、根的值序列，空树返回空容器且不修改树；不能把节点值反转误写成树结构反转",
  "单栈方案先压左再压右生成根、右、左序列，最后整体反转；压栈顺序与 0144 相反，机械复用会得到错误结果",
  "证明必须以子树递归分解说明 reverse(root + RR + RL) 等于 post(left) + post(right) + root，不能只说反过来就是后序",
  "结果反转在输出容器内原地完成，显式栈为 O(h)、返回载荷为 O(n)；若 R 反复 c 追加导致累计 O(n^2)，必须修正实现或如实计入",
  "C 的栈与结果双缓冲在任一扩容失败时都要保持可释放指针、清零 returnSize 并避免泄漏或 double free",
]
minimum_static_review = [
  "人工推演空树、单节点、根带双子树、不平衡树和重复值树的根右左记录及反转结果",
  "用子树字符串分解核对全局反转证明，并静态证明每个节点恰好记录一次且输入树无修改",
  "逐语言核对先压左再压右、结果原地反转 API、空容器、整数返回和输出/工作空间边界",
  "专项审查 C 双缓冲扩容和失败清理、Rust 克隆借用、TypeScript 非空断言、Julia reverse! 与 R 容器复制成本",
]

must_preserve = [
  "两题的精确契约、自建结构化树例子和重复值身份边界",
  "前序有序栈前沿不变量与先右后左的完整证明",
  "后序根右左构造、子树分解和整体反转的完整证明",
  "每个节点唯一入栈、输出覆盖、终止性和输入树只读证明",
  "O(n) 时间、O(h) 栈工作空间、O(n) 输出载荷及语言真实物化成本",
  "十语言完整实现与 C 分配失败、Rust Rc/RefCell、Julia/R 引用对象适配",
  "准确静态审查证据、边界、失败方式、学习链和带答案自检",
]

forbidden = [
  "参考 0143、0146 或其他最近题目的章节结构",
  "只用一句后进先出或反转即正确代替栈前沿与子树分解证明",
  "把平衡树常见栈深度写成所有树都为 O(log n)",
  "把 O(n) 返回数组藏进 O(h) 工作空间声明",
  "C realloc 直接覆盖唯一旧指针而丢失失败清理入口",
  "R 反复 c 追加却仍宣称总时间 O(n)",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "每题逐项对照合同选定的 0076 与 0100 黄金题",
  "命中 DRIFT_LOG 的回归检查均通过",
  "0144、0145 各只有一个自包含 RST，十语言代码全部内联",
  "PROGRESS、README、AGENTS 当前状态、范围索引和知识账本同步",
  "原子提交后 BATCH_CONTRACT 被替换为下一批合同",
]
