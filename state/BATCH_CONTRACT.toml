reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[problem]
id = 166
title = "Fraction to Recurring Decimal"
path = "problems/0101-0200/0166-fraction-to-recurring-decimal.rst"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "核对十语言长除法余数状态、循环赵点、符号、INT_MIN 扩宽和字符串所有权",
  "合并 numeric.widen_before_abs_signed_minimum 与既有 numeric.int_min_absolute_value_widening 的近义重复状态",
  "把新引入、强化和关联知识分开，避免把 0029/0050 已讲解内容错误标为 0166 首次引入",
  "只做局部去重和学习链修正；没有确定性错误时不重写正文",
]

minimum_static_review = [
  "人工推演 1/2、2/1、2/3、1/6、-50/8、INT_MIN/-1 与零分子",
  "证明余数为零有限终止、余数重复形成循环、首次位置插入括号正确",
  "逐语言核对扩宽发生在 abs 前、除法与取余符号、哈希键、索引和失败清理",
  "核对活动知识账本只从 state/concepts 读取，并在完成后把下一审查入口更新为 0167",
]

[completion]
required = [
  "正文只在审查发现明确问题时修改",
  "知识账本消除 0166 的近义重复 concept",
  "PROGRESS 与下一份 BATCH_CONTRACT 同步到 0167",
  "不修改完成题数和 0219 的生成进度事实",
  "一个原子 main 提交，不创建分支或 PR",
]
