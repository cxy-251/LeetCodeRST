[problems."0167"]
title = "Two Sum II - Input Array Is Sorted"
difficulty = "Medium"
primary_risks = [
  "numbers 长度 2..30000、值在 [-1000,1000] 且非递减，target 在 [-1000,1000]；恰有一组不同下标解，返回两个一基下标并只用常数额外空间",
  "左右指针必须保持 left<right，禁止同一元素使用两次；和小于 target 时只移动左端，和大于时只移动右端",
  "不变量需保留唯一解下标仍在 [left,right]；若当前最大配对和仍过小，left 不可能参与任何剩余解，过大分支对 right 对称",
  "重复值合法，唯一的是下标对解而非数组值互异；证明不能依赖严格递增，也不能跳过重复值破坏唯一解",
  "返回载荷固定两个整数；C 需分配长度 2 并设置 returnSize，失败语义与调用者释放责任明确",
  "内部零基与题目一基返回需逐语言核对；Julia/R 内部一基时不能再次加一，和的当前范围虽安全仍要准确说明",
]
minimum_static_review = [
  "人工推演三个官方示例，逐轮记录 left/right、端点值、sum、删除端点和唯一解见证",
  "覆盖两元素、负数与零、重复值构成答案、答案在首尾、指针相邻和合同保证的唯一解",
  "证明两个排除分支、唯一解保留、每轮严格缩短、有限终止及返回不同一基下标",
  "逐语言核对公开签名、只读输入、索引单位、结果容器、固定返回载荷与 C 资源路径",
  "明确核心 O(n) 时间/O(1) 状态，输出数组 O(1)；不得用哈希表却声称常数额外空间",
]

[problems."0168"]
title = "Excel Sheet Column Title"
difficulty = "Easy"
primary_risks = [
  "输入 columnNumber 在 [1,2^31-1]，返回 Excel 列标题；A..Z 表示 1..26，AA 表示 27，不存在表示零的字符",
  "每轮必须先把当前正数减一，再以 26 取余得到 0..25 字母并整除；直接 n%26 会在 26、52 等倍数产生不存在的零位",
  "生成顺序从最低位到最高位，需要反转或前插；证明需建立减一后的标准余数与原无零位二十六进制表示等价",
  "循环状态保持尚未编码的高位商，严格变小至零；还原公式需证明输出标题数值等于原输入且表示唯一",
  "最大输入输出长度有限但各语言字符构建、反转、ASCII 转换和返回物化成本要准确，C 容量与终止符闭合",
  "R/Julia 一基容器不影响数值位次，TypeScript number 精确表示 32 位输入和所有除法中间量",
]
minimum_static_review = [
  "人工推演 1、28、701 以及 26、52、2^31-1，逐轮记录减一值、余数、字母、商和反转结果",
  "覆盖 A/Z/AA/AZ/ZZ/AAA 边界、26 的倍数、最大输入和单字符输出",
  "证明每轮位公式、循环不变量、商严格下降、终止、表示正确与唯一性",
  "逐语言核对平台签名、整数除法、字符码、构建方向、反转、C 返回所有权和 R 字符拼接成本",
  "复杂度以标题长度 L 报告 O(L) 时间与 O(L) 返回/构建空间，不把返回字符串写成 O(1)",
]

must_preserve = [
  "两题各自具备精确契约、自建反例、问题抽象、解法取舍、状态不变量和完整正确性证明",
  "0167 的唯一解区间、单调端点排除、不同下标与一基返回",
  "0168 的先减一无零位进制、逆序位生成、终止和字符物化",
  "固定十语言完整实现以及每题独立人工推演、静态语义审查、剩余风险、学习链和带答案自检",
]

forbidden = [
  "参考 0166 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "在 0167 中返回零基下标、允许 left==right 复用元素、使用哈希表却声称常数空间，或依赖元素互异",
  "在 0168 中直接 n%26 映射 A..Z、遗漏先减一、按生成逆序直接返回，或把返回载荷忽略为空间零",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

