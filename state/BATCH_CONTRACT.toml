[contract]
schema_version = 2
batch_id = "generation-0216-0217"
status = "ready"
phase = "generation"
kind = "generation"
scope = [216, 217]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 218

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 3
target_min = 3
target_max = 4
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "这是上一合同缩批后的连续剩余范围。0216 需要严格递增唯一性、路径恢复、最小/最大可达和剪枝与 C 二维结果所有权；0217 需要哈希集合平均/最坏复杂度、C 开放寻址和 R 键语义。先完整验收 0216；若继续 0217 会压缩容器或复杂度说明，则在 0216 后缩批。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0201-0300/0215-kth-largest-element-in-an-array.rst",
  "https://leetcode.com/problems/combination-sum-iii/description/",
  "https://leetcode.com/problems/contains-duplicate/description/",
]
fact_sources_may_provide = [
  "0216 从 1 到 9 选择 k 个互不相同数字、和为 n、组合不重复的合同",
  "0217 判断是否存在至少一对相同整数的合同",
  "当前目录、完成范围和静态审查状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0216"]
title = "Combination Sum III"
difficulty = "Medium"
primary_risks = [
  "只能使用 1 到 9，每个数字最多一次，组合必须恰好包含 k 个数字且总和为 n",
  "候选按严格递增顺序选择，从结构上同时避免重复使用与重复组合",
  "状态包含下一个最小候选、剩余槽位、剩余和与当前路径；递归退出必须恢复路径",
  "剩余槽位为 0 时只有剩余和也为 0 才提交结果快照",
  "最小可达和与最大可达和必须基于当前起点和剩余槽位，且不能使用超过 9 的数字",
  "C 需要二维结果数组、列长度数组、容量增长和失败清理；其他语言需要明确路径快照语义",
  "Julia/R 一基索引、R 递归参数复制和结果列表追加成本需准确说明",
]
minimum_static_review = [
  "人工推演 k=3,n=7；k=3,n=9；k=4,n=1；k=9,n=45；多解和无解情况",
  "证明严格递增使每个合法组合只有一条生成路径，并证明所有合法组合都会被枚举",
  "证明最小/最大可达和剪枝只排除必不可能完成的状态",
  "逐语言核对 push/pop、结果快照、递归边界、二维输出和 C 失败清理",
]

[problems."0217"]
title = "Contains Duplicate"
difficulty = "Easy"
primary_risks = [
  "扫描元素时先查询已见集合；命中返回 true，未命中再插入",
  "重复可能相邻或远隔，负数、零和整数极值按值比较",
  "哈希集合平均 O(n) 时间、O(n) 空间；哈希最坏情况不能写成保证线性",
  "C 开放寻址必须用独立占用标记区分空槽和任意 int 值，并安全计算容量与哈希",
  "R 环境字符串键必须无歧义编码负数和整数值；TypeScript/Julia/其他语言集合语义需核对",
]
minimum_static_review = [
  "人工推演 [1,2,3,1]、[1,2,3,4]、[1,1]、单元素、负数与远距离重复",
  "证明首次集合命中对应更早相同元素，扫描结束未命中则所有元素两两不同",
  "逐语言核对集合键、输入只读、平均/最坏复杂度和额外空间",
]

must_preserve = [
  "0216 的严格递增唯一性、完整性、路径恢复和可达和剪枝证明",
  "0216 的 C 二维结果所有权与十语言结果快照语义",
  "0217 的集合正确性、平均/最坏复杂度和 C/R 容器边界",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0215 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "0216 依赖结果集合事后去重而不维护严格递增选择",
  "0216 使用未证明安全或可能越过 9 的剪枝公式",
  "0216 提交路径引用而不是结果快照",
  "0217 把哈希最坏复杂度写成保证 O(n)",
  "0217 使用整数哨兵表示空槽而与合法输入值冲突",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐题对照 0050 的状态/数值边界和 0076 的最优性/资源深度",
  "每题完成后立即执行质量门；0217 出现压缩迹象时按合同缩批",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "每道算法题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]