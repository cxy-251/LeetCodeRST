[contract]
schema_version = 2
batch_id = "generation-0214"
status = "ready"
phase = "generation"
kind = "generation"
scope = [214]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 215

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0214 是 Hard；最短前置字符与最长回文前缀的最优性、KMP 最终 border 的充要证明、安全分隔符、十语言字符单位和 C 字符串分配必须独立完成，本批不追加 0215。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0201-0300/0213-house-robber-ii.rst",
  "https://leetcode.com/problems/shortest-palindrome/description/",
]
fact_sources_may_provide = [
  "0214 只能在原字符串前添加字符并返回最短回文串的合同",
  "官方小写英文字母字符域和当前目录/进度事实",
  "已有回文、字符串反转、KMP 前缀函数与跨语言字符串资源术语连续性",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0214"]
title = "Shortest Palindrome"
difficulty = "Hard"
primary_risks = [
  "只能在字符串前添加字符；最短答案等价于保留最长回文前缀，并把剩余后缀反转后加到前面",
  "使用 KMP 前缀函数处理 s + separator + reverse(s)；separator 必须不在官方字符域，阻止匹配跨越边界",
  "必须证明最终前缀函数值恰好等于最长回文前缀长度，不能把任意相等前后缀直接称为回文",
  "空串、单字符、已回文、最长回文前缀只有 1、重复字符和接近整串回文都要覆盖",
  "官方小写 ASCII 可按字节/代码单元处理；不得把结论无条件推广到任意 Unicode",
  "C 需要安全分配拼接序列、前缀表和答案；长度加法溢出、终止符与失败清理必须完整",
  "Rust/Go 字节、Java/C#/TypeScript UTF-16、Julia codeunits 和 R raw 的物化/视图成本需分别说明",
]
minimum_static_review = [
  "人工推演 aacecaaa、abcd、空串、单字符、已回文、重复字符和最长回文前缀为 1 的情况",
  "证明任意前置方案保留的原串前缀必须是回文，选择最长回文前缀产生最少添加字符",
  "证明 KMP 最终 border 对应且仅对应原串回文前缀，分隔符阻止跨区错误匹配",
  "逐语言核对反转范围、分隔符、前缀函数下标、字符单位、结果分配和输入物化成本",
  "复杂度报告 O(n) 时间、O(n) 前缀表与拼接材料、O(answer length) 输出载荷",
]

must_preserve = [
  "最长回文前缀转化与最少添加字符的完整最优性证明",
  "KMP 最终 border 的双向证明和安全分隔符",
  "C 长度溢出/失败清理与十语言字符资源成本",
  "固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0213 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "使用滚动哈希却声称无碰撞确定正确",
  "省略安全分隔符或不证明最终 border 与回文前缀等价",
  "只枚举前缀形成二次复杂度却声称 O(n)",
  "把官方 ASCII 适配结论无条件推广到任意 Unicode",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "对照 0050 的状态/数值边界和 0076 的最优性/字符串资源深度",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "单题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
