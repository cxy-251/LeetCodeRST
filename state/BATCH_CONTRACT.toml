fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problems."0207"]
title = "Course Schedule"
path = "problems/0201-0300/0207-course-schedule.rst"
difficulty = "Medium"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "先修对 [course, prerequisite] 必须建立 prerequisite->course；入度和队列解释必须与边方向一致",
  "remaining indegree 必须始终等于来自未处理课程的剩余入边数，处理课程时逐条删除全部出边",
  "证明需覆盖有限 DAG 必有零入度节点、处理全部课程给出拓扑序、队列提前为空意味着剩余图含环",
  "自环、孤立课程、多个分量和重复边都要保持语义；重复邻接项与入度次数不得单边去重",
  "C 两遍 CSR 的计数、前缀和、容量、分配失败和 cleanup 必须闭合，bool 接口仍无法区分资源失败与有环",
  "逐语言核对零基课程编号、R/Julia 一基转换、队列头推进、容器所有权和输入只读",
  "复杂度按 V+E 报告，重复边计入 E；不得把实际邻接、入度和队列存储写成常数空间",
  "审计 Kahn、剩余入度、DAG 零入度与判环 concept，优先强化稳定图论 ID",
]
minimum_static_review = [
  "人工推演单边 DAG、自环、两节点环、菱形 DAG、孤立课程、多个分量和重复边",
  "逐轮记录队列、processed、当前出边和剩余入度，核对每点至多入队一次",
  "完整证明入度不变量、DAG 零入度引理、无环充分必要性、终止和 O(V+E) 工作界",
  "逐语言核对签名、编号转换、重复边、队列、CSR 容量、失败清理和资源所有权",
]

[problems."0208"]
title = "Implement Trie (Prefix Tree)"
path = "problems/0201-0300/0208-implement-trie-prefix-tree.rst"
difficulty = "Medium"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "Trie 节点路径只证明前缀存在，完整单词还必须检查终止标记；search 与 startsWith 不得合并语义",
  "insert 只能创建缺失后缀并在终点设标记，共享前缀、重复插入和已有更长单词必须保持旧状态",
  "证明需对字符路径和任意操作序列归纳，覆盖插入保持旧词、加入目标词以及两种查询的充要性",
  "固定 26 子链接的索引必须依赖官方小写字母域，字符单位、空槽和合法索引需逐语言独立核对",
  "C 的 void insert 必须在树外完整构造缺失后缀后一次提交；失败释放临时链且不得留下半插入状态",
  "C 递归释放、C++ unique_ptr、Rust Box、托管对象图、Julia 可变节点和 R environment 的生命周期不得混称一致",
  "复杂度需区分单次 O(L)、持久节点总量、固定 26 槽位成本、暂存后缀和递归释放栈",
  "审计 Trie 路径、终止标记、事务式插入和对象生命周期 concept，合并已存在的稳定 ID",
]
minimum_static_review = [
  "人工推演 insert(apple)、search(apple)、search(app)、startsWith(app)、insert(app) 与重复插入",
  "逐字符记录当前路径、首次缺失位置、新节点链和终止标记，核对共享前缀不被破坏",
  "完整证明路径查询充要性、终止标记语义、插入与操作序列正确性、终止和真实资源界",
  "逐语言核对对象接口、字符索引、空槽、所有权、C 事务提交与失败清理、释放或回收责任",
]

[problems."0209"]
title = "Minimum Size Subarray Sum"
path = "problems/0201-0300/0209-minimum-size-subarray-sum.rst"
difficulty = "Medium"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "nums 全正是右扩增和、左缩减和的必要前提；不得把同一窗口证明外推到含零或负数输入",
  "window_sum 必须精确等于当前闭窗口；每个右端达标后要持续收缩并在删除左端前提交长度",
  "证明需覆盖被越过左边界不可能产生未来更短答案、全局最短窗口必被枚举和无解返回 0",
  "空输入扩展、单元素恰好达标、单元素超过 target、整体不足和多个连续可行窗口都要核对",
  "固定宽语言的窗口和使用 64 位；TypeScript 与 R 只在官方安全整数域承诺精确，索引仍用普通整数",
  "逐语言核对左右边界、收缩条件、答案哨兵、输入只读或 Rust 按值移动，以及返回类型",
  "时间复杂度必须用左右指针各至多前进 n 次证明 O(n)，不能把嵌套 while 误写成 O(n^2)",
  "审计正数窗口、精确窗口和、左边界淘汰与宽累加 concept，优先强化稳定滑窗 ID",
]
minimum_static_review = [
  "人工推演 [2,3,1,2,4,3]/7、[1,4,4]/4、整体不足、单元素边界和连续多次收缩",
  "逐轮记录 left、right、window_sum、提交长度和 best，核对删除前提交与无解哨兵",
  "完整证明窗口和不变量、正数单调性、左边界淘汰安全、全局最短性、终止和线性工作界",
  "逐语言核对宽整数、安全整数域、索引、所有权、空输入扩展和 O(1) 核心状态",
]

must_preserve = [
  "0207 的先修边方向、剩余入度不变量、环与拓扑序等价、重复边和 CSR 资源闭环",
  "0208 的 Trie 路径、终止标记、操作序列证明、事务式 C 插入和对象生命周期",
  "0209 的全正数单调性、持续收缩、最短性证明、线性工作量和宽整数适配",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "0207 颠倒边后继续沿用原入度解释、遗漏分量、重复边计数失衡或泄漏 C 资源",
  "0208 混淆路径存在与完整词、半插入失败状态、遗漏终止标记或虚构统一回收语义",
  "0209 忽略全正数前提、只收缩一次、删除左端后才提交、窄整数累加或误判二次复杂度",
  "把一种语言的索引、对象所有权、异常或垃圾回收语义外推为十语言一致",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

