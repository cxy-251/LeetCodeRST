[contract]
schema_version = 2
batch_id = "quality-repair-0137-0138"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [137, 138]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
shrink_rule = "若高风险叠加导致后题只能压缩，提交已完整达标的连续前缀，并把未完成题写入下一份合同。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0100-same-tree.rst",
  "problems/0101-0200/0128-longest-consecutive-sequence.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0133-clone-graph.rst",
  "problems/0101-0200/0136-single-number.rst",
]
fact_sources_may_provide = [
  "术语和知识衰减连续性",
  "平台节点、整数位宽和接口连续性",
  "关联题目和范围状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0137"]
title = "Single Number II"
difficulty = "Medium"
primary_risks = [
  "ones 与 twos 必须逐位编码出现次数模三，不能只给更新公式而不解释状态",
  "顺序更新公式的第二行读取新 ones，正确性证明必须与实际代码顺序一致",
  "唯一元素为负数时需要覆盖符号位与各语言补码或位宽语义",
  "Python 无限符号扩展、TypeScript/R 32 位、Go/Julia 宿主位宽需要分别说明",
]
minimum_static_review = [
  "人工推演题目页面示例与单元素、唯一值为零、唯一值为负数、重复负数边界",
  "逐位列出输入位为零和一时的 00、01、10 状态转移，并映射到更新顺序",
  "逐语言静态核对按位非、按位与、按位异或、返回类型和固定宽度契约",
  "无法静态确认的宿主位宽或平台模板风险明确记录，不执行题解代码",
]

[problems."0138"]
title = "Copy List with Random Pointer"
difficulty = "Medium"
primary_risks = [
  "映射键必须是节点身份而不是节点值，重复值不能合并节点",
  "正确性必须分别证明节点双射、next/random 边保持和新旧对象完全隔离",
  "C 的指针表、容量与失败清理以及 Rust Rc/RefCell 借用容易出现实现级错误",
  "十语言平台 Node 字段名、可空类型、身份映射 API 与返回空间需要独立说明",
  "R 基础适配器的身份查找若为线性扫描，真实时间必须记录为 O(n^2)",
]
minimum_static_review = [
  "人工推演空链表、单节点、random 为空、自指、前向、后向和重复节点值",
  "逐项核对第一遍创建双射、第二遍连接两类边、所有副本引用只指向新节点",
  "静态检查 C 分配失败清理与指针表边界、Rust 借用时序、Julia IdDict 和 R identical 身份语义",
  "逐语言核对平台 Node 定义是题目环境提供还是仓库适配器自建，并准确记录复杂度",
  "无法静态确认的对象身份或平台类型风险明确记录，不执行题解代码",
]

must_preserve = [
  "精确契约与自建反例",
  "问题抽象和真实解法选择",
  "状态到代码变量或对象映射的逐项对应",
  "完整正确性证明与深拷贝隔离证明",
  "真实复杂度、返回载荷和语言语义成本",
  "十语言完整实现",
  "准确静态审查证据",
  "边界、易错点、学习链和带答案自检",
]

forbidden = [
  "参考 0136 或其他最近题目的章节结构",
  "为保持两题一批而压缩任一题",
  "只罗列位运算公式或只声称映射完成深拷贝",
  "把十语言实现当作无差别机械翻译",
  "按节点值建立副本映射",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "每题逐项对照合同选定黄金题",
  "命中 DRIFT_LOG 的回归检查均通过",
  "每题只有一个自包含 RST",
  "PROGRESS、README、范围索引和知识账本同步",
  "原子提交后 BATCH_CONTRACT 被替换为下一批合同",
]
