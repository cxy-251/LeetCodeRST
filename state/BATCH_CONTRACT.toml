[problems."0179"]
title = "Largest Number"
difficulty = "Medium"
primary_risks = [
  "排序关键字不是数值大小或字典序，而是比较 a+b 与 b+a；必须说明交换相邻逆序对为何不会降低整体拼接值",
  "比较关系需要满足排序 API 的严格弱序要求；不能只用若干例子宣称传递性",
  "全部元素为 0 时排序拼接会产生多个前导零，必须统一返回单个 0",
  "输入可含大整数但比较应基于十进制字符串，不能把拼接结果解析成固定宽整数",
  "C qsort 比较器的字符串生命周期、临时拼接分配和失败路径需要完整处理；若选择索引排序，所有权必须明确",
  "R/Julia/TypeScript 的排序比较器返回契约、稳定性无关性、字符串拼接成本与输出载荷需静态核对",
]
minimum_static_review = [
  "人工推演 [10,2]、[3,30,34,5,9]、[0,0]、[121,12] 和前缀相同的比较边界",
  "证明局部交换准则、全局最优和比较关系可供排序使用；说明相等比较允许任意顺序",
  "逐语言核对字符串转换、比较器方向、前导零、输入修改与返回字符串所有权",
  "复杂度区分 n 次字符串化、O(n log n) 次比较、每次最多 O(k) 拼接比较及最终输出长度",
]

[problems."0187"]
title = "Repeated DNA Sequences"
difficulty = "Medium"
primary_risks = [
  "窗口长度固定为 10，输入字符只来自 A/C/G/T；长度小于 10 时返回空结果",
  "2 位编码配合 20 位掩码滚动，必须证明编码与长度 10 字符串一一对应，且移位后只保留最近 10 个字符",
  "同一片段出现三次以上只能加入结果一次，需要区分首次出现、第二次出现和后续出现状态",
  "结果顺序通常不作为合同核心，但十语言输出不能依赖未声明的哈希迭代顺序；主实现应按第二次出现的扫描顺序追加",
  "C 可使用 2^20 状态字节数组避免通用哈希；分配失败、结果数组和每个 11 字节字符串的清理必须完整",
  "TypeScript 位运算转 32 位有符号但 20 位状态安全；R bitw 操作同样安全；Julia/Go/C 字节扫描依赖 ASCII 合同",
]
minimum_static_review = [
  "人工推演 AAAAACCCCCAAAAACCCCCCAAAAAGGGTTT、AAAAAAAAAAAAA、长度 9、长度 10 和无重复",
  "证明滚动编码窗口不变量、编码无碰撞和状态 0/1/2 的去重语义",
  "逐语言核对字符到 2 位编码、20 位掩码、子串坐标、结果所有权和 C 失败清理",
  "复杂度报告 O(L) 扫描、固定 2^20 计数状态或语言哈希成本，以及结果字符串载荷",
]

must_preserve = [
  "0175–0178、0180–0185 只登记 Database，不创建十语言算法 RST；0186 只登记 Premium",
  "0179 的拼接比较器、局部交换到全局最优证明、比较器排序契约、全零归一化和字符串成本",
  "0187 的 2 位滚动编码、20 位掩码、第二次出现去重状态、C 结果资源和字符单位",
  "两道公开算法题各自固定十语言完整实现、独立人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "把 Database 题伪装成十语言算法题或为其创建空壳 RST",
  "参考 0173–0174 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "在 0179 中按普通字典序或数值大小排序，解析 a+b 为固定宽整数，或省略全零归一化",
  "在 0187 中保存全部长度 10 子串后做二次全局计数却声称固定状态空间，或同一重复片段输出多次",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "顺序登记 Database 与 Premium 跳过，不遗漏 0175–0187 中任何题号",
  "0179 与 0187 逐项对照 0050 的证明/数值边界和 0076 的字符串/适配成本深度",
  "0179 写完立即完成单题质量门；0187 出现压缩迹象时按已完整连续前缀缩批",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算与验证策略回归检查均通过",
  "0179 与 0187 各自只有一个自包含 RST，每题十语言代码全部内联",
