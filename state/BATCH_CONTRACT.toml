[contract]
schema_version = 2
batch_id = "quality-repair-0150"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [150]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0150 虽是 Medium，但合法 RPN 前缀证明、非交换操作数顺序、十语言向零截断差异、32 位中间值、解析与 C 栈分配失败路径叠加；单题完整返工，避免跨越 0150/0151 规则边界压缩内容。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "problems/0101-0200/README.rst",
  "https://leetcode.com/problems/evaluate-reverse-polish-notation/description/",
  "state/concepts/0150.toml",
]
fact_sources_may_provide = [
  "官方 token 域、合法表达式、非零除数、向零截断与所有中间值适合有符号 32 位的保证",
  "RPN 栈、左右操作数、整数解析和跨语言除法适配的既有事实连续性",
  "当前范围、进度和统一静态审查政策",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0150"]
title = "Evaluate Reverse Polish Notation"
difficulty = "Medium"
primary_risks = [
  "输入含 1..10000 个 token，每个是 +、-、*、/ 之一或 [-200,200] 的十进制整数；表达式合法、除数非零、答案与全部中间结果适合有符号 32 位，输入只读",
  "处理任意合法前缀后，栈深必须等于已见操作数数减运算符数；运算符到达前深度至少 2，完整表达式结束深度恰为 1，不能只说用栈所以正确",
  "栈中从底到顶保存已完成且尚未消费的子表达式；数字新建子表达式，运算符把最靠后的 left/right 两项替换为合成值，需证明顺序、覆盖和终止",
  "减法与除法非交换：第一次弹出的是 right，第二次才是 left；任何数组 top 实现都要与此顺序一致",
  "运算符识别必须是完整单 token 相等，负数 -11 不能因首字符 '-' 被误判；合法 token 保证可解析，但解析函数、字符扫描与错误通道仍需逐语言核对",
  "除法统一向零截断；Python // 与 R %/% 对负商向负无穷取整，必须用绝对值商和符号恢复或等价精确方案，TypeScript 用 Math.trunc，Julia 明确 RoundToZero",
  "全部真实中间值适合 32 位，但语言表达式、abs、INT_MIN/-1、解析与最终窄化仍要由官方保证闭合；TypeScript/R 的浮点载体需证明 32 位整数算术精确",
  "C 栈容量为 tokensSize、乘法与 malloc 大小安全，成功路径 free；分配失败若返回 0 会与合法答案 0 冲突，必须明确平台 int 签名没有独立错误通道",
]
minimum_static_review = [
  "逐 token 人工推演三个官方示例，记录 token、动作、栈内容、top/深度和最终唯一值，第三例专项核对 -11 是数字与 6/-132 向零得到 0",
  "覆盖单数字、left-right 次序、left/right 三种负号除法组合、绝对值小于除数得到 0、连续子表达式合成和最大可能栈深",
  "对每个前缀证明 depth=operands-operators、合法运算符前 depth>=2、数字与运算符转移保持子表达式栈不变量、完整输入最终 depth=1",
  "逐语言核对公开签名、token 完整匹配、整数解析、pop/top 更新、除法方向、32 位/安全整数、返回类型和输入不修改",
  "专项对照 C/C++/Java/Rust/Go/C# 原生向零整数除法、Python 符号恢复、TypeScript Math.trunc、Julia div RoundToZero 与 R 绝对值 %/%",
  "专项审查 C tokensSize*sizeof(stack item)、malloc 失败的歧义哨兵、所有返回路径、合法前缀防下溢和最终 stack[0] 读取见证",
  "复杂度同时报告 token 数 t、总字符数 L、峰值栈深 s；解析 O(L)、栈操作 O(t)、峰值 O(s)<=O(t)，并核对 R/托管语言对象与累计分配",
  "删除旧文中运行官方示例和多语言输出一致的验证表述；当前只记录纸面推演、静态语义审查与剩余风险",
]

must_preserve = [
  "精确合法 RPN 契约、自建非交换与负商示例、可区分 -11 数字和 '-' 运算符的反例",
  "token、stack、top/depth、left、right、value 与 answer 的状态映射",
  "前缀栈深、完成子表达式、运算符合成、最终唯一值和有限扫描不变量及完整证明",
  "向零截断的数学定义、跨语言实现分类、32 位中间保证与除零排除",
  "O(t+L) 或 O(L) 时间、O(s) 峰值栈及 C/托管语言解析与分配真实成本",
  "固定十语言完整实现，C 资源路径闭合，平台签名、解析 API 和语言版本准确",
  "准确静态审查证据、失败方式、学习链和带答案自检",
]

forbidden = [
  "参考 0147–0149 或其他最近题目的章节结构",
  "调用 eval、表达式解释器或把 RPN 重新拼成宿主语言表达式",
  "只说遇数入栈遇运算符计算，不证明合法前缀深度、子表达式对应和最终唯一值",
  "把第一次弹出值当 left，导致减法和除法反序",
  "只检查 token 首字符或是否包含符号，把 -11 等负整数误判为运算符",
  "Python 直接使用 //、R 直接使用 %/% 或 floor 处理负商并声称向零截断",
  "用浮点 left/right 除法再未经审查地强转整数，或把 Python 任意精度结论外推到固定宽语言",
  "忽略 C 栈分配失败、释放、容量乘法或合法 0 与失败 0 无法区分的接口限制",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "当前题逐项对照合同选定的 0050 与 0076 黄金题",
  "命中 DRIFT_LOG 的回归检查均通过",
  "0150 只有一个自包含 RST，十语言代码全部内联",
  "PROGRESS、README、AGENTS 当前状态、范围索引和知识账本同步",
  "原子提交后 BATCH_CONTRACT 被替换为下一批合同",
]
