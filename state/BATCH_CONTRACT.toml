[contract]
schema_version = 2
batch_id = "historical-review-0168"
status = "ready"
phase = "historical_review"
kind = "targeted_review"
scope = [168]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true
next_review_after_batch = 169

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 1
proof_risk = "medium"
language_semantics_risk = "medium"
platform_type_risk = "low"
output_volume_risk = "low"
scope_may_shrink = false
scope_reason = "本批只审查一道 Easy；无零位进制证明与七字符容量需要精确，但不应为满足固定篇幅重写强主体。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
style_roles = [
  "0050 提供整数边界、严格下降循环状态、十语言数值语义和终止证明基线",
  "0076 提供字符串构造、返回载荷、字符单位与逐语言物化成本基线",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "state/concepts/0101-0150.toml",
  "state/concepts/0151-0200.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0101-0200/README.rst",
  "https://leetcode.com/problems/excel-sheet-column-title/description/",
]
fact_sources_may_provide = [
  "0168 的正整数范围、Excel 标题映射、无零字符语义和官方示例",
  "此前输出载荷、整数边界、字符串构造和 0171 互逆学习链的知识状态",
  "0219 新题生成暂停和历史审查推进到 0168 的状态事实",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problem]
id = 168
title = "Excel Sheet Column Title"
path = "problems/0101-0200/0168-excel-sheet-column-title.rst"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "核对每轮先减一再取余、0..25 到 A..Z、低位逆序生成与最终反转；26 的倍数不能产生零字符",
  "核对 N=current*26^k+sum(x_i*26^i) 不变量、欧几里得商余唯一性、商严格下降和整体还原证明",
  "核对 2^31-1 对应 FXSHRXW 且长度最多 7，C/C#/R 固定容量必须由该上界支撑",
  "核对 TypeScript/R 在 2^53 内保持整数精确，Rust/Go/Julia 只构造已证明合法的 ASCII 字节",
  "审计 complexity.title_output_payload 与既有 complexity.output_space_exclusion 的关系；专门状态可以保留，但学习链不能把返回载荷核算误写成 0168 首次出现",
  "把新引入、强化和关联知识分开，保留 0171 编解码互逆关系但不以最近题结构作为样本",
]

minimum_static_review = [
  "人工推演 1、26、28、52、701、702、703 与 2^31-1，逐轮记录减一值、余数、字符和高位商",
  "完整核对合法字符、位值不变量、商严格下降、终止、数值还原与表示唯一性",
  "逐语言核对公开签名、整数除法、字符码、构建方向、反转、固定容量、C 返回所有权和 R 物化",
  "复杂度以标题长度 L 报告循环、反转、字符串构造与返回载荷，不能把输出空间写成 O(1)",
  "知识账本只从 state/concepts 的五十题平面状态读取，完成后把下一审查入口推进到 0169",
]

must_preserve = [
  "精确契约、26 倍数反例、无零位抽象、位值不变量、完整五段证明和输出载荷复杂度",
  "固定十语言实现、七字符容量、TypeScript/R 精确域、静态审查、剩余风险、边界和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "直接用 current%26 映射字母、遗漏先减一、忘记反转或在正输入结束前停止",
  "忽略固定容量证明、返回字符串载荷或语言字符物化",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

[completion]
required = [
  "正文只在审查发现明确问题时修改",
  "知识账本保留稳定 concept ID，并准确区分首次引入、强化和关联",
  "PROGRESS、REVIEW_INDEX 与下一份 BATCH_CONTRACT 同步到 0169",
  "不修改完成题数和 0219 的生成进度事实",
  "一个原子 main 提交，不创建分支或 PR",
]
