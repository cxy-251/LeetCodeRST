[contract]
schema_version = 2
batch_id = "quality-repair-0148"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [148]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0148 需要把现有递归归并替换为自底向上常量工作空间方案，并在十语言中证明 run 切分、稳定合并、逐轮覆盖、宽度终止和 Rust 独占所有权；单题完整返工。"

[references]
style_baselines = [
  "problems/0001-0100/0076-minimum-window-substring.rst",
  "problems/0001-0100/0100-same-tree.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0143-reorder-list.rst",
  "problems/0101-0200/0147-insertion-sort-list.rst",
  "state/concepts/0148.toml",
]
fact_sources_may_provide = [
  "ListNode 字段、节点身份、断链、稳定连接和尾链接槽位术语",
  "Rust Option<Box<ListNode>>、Julia mutable struct 与 R environment 的事实连续性",
  "当前范围、进度和既有概念记录",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0148"]
title = "Sort List"
difficulty = "Medium"
primary_risks = [
  "输入是可空无环单链，输出按值非递减并复用全部原节点；目标为 O(n log n) 时间和 O(1) 核心额外空间，递归 top-down 的 O(log n) 调用栈不能伪装成常量空间",
  "自底向上归并先统计 n，再按 width=1,2,4,... 分轮；每轮输入必须已经分成长度至多 width 的有序 runs，输出合并成长度至多 2*width 的有序 runs",
  "split_run 必须截取至多 width 个节点、清空该 run 尾边并返回剩余链；短尾 run、空 right run 和两节点边界不能共享旧边",
  "merge_runs 必须稳定选择左侧等值节点，逐个消费两个 run 并同时交付新头与新尾；若合并后再扫描找尾会引入隐藏重复工作",
  "每轮必须精确覆盖全部节点一次，已输出前缀、当前左右 runs 与未处理后缀两两不交；节点守恒、连通、无重复、无环和尾部为空都要证明",
  "width 翻倍与循环终止由 n<=50000 支撑；计数、2*width、末轮和 n=0/1 路径不得产生溢出或零宽死循环",
  "Rust 需要非递归安全所有权方案，用 take 切出 runs、消费 Box 合并并经尾槽位拼回；禁止 unsafe、裸指针、Rc 图或节点克隆",
  "R environment 与 Julia 可变节点要表达返回新头和共享字段修改；托管语言每轮 dummy 分配、平台构造器和累计常数对象成本需如实说明",
]
minimum_static_review = [
  "人工推演 n=5 的 width=1、2、4 三轮，逐段记录 left、right、rest、合并结果、输出尾和剩余节点集合",
  "覆盖空链、单节点、两节点、奇数尾 run、没有配对 right run、已排序、逆序和带身份标签重复值",
  "逐辅助操作证明 split_run 的长度、断边和剩余入口，merge_runs 的有序、稳定、完整、返回尾与终止",
  "证明每轮所有节点恰好进入一个输入 run 和一个输出 run，每轮 O(n)，轮数 ceil(log2 n)，最终单 run 覆盖全部节点",
  "逐语言核对公开签名、ListNode 字段、计数和 width 类型、dummy 生命周期、返回新头、无递归和无额外节点数组",
  "专项审查 Rust run 所有权分区、take 后空槽、尾槽位借用、剩余链交还、无 clone/unsafe 与真实 O(1) 活跃辅助状态",
  "专项审查 C 无分配路径、Go/TypeScript/C# 构造器与空引用、Julia mutable struct 和 R environment 的逐轮重连可见性",
]

must_preserve = [
  "精确 O(n log n)/常量工作空间契约、自建多轮 run 示例和重复值身份稳定性反例",
  "自底向上归并取舍、n 与 width 状态、当前 pass 的 run 分区及代码变量映射",
  "split_run、merge_runs、pass 和 width 四层不变量与完整正确性证明",
  "节点唯一覆盖、稳定性、无环、尾部终止、每轮严格进展和最终单 run 证明",
  "每轮 O(n)、O(log n) 轮、总 O(n log n)、O(1) 核心状态及语言真实 dummy/所有权成本",
  "固定十语言完整非递归实现，平台节点定义不重复，C 与 Rust 资源和所有权路径闭合",
  "准确静态审查证据、失败方式、学习链和带答案自检",
]

forbidden = [
  "参考 0146–0147 或其他最近题目的章节结构",
  "以 top-down 递归作为主实现却声称严格 O(1) 额外空间",
  "只说归并排序所以正确，不证明 run 切分、逐轮覆盖和节点守恒",
  "split 后保留跨 run 旧边，或 merge 后不交付真实尾节点",
  "相等值优先取右侧却声称稳定",
  "把节点复制到数组、创建同规模新链、递归调用栈或每轮节点引用表藏进常量空间",
  "Rust 使用 unsafe、裸指针、Rc<RefCell<_>>、节点 clone 或无法通过借用检查的伪代码",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "当前题逐项对照合同选定的 0076 与 0100 黄金题",
  "命中 DRIFT_LOG 的回归检查均通过",
  "0148 只有一个自包含 RST，十语言代码全部内联",
  "PROGRESS、README、AGENTS 当前状态、范围索引和知识账本同步",
  "原子提交后 BATCH_CONTRACT 被替换为下一批合同",
]
