[contract]
schema_version = 2
batch_id = "quality-repair-0141-0142"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [141, 142]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 3
target_min = 3
target_max = 5
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "low"
scope_may_shrink = true
shrink_rule = "若 0142 的入口同余证明、原节点身份返回或十语言循环链表适配无法完整承载，只提交已完整达标的连续前缀 0141，并把 0142 保留到下一合同。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0100-same-tree.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0138-copy-list-with-random-pointer.rst",
  "state/concepts/0141.toml",
  "state/concepts/0142.toml",
]
fact_sources_may_provide = [
  "链表节点身份、平台类型和所有权连续性",
  "Floyd 术语、关联题目和既有知识记录",
  "当前范围、进度与下一步事实",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0141"]
title = "Linked List Cycle"
difficulty = "Easy"
primary_risks = [
  "题面 pos 只描述尾节点连接位置，不属于函数参数；公开接口只接收 head，不能依赖外部索引",
  "Floyd 第一阶段必须分别证明无环时安全到达 null、有环时相对位移最终归零，并且比较节点身份而不是 val",
  "空链表、单节点无环、单节点自环、长尾入环和重复节点值会区分身份算法与错误值比较",
  "Rust 常见 Box 链表不能安全表达环，Rc<RefCell> 或等价适配必须明确偏离平台模板、所有权成本和身份比较",
  "Julia mutable struct 与 R environment 需要复用仓库节点身份模型，不能以结构相等代替同一对象",
]
minimum_static_review = [
  "人工推演题目页面示例与空链表、单节点无环、单节点自环、两节点环、长尾入环和重复值边界",
  "逐轮核对 fast 的空引用守卫、slow 一步、fast 两步、相遇判定和无输入修改",
  "逐语言静态检查平台签名、节点身份 API、短路求值、可空类型、借用/引用计数和循环结构表达能力",
  "区分算法 O(1) 指针状态与适配器引用克隆或节点表示成本，并记录未运行未编译事实",
]

[problems."0142"]
title = "Linked List Cycle II"
difficulty = "Medium"
primary_risks = [
  "第一阶段只提供环内相遇点；第二阶段必须从 t 与环长的同余关系推出头到入口距离等于相遇点到入口距离模环长",
  "证明不能默认慢指针相遇前只绕环零圈，也不能把入口偏移、总路程和环长倍数混为同一个变量",
  "第二阶段返回的必须是原链表入口对象；节点值相同、新建替代节点或结构相等都不满足身份契约",
  "无环、入口就是 head、长尾、自环与两节点环需要覆盖第一阶段退出和第二阶段零步/多步相遇",
  "Rust/R/Julia 循环对象适配、临时克隆和返回引用必须保持原节点身份且不修改 next",
]
minimum_static_review = [
  "人工推演题目页面示例与无环、入口为 head、单节点自环、长尾入环、重复值和最短环边界",
  "以 mu、lambda、t 和相遇偏移逐项复核 t≡0(mod lambda)、mu+offset≡0(mod lambda) 及同步前进结论",
  "静态检查第一阶段空指针守卫、第二阶段身份比较、原节点返回、不修改输入和有限终止",
  "逐语言核对可空返回类型、Rc::ptr_eq、ReferenceEquals、TypeScript/Julia 的 === 与 R identical 等身份语义",
  "无法由静态资料确认具体平台循环链表模板时明确写成适配器剩余风险，不运行题解代码",
]

must_preserve = [
  "精确契约、自建例子和重复值反例",
  "位置、路程、环长、相遇偏移和代码指针的逐项映射",
  "0141 的有环必相遇与无环安全退出证明",
  "0142 不省略整圈次数的入口同余证明和入口前不可能提前相遇论证",
  "十语言完整实现与节点身份、可空类型、所有权和循环表示差异",
  "Rust/R/Julia 非普通线性链表模板适配的诚实说明",
  "准确静态审查证据、边界、学习链和带答案自检",
]

forbidden = [
  "参考 0138、0140 或其他最近题目的章节结构",
  "把节点值相等写成节点相遇",
  "把 pos 写进公开函数签名或依赖 pos 求入口",
  "用 2(a+b)=a+b+kλ 而不交代慢指针可能已完成的整圈",
  "声称普通 Box 独占链表可以直接构造安全循环而不提供适配器",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "每题逐项对照合同选定黄金题",
  "命中 DRIFT_LOG 的回归检查均通过",
  "每题只有一个自包含 RST",
  "PROGRESS、README、AGENTS 当前状态、范围索引和知识账本同步",
  "原子提交后 BATCH_CONTRACT 被替换为下一批合同",
]
