reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "medium"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0188 是单道 Hard，交易次数状态、无限交易退化、原地滚动更新顺序、负无穷初始化和十语言资源边界均需要完整展开；本批不追加 0189。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0101-0200/README.rst",
  "problems/0101-0200/0123-best-time-to-buy-and-sell-stock-iii.rst",
  "https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iv/description/",
]
fact_sources_may_provide = [
  "0188 的至多 k 笔交易、买入前必须卖出、价格范围、返回最大利润和官方示例",
  "0123 的股票交易状态术语与平台接口连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0188"]
title = "Best Time to Buy and Sell Stock IV"
difficulty = "Hard"
primary_risks = [
  "一笔交易必须先买后卖，同一时刻最多持有一股；k 表示最多完成的卖出次数，不能把买入和卖出各算一笔",
  "有效交易上限为 min(k,floor(n/2))；k>=floor(n/2) 时退化为无限交易，需证明所有正相邻差之和最优",
  "有限交易 DP 必须精确定义 hold[t] 与 cash[t] 的前缀语义、不可达初始化和卖出次数坐标",
  "若使用同日原地更新，需要解释升序或降序如何读取旧状态；不得无证明地混用刚更新的 cash/hold",
  "利润中间状态使用足够宽类型和安全负无穷；不能对负无穷直接减价格造成溢出",
  "C 需要为两组交易状态分配和释放内存，分配失败不得伪装成合法利润；R/Julia 一基索引和循环边界需静态核对",
  "复杂度必须报告 O(n*min(k,n/2)) 时间、O(min(k,n/2)) 核心空间，并单独说明无限交易快捷分支",
]
minimum_static_review = [
  "人工推演 k=2, prices=[2,4,1]；k=2, [3,2,6,5,0,3]；k=0；单日；单调上升；单调下降；k>=n/2",
  "证明交易状态不变量、买卖转移必要/充分性、至多 k 限制和滚动更新不覆盖所需旧状态",
  "证明无限交易分支中每段上涨利润可分解为正相邻差，且任意交易利润不超过对应差之和",
  "逐语言核对宽整数、负无穷、数组长度、索引、输入只读和返回类型",
  "专项审查 C 分配失败清理、TypeScript/R 精确整数、Julia 递增区间和 Rust 所有权",
]

must_preserve = [
  "有效交易数裁剪与无限交易退化条件",
  "有限交易 hold/cash 状态定义、不可达初始化、转移与完整正确性证明",
  "原地滚动更新的读写顺序证明，或使用明确的前一日副本避免语义含混",
  "宽整数、负无穷、C 资源失败和十语言接口适配",
  "固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0179、0187 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "把 k 笔交易误写成 k 次操作，允许未卖出再次买入，或在同一状态中同时持有多股",
  "无条件使用 O(nk) 而遗漏 k>=n/2 的退化，或把贪心分支用于有限小 k",
  "使用 INT_MIN/LLONG_MIN 后直接减价格导致溢出，或把资源失败返回 0 当作已验证答案",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐项对照 0050 的状态/数值边界和 0076 的语言适配/资源成本深度",
  "0188 只有一个自包含 RST，十语言代码全部直接内联",
  "人工推演有限交易与无限交易分支，完成状态、转移、终止和最优性证明",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算与验证策略回归检查均通过",
  "完成范围、completed_count、next_problem、README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
