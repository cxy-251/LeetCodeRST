[contract]
schema_version = 2
batch_id = "historical-review-0188"
status = "ready"
phase = "historical_review"
kind = "targeted_review"
scope = [188]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true
next_review_after_batch = 189

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required"
language_semantics_review = "required"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0188 是独立 Hard，精确交易状态、原地依赖顺序、贪心退化、负无穷与十语言实现均为高风险；不能与 0189 合批。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
style_roles = [
  "0050 提供固定宽边界、安全哨兵、状态递推、终止和十语言数值语义基线",
  "0076 提供 Hard 不变量、局部更新安全性、最优性证明和滚动状态成本基线",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "state/concepts/0101-0150.toml",
  "state/concepts/0151-0200.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0101-0200/README.rst",
  "https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iv/description/",
]
fact_sources_may_provide = [
  "0188 的 k、价格范围、一买一卖交易、最多持有一股、至多 k 笔与只读输入合同",
  "0121–0123 股票状态、滚动 DP、不可达状态、宽整数和正相邻差知识连续性",
  "0188 完成后的下一公开算法题为 0189，新题生成仍暂停在 0219",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
]

[problem]
id = 188
title = "Best Time to Buy and Sell Stock IV"
path = "problems/0101-0200/0188-best-time-to-buy-and-sell-stock-iv.rst"
review_mode = "preserve_strong_body_and_apply_targeted_fixes"
primary_risks = [
  "先修复 C 代码块中重复的 maxProfit 函数签名，随后核对十语言公开接口只有一个有效入口",
  "核对 cash[t]/hold[t] 表示恰好完成 t 次卖出后的空仓/持仓最大现金，买入不增加 t，卖出才从 t-1 推进到 t",
  "核对空前缀只有 cash[0]=0 可达，其他状态为安全 NEG；只从可达来源执行价格加减",
  "证明持股与空仓转移覆盖全部且仅有合法来源，最终对所有 cash[0..limit] 取最大实现至多 k 笔",
  "证明按 t 递减时 hold[t] 读取旧 cash[t]、cash[t] 读取旧 hold[t-1]，不串联同日新状态",
  "核对 floor(n/2) 是可完成交易物理上限；k 达到上限时约束失效并可累加全部正相邻差",
  "分别证明正差和是任意交易集合的上界且可由合法一日交易实现，不能在有限 k 时误用",
  "推导官方约束下利润上界，核对 64 位中间状态、平台 int 转换、TypeScript/R 精确域与 Rust/Go int 假设",
  "逐语言核对递减范围、零基/一基状态槽、NEG/Infinity、输入只读、最终空仓和 k<=0 扩展",
  "核对 C 两数组容量、部分分配失败清理、正常释放和合法答案域外 -1 资源标记",
  "审计股票状态、正差贪心、逆序滚动、宽状态与 C 资源 concept，优先合并到 0121–0123 的稳定 ID",
]

minimum_static_review = [
  "人工推演 k=2,[2,4,1]、k=2/[1] 对 [3,2,6,5,0,3]、k=0、单日、单调升降和大 k",
  "逐日记录小例 cash/hold，核对不可达状态、买卖坐标、递减覆盖顺序和最终 max(cash)",
  "完整复核有限 DP 的来源充分必要性、原地等价性，以及无限分支的上界与可达性",
  "逐语言核对签名、数组长度、负无穷、递减循环、宽整数、返回转换、输入所有权与 C 失败路径",
  "知识账本只从 state/concepts 的五十题平面状态读取，完成后把下一审查入口推进到 0189",
]

must_preserve = [
  "精确交易合同、动作次数反例、无限退化阈值、cash/hold 状态、不可达初始化、递减更新和完整双分支证明",
  "固定十语言实现、宽负无穷、C 资源路径、真实 O(nq)/O(q) 成本、静态审查、剩余风险和带答案自检",
]

forbidden = [
  "把最近完成题目作为格式样本",
  "没有确定性问题时整篇重写或压缩强主体",
  "保留重复 C 函数签名、把买入计为完成交易、把不可达状态置零或返回持仓状态",
  "按 t 递增原地更新、在有限 k 时无条件累计正差、对类型最小值直接加减价格",
  "把一种语言的 Infinity、整数位宽、递减范围或数组索引语义外推为十语言一致",
  "为同一知识新造近义 concept ID",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试、sanitizer 或目标语言最小程序",
]

[completion]
required = [
  "删除 C 重复签名并完成对应静态语义复核",
  "正文只在审查发现明确问题时修改",
  "知识账本保留稳定 concept ID，并准确区分首次引入、强化和关联",
  "PROGRESS、REVIEW_INDEX 与下一份 BATCH_CONTRACT 同步到 0189",
  "不修改完成题数和 0219 的生成进度事实",
  "一个原子 main 提交，不创建分支或 PR",
]
