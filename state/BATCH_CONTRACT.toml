[contract]
schema_version = 2
batch_id = "generation-0212"
status = "ready"
phase = "generation"
kind = "generation"
scope = [212]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 213

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0212 是 Hard，组合 Trie、二维棋盘 DFS、路径访问恢复、结果去重、字符串输出所有权与十语言递归/容器资源；必须独立完成，本批不追加 0213。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0201-0300/0200-number-of-islands.rst",
  "problems/0201-0300/0208-implement-trie-prefix-tree.rst",
  "problems/0201-0300/0211-design-add-and-search-words-data-structure.rst",
  "https://leetcode.com/problems/word-search-ii/description/",
]
fact_sources_may_provide = [
  "0212 的字符棋盘、单词列表、四邻接路径、单格单次使用和返回全部存在单词合同",
  "已有 Trie 路径/终止标记、四邻接 DFS、棋盘标记恢复和对象生命周期术语连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0212"]
title = "Word Search II"
difficulty = "Hard"
primary_risks = [
  "Trie 终止节点保存单词或单词索引；棋盘 DFS 状态同时包含坐标、当前 Trie 节点和当前路径访问集合",
  "只能上下左右移动，同一搜索路径内单格不能重复；进入前标记、返回后恢复，不能污染其他起点或分支",
  "同一单词可能由多个起点或多条路径找到，输出必须去重；清除终止载荷时要证明不会妨碍更长共享前缀单词",
  "从当前 Trie 节点不存在的字符分支立即剪枝；不能为每个单词独立搜索后仍声称 Trie 联合搜索复杂度",
  "复杂度需按 Trie 节点、棋盘格、实际 DFS 状态和最大单词长度表达；粗略最坏分支界与持久 Trie/输出载荷分开",
  "C 需要构建/释放 Trie、保存词索引、管理结果字符串或指针所有权、棋盘标记恢复和任一分配失败清理",
  "Rust 借用 Trie 终止载荷与递归棋盘可变借用、Julia/R 一基索引、TypeScript/Java/C# 二维字符容器都需静态核对",
]
minimum_static_review = [
  "人工推演经典棋盘与 words=[oath,pea,eat,rain]、共享前缀词、同词多路径、单格重复诱惑、对角线伪路径和空输入扩展",
  "证明 Trie 剪枝只排除不可能前缀，DFS 路径标记恰好实施单格单次使用，恢复后不同分支互不污染",
  "证明发现终止词后去重策略只删除输出载荷，不删除仍供更长单词使用的路径",
  "逐语言核对四方向边界、字符索引、访问标记恢复、结果去重、递归深度、字符串/节点生命周期和 C 失败清理",
  "复杂度区分 Trie 构建 O(total word characters)、实际 DFS 访问状态、O(Lmax) 递归栈、Trie 持久存储与输出载荷",
]

must_preserve = [
  "棋盘坐标、Trie 节点和路径访问集合的联合状态",
  "四邻接、单格单次使用、进入标记与退出恢复",
  "Trie 前缀剪枝、终止词去重和共享前缀安全性证明",
  "C 输出/Trie 所有权与十语言二维容器、递归和资源成本",
  "固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0210–0211 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "允许对角线移动或在同一路径重复使用一个棋盘格",
  "找到单词后不恢复棋盘，导致其他起点或分支状态被污染",
  "用集合去重却不报告哈希与字符串存储成本，或清除整个 Trie 分支而遗漏更长词",
  "把最坏搜索统一声称为 O(mn) 或 O(total word characters)",
  "C 返回指向会随 Trie 释放而失效的字符串指针却未声明所有权",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐题对照 0050 的状态/边界和 0076 的剪枝/最优性/资源说明深度",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "单题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为 0213 起的下一批合同",
]
