[contract]
schema_version = 2
batch_id = "generation-0207"
status = "ready"
phase = "generation"
kind = "generation"
scope = [207]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 208

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = false
scope_reason = "0207 从原 0205–0207 高风险批次中拆出，必须独立恢复有向依赖图建边、Kahn 入度不变量、环等价证明、重复边语义和十语言邻接表资源成本；本批不追加 0208。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0101-0200/0133-clone-graph.rst",
  "problems/0101-0200/0141-linked-list-cycle.rst",
  "https://leetcode.com/problems/course-schedule/description/",
]
fact_sources_may_provide = [
  "0207 的课程数量、先修对 [course, prerequisite]、是否能完成全部课程和官方示例",
  "已有邻接表、图遍历、环与队列术语连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0207"]
title = "Course Schedule"
difficulty = "Medium"
primary_risks = [
  "先修对 [course, prerequisite] 必须建立 prerequisite -> course 的边；正文、入度定义和十语言实现方向一致",
  "Kahn 算法初始只入队入度 0 课程；每次弹出后删除其全部出边并逐次递减后继入度",
  "processed==numCourses 当且仅当图无环；证明需包含有限 DAG 必有零入度节点和有向环内节点无法被处理",
  "重复边若按输入逐条保留，邻接表和入度必须同时保留相同次数；不能邻接去重却仍重复增加入度",
  "自环、两节点环、菱形 DAG、孤立课程、多个分量和空 prerequisites 都要覆盖",
  "C 需要一次构建出度、前缀偏移、邻接数组、入度和队列；任一分配失败返回 false 不能与图有环区分，正文必须声明平台签名缺少失败通道及剩余风险，或采用明确适配器状态",
  "R/Julia 使用课程编号加一映射到一基索引；TypeScript/Java/C# 嵌套容器和 Rust/Go 所有权需静态核对",
]
minimum_static_review = [
  "人工推演 numCourses=2 的单边可行、自环、两节点环、菱形 DAG、孤立课程、多个分量和重复边",
  "证明入度始终等于来自未处理节点的剩余入边数",
  "证明无环图只要仍有节点就存在零入度节点；有环时环内每个节点始终保留至少一条环内入边",
  "证明 processed==V 与可完成全部课程等价，并证明每个顶点至多入队一次",
  "逐语言核对建边方向、课程编号边界、重复边次数、队列头索引、邻接表成本和 C 失败路径",
  "复杂度报告 O(V+E) 时间与 O(V+E) 空间，区分邻接载荷、入度、队列和语言容器开销",
]

must_preserve = [
  "prerequisite->course 建边方向和入度定义",
  "Kahn 队列不变量、processed 计数与环等价完整证明",
  "自环、重复边、孤立课程和多分量边界",
  "C 邻接表构建与失败清理、R/Julia 索引映射和十语言容器资源成本",
  "固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0205–0206 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "把 [course, prerequisite] 建成 course->prerequisite 却沿用原入度解释",
  "只检查是否存在初始零入度节点，或 processed<V 时仍返回 true",
  "忽略重复边导致邻接次数与入度次数不一致",
  "用无向图判环方法处理课程依赖",
  "声称只有 O(V) 空间而忽略 E 条邻接载荷",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐项对照 0050 的状态/数值边界和 0076 的语言适配/资源成本深度",
  "0207 只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完整证明建边与入度语义、DAG 零入度性质、环阻塞和 processed 判定",
  "人工推演全部要求边界并逐语言核对邻接表、队列、索引和失败路径",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
