[contract]
schema_version = 2
batch_id = "generation-0208-0209"
status = "ready"
phase = "generation"
kind = "generation"
scope = [208, 209]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 210

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 4
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0208 是带状态生命周期的 Trie 设计题，涉及节点终止标记、C 构造/释放和 Rust/R/Julia 引用语义；0209 依赖全正数窗口单调性、最短性证明与宽整数。先完整验收 0208；若继续 0209 会压缩窗口证明或十语言数值边界，则提交连续前缀并重建 0209 单题合同。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
  "problems/0101-0200/0133-clone-graph.rst",
  "https://leetcode.com/problems/implement-trie-prefix-tree/description/",
  "https://leetcode.com/problems/minimum-size-subarray-sum/description/",
]
fact_sources_may_provide = [
  "0208 的小写英文字母、insert/search/startsWith 操作和调用序列合同",
  "0209 的正整数数组、目标和、最短非空连续子数组与不存在时返回 0 的合同",
  "已有前缀、可变节点、滑动窗口、字符单位和资源生命周期术语连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0208"]
title = "Implement Trie (Prefix Tree)"
difficulty = "Medium"
primary_risks = [
  "Trie 节点必须同时保存最多 26 个子链接和 is_word 终止标记；路径存在不等于完整单词存在",
  "insert 逐字符创建缺失节点，search 要求路径存在且终点 is_word=true，startsWith 只要求路径存在",
  "重复插入、一个词是另一个词前缀、共享前缀、查询不存在分支和空字符串扩展必须区分",
  "官方字符域为小写英文字母；每种语言都要核对字符到 0..25 索引、字符单位和非法字符边界",
  "C 需要构造、插入分配失败策略、递归或迭代释放；平台 insert 返回 void 时无法报告中途失败，必须声明对象一致性方案",
  "Rust Option<Box<Node>>、Julia mutable struct、R environment 节点和托管语言对象图的所有权/回收成本需静态核对",
]
minimum_static_review = [
  "人工推演 insert apple、search apple、search app、startsWith app、insert app、重复插入、共享前缀和不存在分支",
  "证明每条路径与字符前缀一一对应、终止标记区分完整词、三种操作返回语义正确",
  "逐语言核对字符索引、节点初始化、缺失分支、重复插入、对象生命周期和 C 失败清理",
  "复杂度按单次字符串长度 L 报告 O(L) 时间；新增节点最坏 O(L)，整体存储按创建节点数计",
]

[problems."0209"]
title = "Minimum Size Subarray Sum"
difficulty = "Medium"
primary_risks = [
  "数组元素严格为正是滑动窗口可行性的核心；若允许 0 或负数，右扩和左缩的单调性证明失效",
  "右指针加入元素后，只要 sum>=target 就持续收缩左端并更新最短长度；不能只收缩一次",
  "窗口状态必须保持 sum 等于 nums[left..right] 之和，左端越界和不存在答案返回 0 需覆盖",
  "固定宽度语言使用宽整数累计，避免元素和溢出；返回长度仍为普通整数",
  "R/Julia 一基索引、TypeScript number 精确域、C 指针与长度接口以及输入只读需静态核对",
]
minimum_static_review = [
  "人工推演 target=7 nums=[2,3,1,2,4,3]、单元素命中、总和不足、答案在开头/结尾和连续多次收缩",
  "证明正数使右扩和左缩具有单调性，算法不会跳过任何更短可行窗口",
  "证明每个元素最多被左右指针各经过一次，时间 O(n)、核心额外空间 O(1)",
  "逐语言核对宽整数求和、哨兵最短长度、空输入扩展和返回 0 语义",
]

must_preserve = [
  "0208 的路径节点、终止标记、search/startsWith 区分和对象生命周期",
  "0209 的全正数前提、窗口和不变量、持续收缩与最短性完整证明",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0207 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "0208 只凭路径存在让 search 返回 true，或把 startsWith 也要求终止标记",
  "0208 C 分配失败后留下无法说明的一半新路径，或不提供释放函数",
  "0209 在含负数模型上继续声称同一滑动窗口正确",
  "0209 达到 target 后只移动一次 left，或更新答案时使用错误窗口长度",
  "把 Trie 返回节点载荷或滑动窗口输入算成 O(1) 总空间",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐题对照 0050 的状态/数值边界和 0076 的语言适配/资源成本深度",
  "每题完成后立即执行质量门；0209 出现压缩迹象时按合同缩批",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "每道算法题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
