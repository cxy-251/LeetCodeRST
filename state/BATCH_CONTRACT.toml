[contract]
schema_version = 2
batch_id = "generation-0204"
status = "ready"
phase = "generation"
kind = "generation"
scope = [204]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 205

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 2
target_min = 2
target_max = 4
proof_risk = "medium"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "medium"
scope_may_shrink = false
scope_reason = "0204 从原 0201–0204 高风险批次中拆出，必须独立恢复完整筛法证明、严格小于 n 的边界、p*p 起点依据、乘法溢出和十语言筛数组成本；本批不追加 0205。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0101-0200/0172-factorial-trailing-zeroes.rst",
  "https://leetcode.com/problems/count-primes/description/",
]
fact_sources_may_provide = [
  "0204 的非负整数 n、统计严格小于 n 的质数数量和官方示例",
  "已有整除边界、宽整数和循环条件的平台语义连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0204"]
title = "Count Primes"
difficulty = "Medium"
primary_risks = [
  "统计范围严格是 [0,n)，不能把 n 本身计入；0 与 1 不是质数，n<=2 返回 0",
  "埃氏筛只在当前 p 尚未被标记时从 p*p 开始标记；必须证明小于 p*p 的 p 倍数已被更小质因子处理",
  "外层循环不能用可能溢出的 p*p<n 直接判断；优先使用 p<= (n-1)/p、p<n/p 或足够宽状态，并逐语言核对",
  "筛数组长度应与 [0,n) 一一对应，初始化 0、1 为非质数，最终只统计索引 2..n-1",
  "C 分配失败返回合法计数域外的 -1，并检查 size_t 容量；固定十语言需分别说明布尔表示和 O(n) 内存成本",
  "TypeScript 普通 Array<boolean> 与 Uint8Array 的存储差异、R logical 向量分配、Julia 一基索引映射需要单独审查",
]
minimum_static_review = [
  "人工推演 n=0、1、2、3、10、20、25 和平方边界",
  "证明未被更小质数标记的 p 必为质数、从 p*p 标记不漏合数且不影响质数",
  "证明最终未标记索引与严格小于 n 的质数一一对应",
  "逐语言核对筛长度、0/1 初始化、循环上界、乘法溢出、标记步长、内存分配和返回类型",
  "复杂度报告 O(n log log n) 时间与 O(n) 空间，并区分算法量级和各语言容器真实字节成本",
]

must_preserve = [
  "严格小于 n 的计数合同与 n<=2 边界",
  "p*p 起点的必要性与充分性证明",
  "避免 p*p 循环判断溢出的跨语言实现",
  "筛数组 O(n) 成本、C 分配失败和 TypeScript/R/Julia 容器适配",
  "固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0201–0203 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "把 n 本身计入答案，或把 1 当作质数",
  "使用可能溢出的 p*p 作为唯一外层循环条件而不做位宽证明",
  "从 2*p 开始却仍声称没有重复标记成本，或从 p*p 开始却不给出完整依据",
  "C 分配失败返回 0 并伪装成合法答案",
  "把 O(n) 筛数组写成 O(1) 空间",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐项对照 0050 的状态/数值边界和 0076 的语言适配/资源成本深度",
  "0204 只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "人工推演全部要求边界，完成筛法不变量、质数判定、标记完整性和终止证明",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "完成范围、completed_count、next_problem、根 README、新范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
