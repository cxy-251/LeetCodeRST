[contract]
schema_version = 2
batch_id = "quality-repair-0164-0165"
status = "ready"
phase = "quality_repair"
kind = "quality_repair"
scope = [164, 165]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = true
completion_count_must_remain_unchanged = true

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 6
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0164 为 Hard、0165 为 Medium，合计 6 分且是返工范围最后两题。0164 的桶宽与数值证明不得因批次收尾压缩；必须先完整验收 0164，再写 0165。若第二题开始压缩长修订号、缺失零段、字符单位或物化成本，只提交连续前缀 0164 并重建合同。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0101-0200/README.rst",
  "https://leetcode.com/problems/maximum-gap/description/",
  "https://leetcode.com/problems/compare-version-numbers/description/",
  "state/concepts/0164.toml",
  "state/concepts/0165.toml",
]
fact_sources_may_provide = [
  "0164 的非负整数域、长度和值域、排序后相邻差目标、少于两项返回零和线性时空要求",
  "0165 的点分十进制修订号、前导零忽略、缺失修订号按零、返回 -1/0/1 和字符串约束",
  "既有鸽巢桶、有效数字跨度比较与当前语言接口连续性",
  "当前范围、进度和统一静态审查政策",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0164"]
title = "Maximum Gap"
difficulty = "Hard"
primary_risks = [
  "输入长度 1..100000、元素在 [0,10^9]；返回排序后相邻元素最大差，少于两项返回 0，输入只读且要求 O(n) 时间、O(n) 额外空间",
  "当 n>=2 且 high>low 时，桶宽 w=ceil((high-low)/(n-1))；必须从 n-1 个排序间距总和证明最大间距至少 w",
  "同桶整数差严格小于 w，因此最大间距必跨桶；扫描相邻非空桶时，前桶最大值与后桶最小值必须证明为排序后真正相邻元素",
  "桶数 floor((high-low)/w)+1 必须证明不超过 n；不能只声称线性而分配与值域 10^9 成正比的计数数组",
  "n<2、high==low、重复值、极端稀疏值、空桶和第一个非空桶的 previous 状态需要分别闭合，不能用数值哨兵假装桶已使用",
  "差值、上取整分子、桶索引和跨桶差在固定宽语言中先提升到足够宽类型；TypeScript/R 需证明当前整数域精确",
]
minimum_static_review = [
  "人工推演官方 [3,6,9,1]、单元素示例及自建重复稀疏例，列 low/high/range/w/count、每个值桶号、桶极值和跨桶候选",
  "覆盖两元素、全相等、重复最小/最大、连续整数、最大值 10^9、最大间距在首尾和多个空桶",
  "完整证明鸽巢下界、桶内严格小于 w、最大差必跨桶、相邻非空桶边界是排序相邻元素以及扫描完备性",
  "独立证明 w>=1、最大值桶号<count、bucket_count<=n、所有宽化表达式和最终 int 返回安全",
  "逐语言核对公开签名、桶初始化/used 标记、索引转换、容器分配、输入所有权、只读语义和资源失败",
  "专项审查 C calloc 数量与元素大小、失败返回歧义、free 成功路径；报告三次线性扫描和 O(n) 桶载荷",
]

[problems."0165"]
title = "Compare Version Numbers"
difficulty = "Medium"
primary_risks = [
  "两个版本字符串长度各 1..500，由 ASCII 数字与点号组成；按修订号从左到右比较，忽略前导零，缺失后续修订号视为 0，返回 -1/0/1",
  "不能把任意修订号解析为固定宽整数或浮点数；有效跨度先比去零后位数，等长再逐字符比较，才能覆盖 500 位修订号",
  "全零修订号与缺失修订号都规范化为有效长度 0；一侧结束后另一侧必须继续检查非零尾段，不能按字符串结束立即判小",
  "每轮 end、significant、next 三个边界必须区分段尾点号与字符串尾；已结束侧读取为空零段且位置保持结束，未结束侧严格前进",
  "ASCII 合同支撑 C/Rune 以外的字节或代码单元扫描；Julia codeunits 是 O(1) 包装，R utf8ToInt 是 O(n+m) 物化，不能统一写成常数空间",
  "C++ 按值字符串接口、Rust 消费 String、Java 每轮 Segment 对象、R 整数向量和各语言字符比较顺序需如实计费",
]
minimum_static_review = [
  "人工推演官方等价、较小、尾零等案例及超长修订号，逐段记录 end、significant、digits、next 和首次差异",
  "覆盖 1.01 与 1.001、1.0 与 1.0.0、1.0.1 与 1、全零段、长前导零、500 位非零修订号和不同段数",
  "证明有效位数与等长字典序等价于非负十进制整数序，首次不同修订号决定版本序，扫描完毕等价",
  "证明两指针每轮至少有未结束侧前进、不会在缺失零段上死循环，且每个字符只被常数次访问",
  "逐语言核对公开签名、ASCII 单位、半开跨度、点号跳过、结束位置、返回符号、输入复制/所有权和辅助对象",
  "分别报告核心 O(n+m) 时间与 O(1) 索引状态，以及 C++ 参数副本、Java 短命对象、Rust 所有权、Julia 包装和 R 物化成本",
]

must_preserve = [
  "两题各自具备精确契约、自建反例、问题抽象、解法取舍、状态不变量和完整正确性证明",
  "0164 的鸽巢下界、桶内严格界、跨桶相邻性、桶数线性与宽整数资源证明",
  "0165 的有效数字跨度、缺失等于零、长修订号无解析、双指针进度与字符物化成本",
  "固定十语言完整实现，平台签名、整数、字符单位、索引、所有权和失败路径准确",
  "每题独立的人工推演、逐语言静态审查、剩余风险、失败方式、学习链和带答案自检",
]

forbidden = [
  "参考 0155、0160、0162 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "在 0164 中直接排序形成 O(n log n)，按值域分配 10^9 桶，或只背诵鸽巢原理而不证明桶边界覆盖",
  "使用 floor 平均间距导致桶内差可等于目标下界，却仍声称最大差必跨桶",
  "在窄类型完成 high-low 或 range+n-2 后再赋给宽类型，或用 0 作为桶未使用的唯一哨兵",
  "在 0165 中用 int/long/double 解析任意修订号，以 split 物化却声称 O(1) 辅助空间，或按原始段长度比较前导零",
  "一侧字符串结束就立即判版本较小，遗漏缺失修订号等于零；或让结束侧与零尾段循环不前进",
  "把 Unicode 通用字符边界外推给 ASCII 字节扫描，或混淆 Julia codeunits 包装与 R utf8ToInt 物化",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "两题逐项对照 0050 的数值边界/状态递推深度与 0076 的扫描不变量/物化深度",
  "每题写完立即完成自身质量门；0165 出现压缩迹象时按连续前缀缩批",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算与验证策略回归检查均通过",
  "0164 与 0165 各自只有一个自包含 RST，每题十语言代码全部内联",
  "完成后 PROGRESS 退出质量返工、解除 0166 暂停，并同步 README、AGENTS、范围索引和知识账本",
  "原子提交后 BATCH_CONTRACT 被替换为新题 0166 的生成合同，而不是保留已消费返工合同",
]
