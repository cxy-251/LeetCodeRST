[contract]
schema_version = 2
batch_id = "generation-0213-0214"
status = "ready"
phase = "generation"
kind = "generation"
scope = [213, 214]
state_source = "state/PROGRESS.toml"
baseline_source = "docs/TUTORIAL_QUALITY_BASELINE.rst"
quality_gate = "docs/AUTOMATION_QUALITY_GATE.rst"
drift_log = "state/DRIFT_LOG.toml"
new_problem_generation_paused = false
completion_count_must_remain_unchanged = false
next_problem_after_batch = 215

[static_review]
solution_code_execution = "forbidden"
solution_code_compilation = "forbidden"
differential_exhaustive_property_and_sanitizer = "forbidden"
example_hand_tracing = "required_per_problem"
language_semantics_review = "required_per_problem"
repository_structure_state_and_git_checks = "allowed"
reporting = "只声明实际完成的静态审查；明确未运行、未编译、未测试和剩余风险。"

[budget]
algorithm_score = 6
target_min = 4
target_max = 6
proof_risk = "high"
language_semantics_risk = "high"
platform_type_risk = "high"
output_volume_risk = "high"
scope_may_shrink = true
scope_reason = "0213 是环形相邻约束 DP，需要首尾互斥拆分、单元素边界和滚动状态证明；0214 是 Hard，需要把最短前置字符转化为最长回文前缀，并完整证明 KMP 拼接、分隔符和十语言字符单位。先完整验收 0213；若继续 0214 会压缩 KMP 证明、字符串构造或 C/Rust/R 资源边界，则提交连续前缀并重建 0214 单题合同。"

[references]
style_baselines = [
  "problems/0001-0100/0050-powx-n.rst",
  "problems/0001-0100/0076-minimum-window-substring.rst",
]
fact_sources = [
  "state/PROGRESS.toml",
  "state/REVIEW_INDEX.toml",
  "state/CONCEPT_LEDGER.toml",
  "docs/FORWARD_RULES_0151_ONWARD.rst",
  "problems/0201-0300/README.rst",
  "problems/0101-0200/0198-house-robber.rst",
  "https://leetcode.com/problems/house-robber-ii/description/",
  "https://leetcode.com/problems/shortest-palindrome/description/",
]
fact_sources_may_provide = [
  "0213 的环形房屋、首尾相邻、不能同时抢相邻房屋和最大金额合同",
  "0214 的只允许在字符串前添加字符、返回最短回文串和小写英文字母合同",
  "已有线性 House Robber 滚动 DP、回文、字符串反转和宽整数术语连续性",
  "当前完成范围、静态审查政策和长期质量控制状态",
]
fact_sources_must_not_provide = [
  "章节结构",
  "证明深度",
  "代码注释密度",
  "静态审查标准",
  "文件组织形式",
]

[problems."0213"]
title = "House Robber II"
difficulty = "Medium"
primary_risks = [
  "房屋形成环，第一间与最后一间也相邻；不能直接把线性 0198 算法应用到整个数组",
  "任一合法方案至少排除首屋或尾屋，因此答案是区间 [0,n-2] 与 [1,n-1] 两个线性子问题最大值；n=1 必须单独处理",
  "线性滚动 DP 的 previous_two/previous_one 必须分别表示处理到前两位置与前一位置的最优值，更新顺序不能覆盖旧状态",
  "金额非负；空数组扩展、两间房、全零、最优只含首屋或尾屋以及两段答案相同都要覆盖",
  "固定宽度语言使用足够宽的累计类型并说明平台返回 int 的约束；R number 与 Julia Int 的适配需核对",
]
minimum_static_review = [
  "人工推演 [2,3,2]、[1,2,3,1]、单元素、两元素、全零、首屋最优和尾屋最优",
  "证明每个环形合法集合必属于至少一个线性区间，两个线性最优解也都满足环形约束",
  "证明滚动线性 DP 的取/不取转移和状态更新顺序，时间 O(n)、核心额外空间 O(1)",
  "逐语言核对区间端点、n=1、宽整数、输入只读和返回类型",
]

[problems."0214"]
title = "Shortest Palindrome"
difficulty = "Hard"
primary_risks = [
  "只能在原字符串前添加字符；最短答案等价于保留最长回文前缀，并把剩余后缀反转后加到前面",
  "使用 KMP 前缀函数处理 s + separator + reverse(s)；separator 必须不在官方字符域，防止匹配跨越边界",
  "最终前缀函数值必须证明等于最长回文前缀长度，不能只给公式或把任意前后缀相等误称为回文",
  "空串、单字符、已是回文、无长度大于一的回文前缀、重复字符和整个串接近回文要覆盖",
  "官方小写 ASCII 允许按字节/代码单元处理；十语言必须说明 C 字节、Rust/Go bytes、Java/C#/TypeScript UTF-16、Julia codeunits 和 R raw 的适用边界",
  "C 需要安全分配拼接序列、前缀表和答案；长度加法溢出、终止符和失败清理必须完整",
]
minimum_static_review = [
  "人工推演 aacecaaa、abcd、空串、单字符、已回文、重复字符和最长回文前缀为 1 的情况",
  "证明任意前置方案保留的原串前缀必须是回文，选择最长回文前缀产生最少添加字符",
  "证明 KMP 最终 border 对应且仅对应原串回文前缀，分隔符阻止跨区错误匹配",
  "逐语言核对反转范围、分隔符、前缀函数下标、字符单位、结果分配和输入物化成本",
  "复杂度报告 O(n) 时间、O(n) 前缀表与拼接材料、O(answer length) 输出载荷",
]

must_preserve = [
  "0213 的首尾互斥两段拆分、n=1 特判和线性 DP 完整证明",
  "0214 的最长回文前缀转化、KMP border 证明、分隔符和真实字符串资源成本",
  "每题固定十语言完整实现、人工推演、静态语义审查、剩余风险和带答案自检",
]

forbidden = [
  "参考 0212 或其他最近题目的章节结构、证明篇幅或静态审查密度",
  "0213 直接对整个环运行线性 House Robber，或遗漏单元素边界",
  "0213 只说分成两段而不证明所有合法环形方案被覆盖",
  "0214 使用滚动哈希却声称无碰撞确定正确，或只枚举前缀导致二次复杂度而不说明",
  "0214 在 KMP 拼接中省略安全分隔符，或不证明最终 border 与回文前缀等价",
  "把官方 ASCII 适配结论无条件推广到任意 Unicode",
  "拆分为 inc 或 include",
  "运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码",
  "把静态审查写成测试、编译或运行通过",
]

completion_checks = [
  "逐题对照 0050 的状态/数值边界和 0076 的最优性/字符串资源深度",
  "每题完成后立即执行质量门；0214 出现压缩迹象时按合同缩批",
  "命中 DRIFT_LOG 的拆分、摘要、最近样本、预算和验证策略回归检查均通过",
  "每道算法题只有一个自包含 RST，十语言代码全部内联并位于 problems/0201-0300",
  "完成范围、completed_count、next_problem、根 README、范围索引和知识账本同步",
  "提交后 BATCH_CONTRACT 被替换为下一批合同",
]
