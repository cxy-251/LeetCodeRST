[policy]
canonical_range_size = 50
active_range = "0201-0250"
archive_dependency_allowed = false
archive_rule = "archive 只保存迁移前原件与追溯证据；有效数据只能来自 records 指向的活动文件及其 state/concepts/ranges 活动分片。"
append_rule = "新题更新所属范围 manifest、problem index 与完整知识状态分片；禁止创建只含 concept ID 而没有状态定义的权威账本。"

[resolution]
statement = "按 records 顺序读取。range_manifest_v1 再按 shards 顺序合并活动分片中的 updates、concepts、problems 与 skipped；后出现的同名键覆盖更早值。"
legacy_metadata = "活动分片中的旧 meta、inherits、batch 和 resolution 仅保留来源信息，不参与当前路径解析。"
