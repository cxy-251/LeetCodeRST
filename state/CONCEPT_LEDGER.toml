[meta]
version = 64
last_problem = 218
format = "fifty_problem_ranges"
segment_size = 50

[records]
range_0001_0050 = "state/concepts/0001-0050.toml"
range_0051_0100 = "state/concepts/0051-0100.toml"
range_0101_0150 = "state/concepts/0101-0150.toml"
range_0151_0200 = "state/concepts/0151-0200.toml"
range_0201_0250 = "state/concepts/0201-0250.toml"

[policy]
canonical_range_size = 50
active_range = "0201-0250"
append_rule = "新题只更新所属 50 题范围文件；禁止创建单题或小批次 concept TOML。"
archive_rule = "迁移前分片移入 archive/state/concepts/pre-consolidation，正式解析只从 records 中的范围文件开始。"
migration_rule = "历史架构不统一时使用固定 SHA 的有序归档叠加，禁止机械扁平化造成同名键覆盖或信息丢失。"

[resolution]
statement = "按 records 声明顺序读取；每个范围文件再按自身 resolution 解析。后续范围中的同名知识状态覆盖更早范围。"
