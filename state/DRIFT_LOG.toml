[policy]
schema_version = 1
purpose = "记录已经发生的质量漂移、可能原因、永久控制和回归检查，防止新对话重复犯错。"
use = "每批开始读取；命中当前题或工作流的 incident 时执行 regression_checks。"
maintenance = "只记录有仓库证据的通用漂移；单题错误仍进入题目修复或 active correction。"

[[incident]]
id = "single-rst-split-0129-0165"
status = "controlled"
range = "0129-0165"
problem = "一个公开题被拆成多个 .inc 文件，再通过 .. include:: 组装。"
likely_cause = "模型把降低单文件写入压力和工程化拆分误当成可维护性优化。"
permanent_controls = [
  "一个公开题只允许一个自包含 RST",
  "十语言代码与全部正文直接内联",
  "禁止题目 .inc、代码分片和 include 指令",
]
regression_checks = [
  "搜索当前题 RST 中的 .. include::，结果必须为零",
  "搜索当前题号和 slug 对应的 .inc 或正文分片，结果必须为零",
  "确认代码块数量与当前题所需语言范围一致",
]

[[incident]]
id = "summary-skeleton-0127-0165"
status = "controlled"
range = "0127,0129-0165"
problem = "题解退化为算法摘要、简短正确性、复杂度和十语言代码集合。"
likely_cause = "批次后半部分为了控制输出体积，逐步删除例子、抽象、证明义务、语言差异和答案要点。"
permanent_controls = [
  "执行冻结质量基线",
  "批次合同列出 must_preserve 和风险",
  "高风险叠加时允许缩批，禁止压缩题解",
  "内容质量未通过时保留 needs_revision",
]
regression_checks = [
  "存在精确契约、自建示例、问题抽象和解法选择",
  "状态和不变量可逐项映射到代码",
  "证明覆盖当前题真正需要的合法性、完整性、最优性或终止性",
  "复杂度包含语言适配和输出成本",
  "自检问题带有答案要点",
]

[[incident]]
id = "recent-output-style-contamination"
status = "controlled"
range = "cross-conversation"
problem = "下一对话把最近生成题目同时当作状态来源和格式样本，导致错误结构递归复制。"
likely_cause = "事实连续性与格式示范权没有分离。"
permanent_controls = [
  "格式与解释深度只来自 TUTORIAL_QUALITY_BASELINE",
  "当前批次只使用 BATCH_CONTRACT 中声明的 style_baselines",
  "最近题目只作为合同声明的 fact_sources",
  "新完成题目不会自动升级为黄金样本",
]
regression_checks = [
  "批次合同分别声明 style_baselines 和 fact_sources",
  "新题结构没有以最近题目为唯一依据",
  "最终报告说明使用了哪些黄金题及其角色",
]

[[incident]]
id = "difficulty-score-only-batching"
status = "controlled"
range = "cross-conversation"
problem = "Easy/Medium/Hard 分数无法反映证明、十语言语义和输出体积，批次后半部分更容易降质。"
likely_cause = "单批预算只有算法难度，没有风险维度和缩批规则。"
permanent_controls = [
  "批次合同增加 proof、language_semantics、platform_type 和 output_volume 风险",
  "两个以上高风险维度允许缩批",
  "质量优先于 4-6 分目标",
]
regression_checks = [
  "合同包含四个风险维度",
  "高风险题明确列出最小静态审查",
  "未通过压缩证明、注释或语言说明维持原批次范围",
]

[[incident]]
id = "validation-policy-split-brain"
status = "controlled"
range = "cross-conversation"
problem = "现行规则已经禁止执行题解代码，但知识账本仍保留运行、编译或对拍作为活动工作流，形成互相冲突的完成标准。"
likely_cause = "验证策略修改时只更新了前向规则和质量门，没有同步清理活动状态链中的旧工作流键与说明。"
permanent_controls = [
  "题解统一执行人工示例推演与逐语言静态审查，不运行、不编译、不对拍",
  "PROGRESS、批次合同、质量门和知识账本使用同一静态审查口径",
  "历史运行事实必须明确标注为历史，不构成当前或后续批次许可",
]
regression_checks = [
  "活动状态中不存在 workflow.targeted_example_validation 键",
  "活动规则不存在允许运行、编译、对拍、穷举、属性测试或 sanitizer 题解代码的条款",
  "题解静态审查记录明确未运行、未编译和剩余风险",
]

[[incident]]
id = "concept-ledger-representation-split-brain"
status = "controlled"
range = "cross-conversation"
problem = "知识账本多次在单题分片、manifest/shard 与五十题平面文件之间迁移，最终活动索引已切换为平面文件，但 schema、README 和 PROGRESS 仍描述旧 manifest/shard，下一对话无法确定写入模型。"
likely_cause = "表示方式迁移被拆成多个中间提交，最后只修复部分活动数据，没有在同一提交核对所有权威入口与永久文档。"
permanent_controls = [
  "活动知识账本只采用 state/CONCEPT_LEDGER.toml 声明的一种表示方式",
  "当前每五十题只有一个 concept_state_v1 平面文件，后续范围沿用同一模式",
  "强化既有知识沿用稳定 concept ID，在当前范围写入完整覆盖状态，不新造近义 ID",
  "任何表示迁移必须原子同步总入口、活动数据、schema、README、PROGRESS 和漂移记录",
]
regression_checks = [
  "全部活动 TOML 可解析，CONCEPT_LEDGER records 与 schemas 一一对应且只指向 state/concepts 下的活动文件",
  "PROGRESS、README 与 CONCEPT_LEDGER 对活动存储模型的描述一致",
  "正常读取不依赖 archive，活动目录不存在 manifest、catalog、shard 或单题小批账本",
  "当前题强化旧知识时搜索近义 ID，并优先合并到较早的稳定 ID",
]
