[corrections.julia_unitrange]
status = "active"
source = "https://docs.julialang.org/en/v1/base/collections/#Base.UnitRange"
supersedes = "Earlier review notes claiming Julia a:b automatically descends when a>b."
statement = "Julia a:b is a UnitRange with implicit step +1; it is empty when a>b. Descending iteration requires an explicit negative step such as n:-1:1."

[corrections.historical_fix_scope]
status = "active"
supersedes = "Earlier public policies that required automatic repair of every deterministic issue found during review."
statement = "Review findings are applied prospectively. A historical problem is modified only when the user explicitly selects that problem for repair."

[corrections.execution_workflow]
status = "active"
supersedes = "Earlier scheduled automation, fixed automation branches, temporary connector branches, and default pull-request workflow."
statement = "Generation, review, repair, consolidation, and archival are triggered by an explicit user message and enter main as one atomic commit. Branches, pull requests, upload branches, and temporary materialization workflows are forbidden."

[corrections.r_recursive_closure_subassignment]
status = "active"
source = "https://cran.r-project.org/doc/manuals/r-release/R-lang.html"
supersedes = "0051 text claiming recursive calls share and restore ordinary local vector subassignments through the closure."
statement = "In R, x[i] <- value is complex assignment that rebinds x in the current evaluation frame. A recursive call uses the function's lexical enclosure, not its caller frame, so parent-call local mutations are not inherited. Shared recursive state requires explicit parameters, an environment, or audited superassignment."

[corrections.r_seq_int_direction]
status = "active"
source = "https://stat.ethz.ch/R-manual/R-devel/library/base/html/seq.html"
supersedes = "0054 static-review claim that its R reverse ranges are safe for all single-row and single-column boundaries."
statement = "R seq.int(from,to,by) errors when to-from and by have opposite signs. Before constructing a descending sequence, code must prove from>=to; C-style loop conditions cannot be assumed to produce an empty R sequence."

[corrections.julia_codeunits_wrapper]
status = "active"
source = "https://docs.julialang.org/en/v1/base/strings/#Base.codeunits"
supersedes = "0065 complexity text grouping Julia codeunits with R utf8ToInt as O(n) auxiliary materialization."
statement = "Julia codeunits(s) returns a CodeUnits wrapper over the string's code units rather than materializing an O(n) copy. The Julia adapter uses O(1) auxiliary wrapper and scan state; R utf8ToInt(s) still materializes an O(n) integer vector."

[corrections.r_simplify_path_repeated_vector_rebuild]
status = "active"
sources = [
  "https://stat.ethz.ch/R-manual/R-devel/library/base/html/c.html",
  "https://stat.ethz.ch/R-manual/R-devel/library/base/html/Extract.html",
]
supersedes = "0071 complexity text applying the generic O(n) component-stack time bound to the R adapter."
statement = "The R adapter repeatedly rebuilds the character stack with c(stack, segment) and negative subsetting. With many short components, cumulative copied vector elements are Theta(k^2), so its worst-case time and cumulative allocation are quadratic even though peak stack size is linear."

[corrections.edit_distance_adapter_materialization]
status = "active"
sources = [
  "https://docs.julialang.org/en/v1/base/collections/#Base.collect",
  "https://stat.ethz.ch/R-manual/R-devel/library/base/html/utf8Conversion.html",
]
supersedes = "0072 complexity text presenting O(min(m,n)) as the complete auxiliary-space bound for all ten adapters."
statement = "O(min(m,n)) describes the rolling DP array. C++ copies both by-value strings, Julia collect(codeunits(...)) materializes two byte arrays, and R utf8ToInt materializes two integer vectors; these adapters have O(m+n) extra and peak space."

[corrections.go_min_window_substring_storage]
status = "active"
source = "https://pkg.go.dev/strings#Clone"
supersedes = "0076 text stating that every adapter copies answer_length characters and returns a separately allocated substring."
statement = "The Go expression s[start:end] may share the original string's backing storage and retain the full source. strings.Clone, available since Go 1.18, is the API that guarantees a fresh allocation when that contract is required."

[corrections.r_min_window_input_materialization]
status = "active"
source = "https://stat.ethz.ch/R-manual/R-devel/library/base/html/rawConversion.html"
supersedes = "0076 complexity text presenting the fixed 128-entry frequency table as the complete extra-space bound for the R adapter."
statement = "The R adapter materializes charToRaw results for both s and t and then integer vectors. Its sliding-window state is O(1), while adapter extra and peak space are O(|s|+|t|), excluding the returned answer."

[corrections.julia_merge_sorted_mutation_visibility]
status = "active"
sources = [
  "https://docs.julialang.org/en/v1/manual/functions/#Argument-Passing-Behavior",
  "https://cran.r-project.org/doc/manuals/r-release/R-lang.html#Argument-evaluation",
]
supersedes = "0088 text grouping Julia and R together as adapters that return the modified vector because the call boundary may have copy semantics."
statement = "Julia arguments use pass-by-sharing: mutating a Vector inside merge_sorted! is visible to the caller, and returning nums1 is an API convenience. R supplied arguments behave as local call-by-value bindings, so returning the updated vector is the portable adapter contract."

[corrections.gray_code_zero_dimension_extension]
status = "active"
supersedes = "0089 text claiming n=0 naturally satisfies the same cyclic Gray-code contract by returning [0]."
statement = "The official domain is n>=1. The formula returns [0] for n=0, but first XOR last is 0 rather than a one-bit mask. Supporting n=0 requires an explicit zero-dimensional degenerate convention instead of claiming the literal cyclic adjacency condition unchanged."

[corrections.r_unique_bst_constructor_name]
status = "active"
supersedes = "0095 R adapter calling tree_node(...) while claiming reuse of the 0094 R tree-node model."
statement = "0094 defines the R constructor as new_tree_node(val, left, right), while 0095 calls tree_node(...) and defines no such alias. The adapter fails with an unresolved function unless an undeclared external helper exists; use new_tree_node or define the exact constructor locally."

[corrections.interleaving_string_adapter_materialization]
status = "active"
supersedes = "0097 complexity text presenting O(min(m,n)) as the complete auxiliary-space bound for every language implementation."
statement = "O(min(m,n)) describes only the rolling Boolean DP array. The C++ signature copies s1, s2, and s3 by value for O(m+n+|s3|) extra and peak space; Julia materializes O(m+n) source byte arrays with collect(codeunits(...)); R materializes O(m+n+|s3|) integer vectors with utf8ToInt."

