"algorithm.reorder_list_split_reverse_merge" = "kind=algorithm; introduced=0143; last=0143; occurrences=1; teaching_state=explained; note=按 ceil(m/2) 与 floor(m/2) 切成两条终止链，反转后半段，再从前半段与逆序段各取一节点交织成首尾顺序。"
"proof.reorder_split_length" = "kind=proof; introduced=0143; last=0143; occurrences=1; teaching_state=explained; note=slow=head、fast=head.next 时，偶数 2q 停在 L(q-1)，奇数 2q+1 停在 L(q)；断开 slow.next 后两段长度正确且互不相交。"
"proof.reorder_node_partition_preservation" = "kind=proof; introduced=0143; last=0143; occurrences=1; teaching_state=explained; note=反转把已处理逆序链与未处理原序链维持为第二段分区；合并每轮消费 Fi、Ri，最终每个原节点恰好一次且尾 next 为空，因此无环。"
"ownership.in_place_link_rewiring" = "kind=ownership; introduced=0114; last=0143; occurrences=2; teaching_state=reinforced; note=修改 next 前保存两段后继，切分时清除跨段旧边；十语言都只移动或引用原节点，不交换 val 或创建替代链。"
"ownership.rust_box_take_tail_slot" = "kind=ownership; introduced=0143; last=0143; occurrences=1; teaching_state=explained; note=Rust 对 Option<Box<ListNode>> 先按长度取得可变链接槽位并 take 断链，再移动原 Box 到结果尾槽位；无 Rc、unsafe、载荷克隆或线性辅助数组。"
