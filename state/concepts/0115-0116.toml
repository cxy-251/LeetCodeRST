[concepts]
"algorithm.distinct_subsequence_prefix_count_dp" = "kind=algorithm; introduced=0115; last=0115; occurrences=1; teaching_state=explained; note=count(i,j) 统计来源前 i 个字符形成目标前 j 个字符的方案数，按跳过当前来源字符与匹配后使用当前字符两类相加。"
"proof.distinct_subsequence_last_source_partition" = "kind=proof; introduced=0115; last=0115; occurrences=1; teaching_state=explained; note=任意方案按是否包含当前来源下标划分为两个互斥集合，覆盖全部方案且不会重复。"
"pattern.one_row_count_dp_reverse_update" = "kind=pattern; introduced=0115; last=0115; occurrences=1; teaching_state=explained; note=一行计数 DP 从目标末尾向前更新，保证 dp[j-1] 仍是上一来源前缀状态，避免同一来源字符在一轮中重复使用。"
"numeric.monotone_saturation_bounded_answer" = "kind=numeric; introduced=0115; last=0115; occurrences=1; teaching_state=explained; note=所有状态只做非负加法时可保存 min(exact,2^31)；最终答案保证小于饱和值，因此最终结果仍精确且固定宽中间计数不会溢出。"
"language.r_ascii_raw_materialization" = "kind=language_boundary; introduced=0115; last=0115; occurrences=1; teaching_state=explained; note=R charToRaw 为两个 ASCII 输入物化 O(n+m) 原始字节，必须与 O(m) DP 状态分开计入适配器和峰值空间。"
"interface.perfect_binary_tree_next_node" = "kind=interface; introduced=0116; last=0116; occurrences=1; teaching_state=explained; note=Node 在 val、left、right 外新增 next；算法复用原节点，只重写 next，不改变左右拓扑和节点身份。"
"algorithm.perfect_tree_next_chain_constant_space" = "kind=algorithm; introduced=0116; last=0116; occurrences=1; teaching_state=explained; note=外层沿最左节点下降，内层复用当前层已建立的 next 链，分别连接 left->right 与 right->next_parent.left。"
"proof.perfect_tree_two_edge_connections" = "kind=proof; introduced=0116; last=0116; occurrences=1; teaching_state=explained; note=完美树下一层的全部相邻关系由同父边和跨父边交替组成；按层归纳可证明下一层完整且最右节点以空值结束。"
"interface.in_place_next_pointer_mutation" = "kind=interface; introduced=0116; last=0116; occurrences=1; teaching_state=explained; note=公共接口返回原根引用，调用后 next 字段对调用者可见；算法不创建替代树，也不修改 left、right 或 val。"
"rust.refcell_level_chain_rewire" = "kind=language_boundary; introduced=0116; last=0116; occurrences=1; teaching_state=explained; note=Rust 先在短作用域读取 left、right、parent_next 的 Rc 句柄，结束父节点借用后再可变写入孩子 next，避免 RefCell 借用冲突。"
