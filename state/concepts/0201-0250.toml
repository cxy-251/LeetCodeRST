[meta]
version = 3
schema = "range_manifest_v1"
range = "0201-0250"
first_problem = 201
last_problem = 218
inherits = "state/concepts/0151-0200.toml"
storage = "fifty_problem_range"
open_range = true
active_data_complete = true
archive_dependency = false

[policy]
append_rule = "0201–0250 的后续题先更新本范围 problem index，并把完整知识状态写入新的活动数据分片；禁止把 archive 作为有效数据源。"

[resolution]
mode = "ordered_active_shards"
statement = "legacy_state_data 的 updates 值按完整 concept 状态读取；legacy_problem_record 的题号表和 updates 只作来源记录；normalized_concept_state 提供 0213–0218 的规范 concept 状态。problem_index 只提供题目到 concept ID 的辅助映射。"
problem_index = "state/concepts/ranges/0201-0250/problems.toml"

[[shards]]
path = "state/concepts/ranges/0201-0250/0201-0203.toml"
role = "legacy_state_data"
[[shards]]
path = "state/concepts/ranges/0201-0250/0204.toml"
role = "legacy_state_data"
[[shards]]
path = "state/concepts/ranges/0201-0250/0205-0206.toml"
role = "legacy_state_data"
[[shards]]
path = "state/concepts/ranges/0201-0250/0207.toml"
role = "legacy_state_data"
[[shards]]
