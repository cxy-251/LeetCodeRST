"algorithm.linked_list_bottom_up_merge_sort" = "kind=algorithm; introduced=0148; last=0148; occurrences=1; teaching_state=explained; note=先计数，再按 width=1,2,4 逐轮切出相邻有序 runs 并稳定合并；非递归实现 O(n log n) 时间与 O(1) 核心工作空间。"
"invariant.stable_merge_left_on_equal" = "kind=invariant; introduced=0148; last=0148; occurrences=1; teaching_state=explained; note=两条 run 内部稳定有序；首值相等时优先消费左 run，逐轮归纳保持全链相等节点身份次序。"
"topology.run_split_output_rest_partition" = "kind=topology; introduced=0148; last=0148; occurrences=1; teaching_state=explained; note=split_run 保存 rest 后清空 run 尾边；一轮中已输出、左右未消费 run 与 rest 两两不交并精确覆盖全部原节点。"
"ownership.relink_existing_list_nodes" = "kind=ownership; introduced=0148; last=0148; occurrences=1; teaching_state=reinforcing; note=每轮每个原节点恰好进入一条输入 run 和一条输出 run；只改 next，固定 dummy 不进入结果，无复制、遗漏、重复或环。"
"complexity.bottom_up_list_merge_passes" = "kind=complexity; introduced=0148; last=0148; occurrences=1; teaching_state=explained; note=每轮切分与合并各线性覆盖节点，width 翻倍产生 ceil(log2 n) 轮；直接交付真实尾避免合并后重复找尾。"
"adapter.rust_box_list_split_merge" = "kind=language_adapter; introduced=0148; last=0148; occurrences=1; teaching_state=explained; note=Rust 用 source.take 和 tail.next.take 切出独占 Box runs，消费节点后经 Option 空尾槽拼回；无 unsafe、Rc、clone、递归或 dummy Box。"
