"algorithm.merge_sorted_array_reverse_two_pointers" = "kind=algorithm; introduced=0088; last=0088; occurrences=1; teaching_state=explained; note=从两个有效前缀末端比较较大值并写入 nums1 最右空位，利用预留容量完成原地合并。"
"proof.merge_sorted_array_unread_prefix_safety" = "kind=proof; introduced=0088; last=0088; occurrences=1; teaching_state=explained; note=second>=0 时 write=first+second+1>first，任何写入都位于 nums1 未读前缀之后。"
"proof.merge_sorted_array_second_exhaustion_stop" = "kind=proof; introduced=0088; last=0088; occurrences=1; teaching_state=explained; note=nums2 耗尽后，nums1 剩余有序前缀已处于最终位置且不大于已完成后缀，无需继续搬运。"
"interface.merge_sorted_array_copy_return" = "kind=language_boundary; introduced=0088; last=0088; occurrences=1; teaching_state=explained; note=Julia 与 R 适配器返回修改后的 nums1；循环仍使用常数指针状态，调用边界可能发生复制。"
