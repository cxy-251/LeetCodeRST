"numeric.maximal_rectangle_area_bound" = "kind=numeric; introduced=0085; last=0085; occurrences=1; teaching_state=explained; note=rows,columns<=200，最大面积<=40000，适合 32 位有符号返回值。"
"algorithm.partition_list_two_stable_chains" = "kind=algorithm; introduced=0086; last=0086; occurrences=1; teaching_state=explained; note=按原扫描顺序把节点尾插到 <x 与 >=x 两条链，最后把前链尾连接到后链头。"
"proof.partition_list_stable_order" = "kind=proof; introduced=0086; last=0086; occurrences=1; teaching_state=explained; note=两条分区链都只尾插，同一分区内先扫描到的节点始终位于后扫描节点之前。"
