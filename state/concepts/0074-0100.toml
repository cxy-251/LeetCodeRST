[concepts]
"algorithm.matrix_flattened_binary_search" = "kind=algorithm; introduced=0074; last=0074; occurrences=1; teaching_state=explained; note=把规则矩阵按行视为长度 m*n 的虚拟有序数组，用 mid/cols 与 mid%cols 读取坐标。"
"proof.matrix_row_major_global_order" = "kind=proof; introduced=0074; last=0074; occurrences=1; teaching_state=explained; note=行内有序加下一行首元素严格大于上一行末元素，保证任意相邻扁平位置有序。"
"numeric.matrix_flattened_index_bound" = "kind=numeric; introduced=0074; last=0074; occurrences=1; teaching_state=explained; note=m,n<=100 给出 m*n<=10000，扁平下标、乘积和坐标换算在 32 位有符号整数内安全。"
"algorithm.dutch_national_flag_partition" = "kind=algorithm; introduced=0075; last=0075; occurrences=1; teaching_state=explained; note=维护 0 区、1 区、未知区和 2 区，一次扫描完成三值原地排序。"
"proof.dutch_flag_region_invariant" = "kind=proof; introduced=0075; last=0075; occurrences=1; teaching_state=explained; note=[0,low) 为 0、[low,current) 为 1、[current,high] 未知、(high,n) 为 2，未知区每轮严格缩短。"
"proof.dutch_flag_swap_recheck" = "kind=proof; introduced=0075; last=0075; occurrences=1; teaching_state=explained; note=从 high 换入 current 的值尚未分类，所以处理 2 后只移动 high；从 low 换入的是已确认的 1，可与 current 同时推进。"
"interface.r_sort_colors_copy_return" = "kind=language_boundary; introduced=0075; last=0075; occurrences=1; teaching_state=explained; note=R 适配器返回修改后的向量；循环状态仍为常数空间，调用接口可能触发复制。"
"algorithm.minimum_window_deficit_sliding_window" = "kind=algorithm; introduced=0076; last=0076; occurrences=1; teaching_state=explained; note=need 保存目标频次减窗口频次，missing 保存全部正缺口，右扩左缩寻找最短覆盖窗口。"
"proof.minimum_window_deficit_invariant" = "kind=proof; introduced=0076; last=0076; occurrences=1; teaching_state=explained; note=字符进入和离开只更新对应差值；missing 始终等于所有 max(need[c],0) 之和。"
"proof.minimum_window_contraction_optimality" = "kind=proof; introduced=0076; last=0076; occurrences=1; teaching_state=explained; note=固定右端下持续收缩会检查全部合法左边界，最后一个合法边界给出该右端最短窗口。"
"numeric.minimum_window_ascii_frequency_bound" = "kind=numeric; introduced=0076; last=0076; occurrences=1; teaching_state=explained; note=字符域为 52 个 ASCII 英文字母，128 项频次数组足够；缺口绝对值不超过字符串长度 100000。"
"algorithm.combinations_pruned_backtracking" = "kind=algorithm; introduced=0077; last=0077; occurrences=1; teaching_state=explained; note=严格递增路径从 start 选下一项，并用 n-needed+1 限制每层最大候选。"
"proof.combination_increasing_path_bijection" = "kind=proof; introduced=0077; last=0077; occurrences=1; teaching_state=explained; note=每个 k 元集合只有一个严格递增排列，递归路径与合法组合形成一一对应。"
"proof.combination_last_start_pruning" = "kind=proof; introduced=0077; last=0077; occurrences=1; teaching_state=explained; note=选择 value 后可用数字数量为 n-value+1；少于 needed 时不可能填满路径。"
"complexity.combination_output_size" = "kind=complexity; introduced=0077; last=0077; occurrences=1; teaching_state=explained; note=C(n,k) 个答案各复制 k 个整数，时间和返回空间均由 Theta(C(n,k)*k) 主导。"
"c.transactional_combination_result" = "kind=language_boundary; introduced=0077; last=0077; occurrences=1; teaching_state=explained; note=C 预先计算组合数容量，为每个叶子分配独立行；任一失败时释放全部已完成行与元数据。"
"algorithm.subsets_node_snapshot_backtracking" = "kind=algorithm; introduced=0078; last=0078; occurrences=1; teaching_state=explained; note=任意长度路径都是合法子集，每个递归节点先复制路径，再枚举更大输入下标扩展。"
"proof.subset_increasing_index_bijection" = "kind=proof; introduced=0078; last=0078; occurrences=1; teaching_state=explained; note=每个子集与唯一严格递增输入下标序列一一对应，保证完整且无重复。"
"complexity.subset_total_payload" = "kind=complexity; introduced=0078; last=0078; occurrences=1; teaching_state=explained; note=2^n 个子集中每个元素出现一半，全部结果复制 n*2^(n-1) 个整数。"
"algorithm.word_search_in_place_marking" = "kind=algorithm; introduced=0079; last=0079; occurrences=1; teaching_state=explained; note=匹配当前格后写入输入域外哨兵，搜索四邻并恢复字符，以常数标记空间禁止同一路径复用格子。"
"proof.word_search_restore_on_success" = "kind=proof; introduced=0079; last=0079; occurrences=1; teaching_state=explained; note=四方向结果先汇总到 found，再统一恢复原字符，短路成功也不污染矩阵。"
"complexity.word_search_three_way_branch_bound" = "kind=complexity; introduced=0079; last=0079; occurrences=1; teaching_state=explained; note=每个起点首步最多四向，后续不能返回已标记前一格，最坏上界写为 O(mn*3^L)。"
"algorithm.sorted_array_keep_at_most_two" = "kind=algorithm; introduced=0080; last=0080; occurrences=1; teaching_state=explained; note=write<2 时保留，否则仅在当前值不同于有效前缀倒数第二项时写入。"
"proof.sorted_array_second_last_witness" = "kind=proof; introduced=0080; last=0080; occurrences=1; teaching_state=explained; note=有序前缀中倒数第二项等于当前值时，末尾两项都等于当前值，当前副本必须跳过。"
"interface.valid_prefix_result_contract" = "kind=interface; introduced=0080; last=0080; occurrences=1; teaching_state=explained; note=返回长度 k 与 nums[0:k] 共同定义结果，k 之后内容未定义且无需整理。"
"interface.r_valid_prefix_copy_return" = "kind=language_boundary; introduced=0080; last=0080; occurrences=1; teaching_state=explained; note=R 返回 k 与修改后的向量；调用者只读取 seq_len(k) 对应的有效前缀。"
