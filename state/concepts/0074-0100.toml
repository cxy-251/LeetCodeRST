"proof.maximal_rectangle_bottom_row_reduction" = "kind=proof; introduced=0085; last=0085; occurrences=1; teaching_state=explained; note=每个合法全一矩形有唯一底边行，并在该行对应一个连续柱区间，因此会被柱状图算法覆盖。"
