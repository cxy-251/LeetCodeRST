"algorithm.floyd_cycle_entry_recovery" = "kind=algorithm; introduced=0142; last=0142; occurrences=1; teaching_state=explained; note=第一阶段保留环内身份相遇点；seeker 回到 head 后与 slow 同步一步，至多走尾长 mu 步在原入口对象首次相遇。"
