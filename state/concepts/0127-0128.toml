"algorithm.bfs_delete_on_enqueue" = "kind=algorithm; introduced=0127; last=0127; occurrences=1; teaching_state=explained; note=只求最短距离时，节点首次入队即获得最短距离，可以立即从未访问集合删除，避免同层重复入队。"
