[concepts]
"algorithm.pigeonhole_gap_buckets" = "kind=algorithm; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=以 ceil((high-low)/(n-1)) 作为桶宽，每桶只存实际最小/最大，按桶号扫描相邻非空桶边界。"
"invariant.bucket_internal_gap_bound" = "kind=invariant; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=同桶整数落在宽 w 的半开区间，任意差至多 w-1；最大排序间距至少 w，故目标必跨桶。"
"proof.adjacent_nonempty_bucket_sorted_neighbors" = "kind=proof; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=相邻非空桶之间没有输入值，前桶最大值与后桶最小值因此在全局排序序列中真正相邻。"
"complexity.bucket_count_bounded_by_input" = "kind=complexity; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=w>=R/(n-1) 推出 floor(R/w)+1<=n，桶空间随元素数线性而非随 10^9 值域增长。"
"numeric.widened_bucket_arithmetic" = "kind=numeric; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=值域、上取整分子、桶号分子和跨桶差均在运算前提升到 64 位，最终答案不超过 10^9。"
"adapter.c_gap_bucket_allocation_failure" = "kind=language_adapter; introduced=0164; last=0164; occurrences=1; teaching_state=explained; note=C calloc 数量由 B<=n 支撑，成功路径 free；失败只能返回与合法结果不可区分的 0，明确为接口限制。"
