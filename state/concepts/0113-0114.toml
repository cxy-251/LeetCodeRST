[concepts]
"algorithm.path_sum_backtracking_snapshot" = "kind=algorithm; introduced=0113; last=0113; occurrences=1; teaching_state=explained; note=DFS 共享当前根到节点路径，进入时追加、离开时恢复，只在叶节点且剩余目标为零时复制有效前缀。"
"proof.path_sum_snapshot_independence" = "kind=proof; introduced=0113; last=0113; occurrences=1; teaching_state=explained; note=每个答案行由当前工作路径显式复制，后续 push、pop 或兄弟分支覆盖不会修改历史结果。"
"complexity.output_sensitive_path_total" = "kind=complexity; introduced=0113; last=0113; occurrences=1; teaching_state=explained; note=基础遍历 O(n)，复制答案需要 Theta(L)，总时间 O(n+L)，其中 L 是所有返回路径的元素总数。"
"c.transactional_path_matrix_result" = "kind=language_boundary; introduced=0113; last=0113; occurrences=1; teaching_state=explained; note=C 同步维护外层行指针、列长度、工作路径和失败状态；任一扩容或行复制失败时整体清理已保存结果。"
"r.environment_shared_path_buffer" = "kind=language_boundary; introduced=0113; last=0113; occurrences=1; teaching_state=explained; note=R 用显式 environment 保存工作路径与答案，depth 指定有效前缀，避免依赖递归父调用帧的普通局部重绑定。"
"algorithm.flatten_preorder_right_splice" = "kind=algorithm; introduced=0114; last=0114; occurrences=1; teaching_state=explained; note=若 current 有左子树，把原右子树接到左子树沿 right 的最右节点，再把左子树搬到 current.right 并清空 left。"
"proof.flatten_node_identity_topology" = "kind=proof; introduced=0114; last=0114; occurrences=1; teaching_state=explained; note=局部重连只迁移现有边，保持全部节点可达、身份唯一且无环，最终右链等于原树前序。"
"proof.flatten_right_edge_amortization" = "kind=proof; introduced=0114; last=0114; occurrences=1; teaching_state=explained; note=每个节点成为一次 current，左子树右边界搜索中的右边不会再次属于后续同类搜索，总扫描 O(n)。"
"interface.in_place_tree_topology_mutation" = "kind=interface; introduced=0114; last=0114; occurrences=1; teaching_state=explained; note=公共接口不返回新根，复用原节点并改变调用者可观察的左右链接；外部节点引用仍有效但拓扑已变化。"
"rust.refcell_short_borrow_rewire" = "kind=language_boundary; introduced=0114; last=0114; occurrences=1; teaching_state=explained; note=Rust 用短作用域结束 RefCell 借用，take 转移左右子引用，Rc clone 只增加引用计数而不复制树节点。"
