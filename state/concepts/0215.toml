[updates]
"selection.kth_largest_target_index" = "第 k 大在升序数组中的零基下标为 n-k；Julia/R 一基位置为 n-k+1，不能把降序下标 k-1 直接用于升序分区。"
"partition.three_way_quickselect_invariant" = "维护 [left,less)<pivot、[less,scan)==pivot、[scan,greater] 未知、(greater,right]>pivot；大值交换后 scan 不前进。"
"proof.quickselect_target_region_reduction" = "分区后目标只可能位于小值侧、等值段或大值侧；未命中等值段时新区间严格缩小，重复值全部由连续等值段覆盖。"
"complexity.deterministic_pivot_worst_case" = "中点元素作为确定性 pivot 时单轮 O(m)、常见输入通常接近线性，但存在连续极不平衡分区，最坏总时间 O(n^2)，不能声称保证或无条件期望 O(n)。"
"adapter.quickselect_mutation_and_indices" = "C/C++/Python/Java/Go/TypeScript/C#/Julia 原地重排可见输入；Rust 按值拥有 Vec；R 重排本地向量绑定。Rust 使用有符号游标避免右边界下溢。"

[static_review]
manual_cases = ["classic_unique", "classic_duplicates", "all_equal", "ascending", "descending", "k_equals_1", "k_equals_n"]
proof_checks = ["target_n_minus_k", "four_region_invariant", "duplicate_equal_region", "strict_shrink", "termination"]
language_checks = ["swap_semantics", "zero_vs_one_based_target", "input_mutation", "rust_signed_cursor", "deterministic_pivot_complexity"]
