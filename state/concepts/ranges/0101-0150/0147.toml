[concepts]
"algorithm.linked_list_insertion_sorted_prefix" = "kind=algorithm; introduced=0147; last=0147; occurrences=1; teaching_state=explained; note=last_sorted 把整链分成前 k 个原节点的稳定有序前缀和保持原序的未处理后缀；快路径扩边界，搬移路径保持前缀尾不变。"
"invariant.stable_insertion_after_equals" = "kind=invariant; introduced=0147; last=0147; occurrences=1; teaching_state=explained; note=搬移分支先证明 last_sorted.val>current.val，搜索跨过前缀中全部 <= current 的节点并必在 last_sorted 前停止；等值节点按输入次序稳定。"
"topology.insertion_three_link_commit" = "kind=topology; introduced=0147; last=0147; occurrences=1; teaching_state=explained; note=依次让 last_sorted 绕过 current、让 current 指向插入点旧后继、再由 position 接入 current；该顺序保存后缀并防止回环。"
"complexity.linked_insertion_input_shape" = "kind=complexity; introduced=0147; last=0147; occurrences=1; teaching_state=explained; note=普通优化版本的非递减输入走 O(n) 快路径，严格递减输入也为 O(n) 头插；交错上升且反复近尾插入可使搜索累计 Theta(n^2)。"
"adapter.rust_ownership_returning_list_insert" = "kind=language_adapter; introduced=0147; last=0147; occurrences=1; teaching_state=explained; note=Rust 逐个 take 原 Box 节点并稳定插入独立 sorted 所有权链，无 unsafe、克隆或递归；其非递减输入需反复扫到尾，达到 Theta(n^2)，不能外推普通版快路径。"
