"datastructure.lru_hash_doubly_linked_list" = "kind=data_structure; introduced=0146; last=0146; occurrences=1; teaching_state=explained; note=哈希表按键定位唯一节点，双向链表把当前对象历史压缩为 MRU 到 LRU 全序；已知节点摘除、头插和选尾均只改常数条边。"
"invariant.lru_map_list_bijection" = "kind=invariant; introduced=0146; last=0146; occurrences=1; teaching_state=explained; note=映射键集合、真实链表节点键集合与 size 三者一致；移动不改双射，新增同时加一，满容淘汰必须先按 victim 旧键删除再登记新键。"
"invariant.lru_sentinel_topology" = "kind=invariant; introduced=0146; last=0146; occurrences=1; teaching_state=explained; note=永久 head/tail 哨兵不入映射且不被淘汰；相邻正反链接一致，空表哨兵直接相邻，非空首尾节点分别连接 head/tail。"
"resource.c_lru_preallocated_node_pool" = "kind=resource; introduced=0146; last=0146; occurrences=1; teaching_state=explained; note=C 构造器事务式分配对象、O(capacity) 桶数组和固定节点池；成功后 put 不再分配，满容复用 victim，free 释放三个外层块。"
"adapter.rust_lru_stable_index_pool" = "kind=language_adapter; introduced=0146; last=0146; occurrences=1; teaching_state=explained; note=Rust HashMap 保存 key 到 usize，Vec 槽保存前后 Option 索引；预留 capacity 后只追加未用槽或复用 LRU 槽，无 unsafe、自引用或悬空地址。"
"adapter.r_environment_cache_nodes" = "kind=language_adapter; introduced=0146; last=0146; occurrences=1; teaching_state=explained; note=R 用 environment 表达缓存、可变双向节点和哈希映射；整数键显式字符编码，查找禁用继承，victim 改键前删除旧环境名。"
