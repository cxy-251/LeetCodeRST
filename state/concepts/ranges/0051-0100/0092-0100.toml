[concepts]
"algorithm.linked_list_interval_head_insertion" = "kind=algorithm; introduced=0092; last=0092; occurrences=1; teaching_state=explained; note=找到区间前驱后固定原区间首节点，每轮摘除其后继并插到区间头部，执行 right-left 次完成逆序。"
"proof.linked_list_head_insertion_fixed_tail" = "kind=proof; introduced=0092; last=0092; occurrences=1; teaching_state=explained; note=current 始终是已反转前缀尾；第 t 轮后前 t+1 个区间节点恰好逆序，未处理后缀保持原序。"
"proof.linked_list_interval_conservation_no_cycle" = "kind=proof; introduced=0092; last=0092; occurrences=1; teaching_state=explained; note=先让 current 越过 moved，再把 moved 接到反转前缀头；每轮只改三条边，不丢节点、不复制且不形成返回环。"
"rust.owned_list_segment_reverse_reconnect" = "kind=language_boundary; introduced=0092; last=0092; occurrences=1; teaching_state=explained; note=Rust 从可变所有权槽位取出目标区间，逐 Box 反转，找到反转尾后接回 remaining，再把新头移回前驱槽位。"
"algorithm.ipv4_four_segment_backtracking" = "kind=algorithm; introduced=0093; last=0093; occurrences=1; teaching_state=explained; note=递归状态由字符位置和已完成段数定义，每层枚举 1 到 3 个数字并在四段消费完全部字符时提交。"
"proof.ipv4_remaining_length_pruning" = "kind=proof; introduced=0093; last=0093; occurrences=1; teaching_state=explained; note=剩余 k 段至少消费 k 个、最多消费 3k 个字符，超出该闭区间的状态不可能完成。"
"proof.ipv4_monotone_segment_rejection" = "kind=proof; introduced=0093; last=0093; occurrences=1; teaching_state=explained; note=多字符前导零对所有更长段持续非法；十进制值首次超过 255 后继续附加数字也不会恢复合法。"
"complexity.ipv4_fixed_depth_output" = "kind=complexity; introduced=0093; last=0093; occurrences=1; teaching_state=explained; note=有效长度最多 12、段数固定 4、每层最多三选，搜索节点为常数上界；地址构造成本按输出字符总量计。"
"c.transactional_ip_string_results" = "kind=language_boundary; introduced=0093; last=0093; occurrences=1; teaching_state=explained; note=C 由四段长度各三种选择推出 81 个结果槽位上界，每个地址独立分配最多 16 字节；任一失败时释放全部已完成字符串和外层数组。"
"algorithm.binary_tree_inorder_explicit_stack" = "kind=algorithm; introduced=0094; last=0094; occurrences=1; teaching_state=explained; note=沿左链入栈，到空位置后弹出访问根，再把 current 切到右孩子，显式模拟左根右递归控制流。"
"proof.inorder_stack_continuation_invariant" = "kind=proof; introduced=0094; last=0094; occurrences=1; teaching_state=explained; note=栈保存左子树尚未完成返回的祖先续点；左链结束时栈顶左子树已完成，是下一个中序访问节点。"
"complexity.tree_height_stack_space" = "kind=complexity; introduced=0094; last=0094; occurrences=1; teaching_state=explained; note=每个节点入栈出栈各一次，时间 O(n)；栈只保存一条祖先链，空间 O(h)，退化树最坏 O(n)。"
"r.binary_tree_environment_nodes" = "kind=language_boundary; introduced=0094; last=0094; occurrences=1; teaching_state=explained; note=R 用 environment 表达树节点引用语义；显式栈保存环境引用，不复制子树，结果向量扩展可能产生累计复制。"
"algorithm.unique_bst_interval_cartesian_product" = "kind=algorithm; introduced=0095; last=0095; occurrences=1; teaching_state=explained; note=对连续值域枚举根值，递归生成左右区间全部树，再对左右列表执行笛卡尔积。"
"proof.unique_bst_root_partition_bijection" = "kind=proof; introduced=0095; last=0095; occurrences=1; teaching_state=explained; note=每棵 BST 由唯一根值和唯一左右结构对确定；不同根或不同子树对产生不同整树。"
"interface.unique_bst_independent_tree_clones" = "kind=interface; introduced=0095; last=0095; occurrences=1; teaching_state=explained; note=每个组合深复制左右模板，保证不同返回树不共享可变节点；空区间用单个 null 作为组合单位元。"
"complexity.unique_bst_catalan_output" = "kind=complexity; introduced=0095; last=0095; occurrences=1; teaching_state=explained; note=结果有 C_n 棵树、每棵 n 个独立节点，时间和返回空间下界均为 Theta(n*C_n)。"
"c.transactional_tree_forest_construction" = "kind=language_boundary; introduced=0095; last=0095; occurrences=1; teaching_state=explained; note=C 预计算 Catalan 容量，深复制失败时释放当前根、左右模板森林和全部已完成结果。"
"algorithm.unique_bst_catalan_dp" = "kind=algorithm; introduced=0096; last=0096; occurrences=1; teaching_state=explained; note=counts[nodes] 对全部左节点数求 counts[left]*counts[nodes-1-left]，只保留结构数量。"
"proof.unique_bst_count_root_product_sum" = "kind=proof; introduced=0096; last=0096; occurrences=1; teaching_state=explained; note=固定根位置后左右结构独立相乘，不同根位置对应互斥结构集合再求和；counts[0]=1 是空树单位元。"
"numeric.catalan_19_int64_intermediate" = "kind=numeric; introduced=0096; last=0096; occurrences=1; teaching_state=explained; note=C_19=1767263190 适合 32 位返回值，固定宽语言仍使用 64 位 DP 或中间乘法。"
"algorithm.interleaving_string_one_row_dp" = "kind=algorithm; introduced=0097; last=0097; occurrences=1; teaching_state=explained; note=dp[j] 表示两个来源前缀能否形成目标前缀；旧同列表示取 s1，当前左邻表示取 s2。"
"proof.interleaving_left_to_right_overwrite" = "kind=proof; introduced=0097; last=0097; occurrences=1; teaching_state=explained; note=左到右更新时 dp[j] 尚为上一行同列、dp[j-1] 已为当前行左邻，恰好满足二维转移依赖。"
"complexity.interleaving_shorter_column_space" = "kind=complexity; introduced=0097; last=0097; occurrences=1; teaching_state=explained; note=交换两个对称来源使短串作为列，时间 O(mn)，工作空间 O(min(m,n))。"
"c.boolean_allocation_failure_contract" = "kind=language_boundary; introduced=0097; last=0097; occurrences=1; teaching_state=explained; note=C 平台接口只返回 bool，无法区分合法 false 与极端 calloc 失败，适配器在失败时返回 false 并在正文明确。"

"algorithm.validate_bst_inorder_strict_increase" = "kind=algorithm; introduced=0098; last=0098; occurrences=1; teaching_state=explained; note=显式栈中序扫描，每个当前值必须严格大于直接中序前驱。"
"proof.bst_inorder_strict_characterization" = "kind=proof; introduced=0098; last=0099; occurrences=2; teaching_state=reinforced; note=0098 证明 BST 与中序严格递增充要等价；0099 用该性质识别并修复下降。"
"pattern.optional_previous_without_numeric_sentinel" = "kind=pattern; introduced=0098; last=0098; occurrences=1; teaching_state=explained; note=previous 值配合 has_previous 表达可选状态，避免节点值等于整数边界哨兵。"
"algorithm.recover_bst_inversion_endpoints" = "kind=algorithm; introduced=0099; last=0099; occurrences=1; teaching_state=explained; note=第一次下降记录 previous 为 first，每次下降更新 current 为 second，兼容相邻与非相邻交换。"
"proof.recover_bst_one_or_two_descents" = "kind=proof; introduced=0099; last=0099; occurrences=1; teaching_state=explained; note=递增序列交换相邻元素产生一次下降，交换非相邻元素产生两次下降；首左端和末右端正是错误值。"
"proof.recover_bst_structure_preservation" = "kind=proof; introduced=0099; last=0099; occurrences=1; teaching_state=explained; note=错误仅来自值交换；算法只交换两个 val 字段，不修改父子链接或节点身份。"
"algorithm.same_tree_paired_recursion" = "kind=algorithm; introduced=0100; last=0100; occurrences=1; teaching_state=explained; note=成对比较对应位置；双空为真、单空为假，非空时比较值及左右同向子树。"
"proof.same_tree_structural_induction" = "kind=proof; introduced=0100; last=0100; occurrences=1; teaching_state=explained; note=以最大树高归纳，根值相等且左右对应子树分别相同当且仅当整树相同。"
"complexity.same_tree_short_circuit_height" = "kind=complexity; introduced=0100; last=0100; occurrences=1; teaching_state=explained; note=最坏访问全部节点对时间 O(n)，首个差异可短路；调用栈只保存一条路径 O(h)。"
