[meta]
version = 1
range = "0213-0218"
schema = "normalized_concept_state_v1"
source = "legacy per-problem ledgers and canonical tutorial facts"
static_review_only = true

[concepts]
"model.circular_path_to_two_linear_paths" = "kind=model; introduced=0213; last=0213; occurrences=1; teaching_state=explained; note=环上首屋与尾屋互斥；n>=2 时分别排除尾屋和首屋，得到两个普通线性不相邻选择区间，环形最优值等于两者最优值的较大者。"
"proof.circular_first_last_exclusion_cover" = "kind=proof; introduced=0213; last=0213; occurrences=1; teaching_state=explained; note=任意环形合法方案至少不选首屋或不选尾屋，因此被两个线性子问题覆盖；两个子问题各自缺少环的一端，所有候选在原环中仍合法。"
"optimization.longest_palindromic_prefix" = "kind=optimization; introduced=0214; last=0214; occurrences=1; teaching_state=explained; note=只能在前端添加字符时，任意添加 k 个字符的回文结果都会迫使原串前 n-k 个字符成为回文；最大化可保留回文前缀等价于最小化新增字符。"
"proof.prepend_overlap_lower_bound" = "kind=proof; introduced=0214; last=0214; occurrences=1; teaching_state=explained; note=通过结果串镜像位置 k+i 与 n-1-i 的下标关系，直接推出 s[0:n-k] 回文，并得到 k>=n-L 的最优性下界。"
"string.kmp_border_palindrome_equivalence" = "kind=string; introduced=0214; last=0214; occurrences=1; teaching_state=explained; note=在 s + unique_separator + reverse(s) 中，最终 border 长度不超过 n；其前缀是 P，后缀是 reverse(P)，因此 border 与回文前缀双向等价。"
"safety.unique_separator_boundary" = "kind=safety; introduced=0214; last=0214; occurrences=1; teaching_state=explained; note=分隔符必须不属于输入字符域且只出现一次；否则跨边界 border 与长度上界证明失效。"
"adapter.shortest_palindrome_string_materialization" = "kind=language_adapter; introduced=0214; last=0214; occurrences=1; teaching_state=explained; note=C 显式分配序列、size_t 前缀表和答案；Julia codeunits 是视图但拼接与答案物化；R raw、UTF-16 和字节适配只在官方 ASCII 合同下等价。"
"selection.kth_largest_target_index" = "kind=selection; introduced=0215; last=0215; occurrences=1; teaching_state=explained; note=第 k 大在升序数组中的零基下标为 n-k；Julia/R 一基位置为 n-k+1，不能把降序下标 k-1 直接用于升序分区。"
"partition.three_way_quickselect_invariant" = "kind=invariant; introduced=0215; last=0215; occurrences=1; teaching_state=explained; note=维护 [left,less)<pivot、[less,scan)==pivot、[scan,greater] 未知、(greater,right]>pivot；大值交换后 scan 不前进。"
"proof.quickselect_target_region_reduction" = "kind=proof; introduced=0215; last=0215; occurrences=1; teaching_state=explained; note=分区后目标只可能位于小值侧、等值段或大值侧；未命中等值段时新区间严格缩小，重复值全部由连续等值段覆盖。"
"complexity.deterministic_pivot_worst_case" = "kind=complexity; introduced=0215; last=0215; occurrences=1; teaching_state=explained; note=中点元素作为确定性 pivot 时单轮 O(m)、常见输入通常接近线性，但存在连续极不平衡分区，最坏总时间 O(n^2)，不能声称保证或无条件期望 O(n)。"
"adapter.quickselect_mutation_and_indices" = "kind=language_adapter; introduced=0215; last=0215; occurrences=1; teaching_state=explained; note=C/C++/Python/Java/Go/TypeScript/C#/Julia 原地重排可见输入；Rust 按值拥有 Vec；R 重排本地向量绑定。Rust 使用有符号游标避免右边界下溢。"
"backtracking.strictly_increasing_candidate_start" = "kind=algorithm; introduced=0216; last=0216; occurrences=1; teaching_state=explained; note=选择 value 后只从 value+1 继续，使数字不重复，并让每个无序组合只有唯一的递增生成路径。"
"invariant.remaining_slots_and_sum" = "kind=invariant; introduced=0216; last=0216; occurrences=1; teaching_state=explained; note=递归状态保持 len(path)+slots=k 与 sum(path)+remaining=n；slots=0 时只有 remaining=0 才能提交。"
"pruning.minimum_reachable_sum" = "kind=pruning; introduced=0216; last=0216; occurrences=1; teaching_state=explained; note=从 start 起连续选择 slots 个数字给出任何合法补全的可实现下界；remaining 更小时状态无解。"
"pruning.maximum_reachable_sum" = "kind=pruning; introduced=0216; last=0216; occurrences=1; teaching_state=explained; note=候选数量足够时，1..9 中最大的 slots 个数字给出可实现上界；remaining 更大时状态无解。"
"proof.unique_combination_path" = "kind=proof; introduced=0216; last=0216; occurrences=1; teaching_state=explained; note=任意合法组合排序为 c1<...<ck 后，搜索中恰有一条依次选择这些数字的路径；严格递增阻止所有排列重复。"
"adapter.two_dimensional_result_ownership" = "kind=language_adapter; introduced=0216; last=0216; occurrences=1; teaching_state=explained; note=C 显式拥有行指针、列长度和每行快照并在失败时完整清理；托管语言提交时复制路径，Go 必须复制切片底层内容。"
"invariant.seen_prefix_value_set" = "kind=invariant; introduced=0217; last=0217; occurrences=1; teaching_state=explained; note=处理下标 i 前，seen 恰好保存 nums[0:i] 的值集合；命中对应更早同值元素，未命中插入后为下一位置保持不变量。"
"proof.duplicate_second_occurrence" = "kind=proof; introduced=0217; last=0217; occurrences=1; teaching_state=explained; note=选择任一重复值第二次出现的最早位置，该位置查询时更早副本必在集合中；扫描结束未命中则不存在任何 j<i 的同值对。"
"complexity.hash_average_vs_worst" = "kind=complexity; introduced=0217; last=0217; occurrences=1; teaching_state=explained; note=哈希查询和插入只在平均模型下为 O(1)，总平均 O(n)；对抗碰撞、聚簇或实现退化时总最坏可达 O(n^2)，不能写成严格保证线性。"
"adapter.c_open_addressing_occupied_metadata" = "kind=language_adapter; introduced=0217; last=0217; occurrences=1; teaching_state=explained; note=C 线性探测表使用 values 与独立 occupied 数组，容量至少为 2*n 的二次幂，任何 int 包括 0、INT_MIN、INT_MAX 都不与空槽冲突。"
"adapter.c_hash_failure_exact_fallback" = "kind=language_adapter; introduced=0217; last=0217; occurrences=1; teaching_state=explained; note=C 布尔接口没有错误通道；容量溢出或分配失败时释放资源并退回无分配的二次比较，保持答案正确，仅改变失败路径性能。"
"adapter.r_canonical_integer_environment_key" = "kind=language_adapter; introduced=0217; last=0217; occurrences=1; teaching_state=explained; note=R 使用空父环境和 inherits=FALSE，并把精确 32 位整数编码为带前缀的无小数十进制键；零统一规范化，避免父环境命中与格式碰撞。"
"geometry.skyline_half_open_buildings" = "kind=geometry; introduced=0218; last=0218; occurrences=1; teaching_state=explained; note=建筑 [left,right,height] 只在 left<=x<right 时活跃；right==x 必须在读取当前高度前失效。"
"sweep.boundary_coordinate_compression" = "kind=algorithm; introduced=0218; last=0218; occurrences=1; teaching_state=explained; note=高度只可能在左右边界变化；排序去重后每个横坐标整体处理全部开始与结束，避免重复横坐标和中间伪高度。"
"heap.lazy_expiration_by_right_endpoint" = "kind=data_structure; introduced=0218; last=0218; occurrences=1; teaching_state=explained; note=堆保存 height 与 right；过期非顶部元素暂留无害，成为顶部时持续按 right<=x 清理。"
"invariant.active_building_maximum" = "kind=invariant; introduced=0218; last=0218; occurrences=1; teaching_state=explained; note=加入全部 left<=x 建筑并清理过期顶部后，堆顶若存在既活跃又不低于任何活跃建筑，等于当前轮廓高度。"
"output.normalized_skyline_keypoints" = "kind=output_contract; introduced=0218; last=0218; occurrences=1; teaching_state=explained; note=仅在高度变化时追加 [x,height]，保证横坐标严格递增、相邻高度不同，并在最大右边界回到 0。"
"adapter.c_skyline_owned_rows" = "kind=language_adapter; introduced=0218; last=0218; occurrences=1; teaching_state=explained; note=C 显式分配边界、堆、行指针、列长度与每个二元行；失败释放部分资源，成功所有权交给调用方。"
