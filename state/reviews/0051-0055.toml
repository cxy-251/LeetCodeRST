[rules."r_recursive_state_binding"]
status = "promoted"
problems = [51]
requirement = "R 递归若需要共享并撤销可变搜索状态，不得假设普通 x[i] <- value 会修改闭包外层绑定。使用显式参数返回、environment 引用状态或经过审计的 <<-；验证子调用实际观察到父层选择，并重新计算复制成本。"

[rules."runtime_validation_for_language_semantics"]
status = "promoted"
problems = [51, 52, 54]
requirement = "涉及闭包赋值、无符号取负、范围构造、写时复制或平台位运算的语言特定实现，至少执行最小语义烟雾测试；缺少运行时只能标记静态未验证，不能用其他语言通过替代该语义证据。"

[rules."language_specific_mutation_cost"]
status = "promoted"
problems = [51]
requirement = "共享状态修复方案确定后，按实际语言的引用、复制和复杂赋值语义重新计算时间与峰值空间；正确性修复不能沿用原可变数组成本。"

[rules."bitmask_coordinate_frame_and_width"]
status = "promoted"
problems = [52]
requirement = "位掩码递归先定义每一位所在的坐标系和递归层含义，再证明补集、移位方向和边界裁剪；取反或移位后重新与有效位掩码相交，并由输入上界验证 signed、unsigned 与语言位宽。"

[rules."nonempty_optimization_initialization"]
status = "promoted"
problems = [53]
requirement = "非空区间、路径或集合优化必须从首个合法候选初始化，或使用显式不存在状态；不得用不属于候选域的 0、空答案或数值哨兵改变全负等边界。"

[rules."intermediate_candidate_numeric_bound"]
status = "promoted"
problems = [53]
requirement = "数值安全同时覆盖转移中的临时候选、累计状态和最终答案；用候选所代表的真实结构证明上界，而不是只引用最终返回范围。"

[rules."range_constructor_direction_precondition"]
status = "promoted"
problems = [54]
requirement = "在 R seq.int、显式步长范围或会预先验证方向的范围构造器中，先证明起点、终点与步长方向一致；不能依赖 C 风格循环条件把非法范围自动变成零次迭代。"

[rules."interval_prefix_closure_contract"]
status = "promoted"
problems = [55]
requirement = "把图可达集合压缩为连续前缀或区间前，证明每个转移覆盖所有中间端点；若动作只能取固定长度或产生空洞，必须保留离散状态。"

[rules."abstract_endpoint_not_array_index"]
status = "promoted"
problems = [55]
requirement = "覆盖端点、半开边界和插入位置可以位于容器外；只有通过实际下标范围检查后才能读取数组，证明中区分抽象坐标与内存访问。"

