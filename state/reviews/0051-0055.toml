[problems."0051"]
status = "reviewed"
file = "problems/0001-0100/0051-n-queens.rst"
positive = [
  "按行搜索、列与两类对角线占用形成闭合不变量，合法性、完备性、无重复和撤销证明完整。",
  "C 的结果扩容、逐行棋盘分配和失败清理采用整体成功或整体回滚。",
  "搜索状态与叶子棋盘快照分离，复杂度计入 S*n^2 输出载荷。",
]
observations = [
  "R 版本在 dfs 内使用 placement[[row]] <- col、columns[[col]] <- TRUE 等普通复杂赋值；这些赋值创建当前调用帧的局部绑定。递归子调用按词法作用域从函数定义环境取值，不继承调用者帧，因此看不到父层选择和占用状态。save_board 同样读取外层未更新的 placement，代码无法实现正文声称的共享回溯状态。",
  "R 版本未运行，静态检查却把局部向量描述为通过闭包共享并撤销，说明高风险语言语义不能只靠跨语言表面对齐确认。",
  "若改用 <<-、显式环境或参数传递修复状态，必须重新计算向量复制、别名和撤销成本，不能直接继承可变数组语言的 O(n) 工作状态说明。",
]
rule_ids = [
  "r_recursive_state_binding",
  "runtime_validation_for_language_semantics",
  "language_specific_mutation_cost",
]

