name: Unpack 0115-0116 quality batch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.head_ref == 'agent/generate-0115-0116-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize formal files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .batch-upload-0115-0116 ]]; then
            exit 0
          fi
          cat .batch-upload-0115-0116/part_* | base64 --decode > /tmp/batch0115_0116.tar.gz
          printf '%s  %s\n' \
            'ec1d43ae1c701566ef4f5bd86e307eb483e4838ffbcf5f8b3602f274e520277a' \
            /tmp/batch0115_0116.tar.gz | sha256sum -c -
          tar -xzf /tmp/batch0115_0116.tar.gz
          rm -rf .batch-upload-0115-0116
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "content: materialize 0115-0116 quality batch"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
