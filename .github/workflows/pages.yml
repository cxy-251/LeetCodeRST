name: Deploy Sphinx docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed to restore per-file mtimes below.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Restore file mtimes from git history
        # actions/checkout sets every file's mtime to checkout time, which
        # would make Sphinx think all ~4000 pages changed on every run and
        # defeat the doctree cache below. Set each tracked file's mtime to
        # its last commit time instead, so unchanged files stay unchanged.
        run: |
          python3 - <<'EOF'
          import subprocess, os
          from datetime import datetime

          log = subprocess.run(
              ["git", "log", "--name-only", "--diff-filter=AM", "--format=%x00%cI"],
              capture_output=True, text=True, check=True,
          ).stdout

          seen = set()
          epoch = None
          for line in log.split("\n"):
              if line.startswith("\x00"):
                  # %cI is strict ISO 8601 but some commits used a UTC "Z"
                  # suffix instead of "+00:00", which older fromisoformat()
                  # versions reject.
                  epoch = datetime.fromisoformat(line[1:].replace("Z", "+00:00")).timestamp()
                  continue
              if not line or line in seen:
                  continue
              seen.add(line)
              if epoch is not None and os.path.isfile(line):
                  os.utime(line, (epoch, epoch))
          EOF

      - name: Restore Sphinx doctree cache
        uses: actions/cache@v4
        with:
          path: _build/doctrees
          key: sphinx-doctrees-${{ github.sha }}
          restore-keys: |
            sphinx-doctrees-

      - name: Build Sphinx site
        run: uv run sphinx-build -b html -d _build/doctrees -j auto . _build/html

      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
