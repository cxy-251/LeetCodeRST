name: Rename teaching focus field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-teaching-focus.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename field in problems 0001-0100
        run: |
          sed -i 's/^:教学重点:/:重点:/' 0001-0100/*.rst
          rm .github/workflows/rename-teaching-focus.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 0001-0100/*.rst .github/workflows/rename-teaching-focus.yml
          git commit -m 'docs: shorten teaching focus field label'
          git push origin main
