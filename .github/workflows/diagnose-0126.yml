name: Diagnose 0126 materialization

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/generate-0126-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record diagnostics
        shell: bash
        run: |
          if [[ -f .diagnose-0126.txt ]]; then
            exit 0
          fi
          cat \
            .batch-upload-0126/part_00 \
            .batch-upload-0126/part_01_00 \
            .batch-upload-0126/part_01_01 \
            .batch-upload-0126/part_01_02 \
            .batch-upload-0126/part_01_03 \
            .batch-upload-0126/part_02 \
            .batch-upload-0126/part_03 \
            .batch-upload-0126/part_04 \
            > /tmp/0126.b64
          base64 --decode /tmp/0126.b64 > /tmp/0126.rst.gz
          echo "sha=$(sha256sum /tmp/0126.rst.gz | cut -d' ' -f1)" > .diagnose-0126.txt
          gzip -t /tmp/0126.rst.gz >/dev/null 2>&1
          echo "gzip_status=$?" >> .diagnose-0126.txt
          gzip -dc /tmp/0126.rst.gz > /tmp/0126.rst
          for check in \
            'AGENTS.md|下一批是 `0126`。' \
            'README.rst|下一批是单题 ``0126``' \
            'problems/0101-0200/README.rst|0125. Valid Palindrome' \
            'state/REVIEW_INDEX.toml|start = 126'; do
            file="${check%%|*}"
            pattern="${check#*|}"
            if grep -Fq "$pattern" "$file"; then
              echo "anchor_${file}=1" >> .diagnose-0126.txt
            else
              echo "anchor_${file}=0" >> .diagnose-0126.txt
            fi
          done
          python3 -c 'from pathlib import Path; t=Path("/tmp/0126.rst").read_text(); print("article_lines="+str(len(t.splitlines()))); print("max_line="+str(max(map(len,t.splitlines())))); print("title="+str(int("0126. Word Ladder II" in t)))' >> .diagnose-0126.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnose-0126.txt
          git commit -m "chore: record 0126 materialization diagnostics"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
