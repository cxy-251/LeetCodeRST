name: Review 0001-0100 final

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/review-0001-0100-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-0001-0100-final
          fetch-depth: 0
      - name: Apply reviewed changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in sorted(Path('0001-0100').glob('*.rst')):
              number = path.name[:4]
              if not number.isdigit() or not (1 <= int(number) <= 100):
                  continue

              text = path.read_text(encoding='utf-8')
              original = text
              marker = '\n题目重述\n--------\n'
              split = text.find(marker)
              if split < 0:
                  raise SystemExit(f'missing 题目重述 marker: {path}')

              intro = text[:split]
              tail = text[split:]
              first_line = text.splitlines()[0]
              title = first_line.split('. ', 1)[1]

              if ':题名:' not in intro:
                  intro = re.sub(
                      rf'(:题号:\s*{number}\n)',
                      rf'\1:题名: {title}\n',
                      intro,
                      count=1,
                  )
              if ':类型:' not in intro:
                  intro = re.sub(
                      r'(:难度:\s*[^\n]+\n)',
                      r'\1:类型: Algorithms\n',
                      intro,
                      count=1,
                  )

              text = intro + tail

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('no numbered files changed')

          expected = [
              p for p in sorted(Path('0001-0100').glob('*.rst'))
              if p.name[:4].isdigit() and 31 <= int(p.name[:4]) <= 100
          ]
          actual = [Path(p) for p in changed]
          if actual != expected:
              raise SystemExit(f'unexpected changed files: {changed}')

          for path in sorted(Path('0001-0100').glob('*.rst')):
              number = path.name[:4]
              if not number.isdigit() or not (1 <= int(number) <= 100):
                  continue
              intro = path.read_text(encoding='utf-8').split(marker, 1)[0]
              if ':题名:' not in intro or ':类型:' not in intro:
                  raise SystemExit(f'incomplete metadata: {path}')

          print('\n'.join(changed))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 0001-0100/*.rst
          git commit -m 'docs: complete reviewed metadata for problems 0001-0100'
          git push
