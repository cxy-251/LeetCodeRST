name: Apply second pass 0004-0030

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && startsWith(github.head_ref, 'agent/run-second-pass-0004-0030')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace only introductory sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          namespace = {}
          exec(Path('.github/second_pass_0004_0030.py').read_text(encoding='utf-8'), namespace)
          prefixes = namespace['PREFIXES']
          marker = '\nC++ 实现\n--------\n'

          for filename in prefixes:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'missing file: {filename}')
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'missing C++ marker: {filename}')
              lines = text.splitlines(keepends=True)
              if len(lines) < 3 or lines[2].strip():
                  raise SystemExit(f'unexpected title block: {filename}')

          for filename, prefix in prefixes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              title_block = ''.join(text.splitlines(keepends=True)[:3])
              tail = text[text.index(marker) + 1:]
              path.write_text(title_block + prefix.strip() + '\n\n' + tail, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 0001-0100/000{4,5,6,7,8,9}-*.rst 0001-0100/001*.rst 0001-0100/002*.rst 0001-0100/0030-*.rst
          git diff --cached --check
          git commit -m "docs: second-pass review 0004-0030"
          git push origin HEAD:${{ github.head_ref }}
