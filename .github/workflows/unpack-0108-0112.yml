name: Unpack 0108-0112 quality batch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.head_ref == 'agent/generate-0108-0112-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize formal files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .batch-upload-0108-0112 ]]; then
            exit 0
          fi
          cat .batch-upload-0108-0112/part_* | base64 --decode > /tmp/batch0108_0112.tar.gz
          printf '%s  %s\n' \
            'f973fb9de625ad93953586a8bfe386cb7e07a3bb23ac74f22a5b49200f88521b' \
            /tmp/batch0108_0112.tar.gz | sha256sum -c -
          tar -xzf /tmp/batch0108_0112.tar.gz
          rm -rf .batch-upload-0108-0112
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "content: materialize 0108-0112 quality batch"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
