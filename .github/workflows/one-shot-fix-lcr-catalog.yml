name: One-shot remove generated catalog artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-lcr-catalog.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated artifacts
        shell: bash
        run: |
          rm -rf special _catalog
          rm -f .github/workflows/one-shot-complete-catalog.yml
          rm -f .github/workflows/one-shot-complete-catalog-v2.yml
          rm -f .github/workflows/one-shot-fix-lcr-catalog.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove generated catalog artifacts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
