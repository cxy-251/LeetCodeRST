name: One-shot complete LeetCode catalog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-complete-catalog.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch catalog sources
        shell: bash
        run: |
          rm -rf /tmp/doocs-leetcode
          git clone --depth 1 --filter=blob:none --sparse https://github.com/doocs/leetcode.git /tmp/doocs-leetcode
          git -C /tmp/doocs-leetcode sparse-checkout set solution/README_EN.md lcp lcr lcs lcci lcof lcof2

      - name: Generate every missing catalog file
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ROOT = Path(".")
          DOOCS = Path("/tmp/doocs-leetcode")

          SERIES = {
              "lcp": {"directory": "LCP", "code": "LCP", "label": "LCP"},
              "lcr": {"directory": "LCR", "code": "LCR", "label": "LCR"},
              "lcs": {"directory": "LCS", "code": "LCS", "label": "LCS"},
              "lcci": {"directory": "LCCI", "code": "LCCI", "label": "面试题"},
              "lcof": {"directory": "Offer", "code": "OFFER", "label": "剑指 Offer"},
              "lcof2": {"directory": "Offer-II", "code": "OFFER-II", "label": "剑指 Offer II"},
          }

          def request_json(url, payload=None, timeout=60):
              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Referer": "https://leetcode.com/problemset/",
              }
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          def graphql_questions():
              endpoint = "https://leetcode.com/graphql"
              query = r"""
              query problemsetQuestionList($categorySlug: String, $limit: Int, $skip: Int, $filters: QuestionListFilterInput) {
                problemsetQuestionList: questionList(
                  categorySlug: $categorySlug
                  limit: $limit
                  skip: $skip
                  filters: $filters
                ) {
                  total: totalNum
                  questions: data {
                    frontendQuestionId: questionFrontendId
                    paidOnly: isPaidOnly
                    difficulty
                    title
                    titleSlug
                    topicTags { name slug }
                  }
                }
              }
              """
              rows = []
              skip = 0
              while True:
                  payload = {
                      "query": query,
                      "variables": {
                          "categorySlug": "",
                          "skip": skip,
                          "limit": 100,
                          "filters": {
                              "orderBy": "FRONTEND_ID",
                              "sortOrder": "ASCENDING",
                          },
                      },
                  }
                  page = request_json(endpoint, payload)["data"]["problemsetQuestionList"]
                  batch = page.get("questions") or []
                  rows.extend(batch)
                  skip += len(batch)
                  total = int(page.get("total") or 0)
                  if not batch or skip >= total:
                      break
                  time.sleep(0.12)
              if len(rows) < 3000:
                  raise RuntimeError(f"LeetCode GraphQL returned only {len(rows)} rows")
              return rows

          def fallback_numeric_questions():
              index = (DOOCS / "solution" / "README_EN.md").read_text(encoding="utf-8")
              row_re = re.compile(
                  r"^\|\s+(\d+)\s+\|\s+\[([^\]]+)\]\([^)]+\)\s+\|\s+(.*?)\s+\|\s+(Easy|Medium|Hard)\s+\|\s+(.*?)\s+\|$"
              )
              rows = []
              for line in index.splitlines():
                  match = row_re.match(line)
                  if not match:
                      continue
                  qid, title, tags_text, difficulty, remark = match.groups()
                  title = html.unescape(title)
                  slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")
                  rows.append({
                      "frontendQuestionId": qid,
                      "paidOnly": "🔒" in remark,
                      "difficulty": difficulty,
                      "title": title,
                      "titleSlug": slug,
                      "topicTags": [
                          {"name": tag, "slug": ""}
                          for tag in re.findall(r"`([^`]+)`", tags_text)
                      ],
                  })
              if len(rows) < 3000:
                  raise RuntimeError(f"doocs index returned only {len(rows)} rows")
              return rows

          def existing_numeric_ids():
              ids = set()
              for path in ROOT.glob("[0-9]*-[0-9]*/*.rst"):
                  match = re.match(r"^(\d+)-", path.name)
                  if match:
                      ids.add(int(match.group(1)))
              return ids

          def problem_type(row):
              tags = {
                  str(tag.get("name") or "").strip().lower()
                  for tag in row.get("topicTags") or []
              }
              if "database" in tags:
                  return "Database"
              if "shell" in tags:
                  return "Shell"
              if "concurrency" in tags:
                  return "Concurrency"
              if row.get("paidOnly"):
                  return "Premium"
              return "Algorithms"

          def write_numeric(rows, source):
              by_id = {}
              for row in rows:
                  raw_id = str(row.get("frontendQuestionId") or "").strip()
                  if raw_id.isdigit():
                      by_id[int(raw_id)] = row

              existing = existing_numeric_ids()
              created = 0
              for qid in sorted(by_id):
                  if qid in existing:
                      continue
                  row = by_id[qid]
                  title = str(row.get("title") or "").strip()
                  slug = str(row.get("titleSlug") or "").strip()
                  if not title or not slug:
                      continue
                  difficulty = str(row.get("difficulty") or "Unknown")
                  ptype = problem_type(row)
                  start = ((qid - 1) // 100) * 100 + 1
                  end = start + 99
                  qtext = f"{qid:04d}"
                  directory = ROOT / f"{start:04d}-{end:04d}"
                  path = directory / f"{qtext}-{slug}.rst"
                  title_line = f"{qtext}. {title}"
                  body = (
                      f"{title_line}\n"
                      f"{'=' * len(title_line)}\n\n"
                      f":题号: {qtext}\n"
                      f":题名: {title}\n"
                      f":类型: {ptype}（元数据占位）\n"
                      f":难度: {difficulty}\n"
                      f":原题: `LeetCode {qtext} <https://leetcode.com/problems/{slug}/>`_\n"
                      f":数据源: {source}\n"
                      f":处理状态: 题目文件已建立；题目信息、题目重述与自建示例待后续补充。\n"
                  )
                  directory.mkdir(parents=True, exist_ok=True)
                  path.write_text(body, encoding="utf-8")
                  existing.add(qid)
                  created += 1
              return by_id, created

          def first_heading(markdown):
              pattern = re.compile(r"^#\s+(?:\[([^\]]+)\]\(([^)]+)\)|(.+?))\s*$")
              for line in markdown.splitlines():
                  match = pattern.match(line.strip())
                  if match:
                      display = (match.group(1) or match.group(3) or "").strip()
                      url = (match.group(2) or "").strip()
                      return display, url
              return "", ""

          def normalize_number(value):
              value = value.strip()
              value = re.sub(r"\s+", "", value)
              value = value.replace("–", "-").replace("—", "-")
              return value

          def parse_special(root, folder_name, display):
              if root == "lcp":
                  match = re.search(r"\bLCP\s+([0-9A-Za-z.-]+)", display, re.I)
                  number = normalize_number(match.group(1)) if match else ""
                  canonical = f"LCP {number}" if number else folder_name
              elif root == "lcr":
                  match = re.search(r"\bLCR\s+([0-9A-Za-z.-]+)", display, re.I)
                  number = normalize_number(match.group(1)) if match else ""
                  canonical = f"LCR {number}" if number else folder_name
              elif root == "lcs":
                  match = re.search(r"\bLCS\s+([0-9A-Za-z.-]+)", display, re.I)
                  number = normalize_number(match.group(1)) if match else ""
                  canonical = f"LCS {number}" if number else folder_name
              elif root == "lcci":
                  match = re.search(r"(?:面试题\s*)?(\d{2}\.\d{2})", display)
                  if not match:
                      match = re.match(r"(\d{2}\.\d{2})", folder_name)
                  number = normalize_number(match.group(1)) if match else ""
                  canonical = f"面试题 {number}" if number else f"面试题 {folder_name}"
              elif root == "lcof2":
                  match = re.search(
                      r"剑指\s*Offer\s*II\s*([0-9]+(?:\s*[-–—]\s*[IVX]+)?)",
                      display,
                      re.I,
                  )
                  number = normalize_number(match.group(1)) if match else ""
                  canonical = f"剑指 Offer II {number}" if number else folder_name
              else:
                  match = re.search(
                      r"剑指\s*Offer\s*([0-9]+(?:\s*[-–—]\s*[IVX]+)?)",
                      display,
                      re.I,
                  )
                  number = normalize_number(match.group(1)) if match else ""
                  canonical = f"剑指 Offer {number}" if number else folder_name

              title = display
              if canonical and display.startswith(canonical):
                  title = display[len(canonical):].lstrip(" .：:-")
              if not title:
                  parts = folder_name.split(".", 1)
                  title = parts[1].strip() if len(parts) == 2 else folder_name
              return canonical, number, title

          def file_key(series_code, number, folder_name):
              raw = number or folder_name
              raw = re.sub(r"[^0-9A-Za-z]+", "-", raw).strip("-").lower()
              if not raw:
                  raw = str(abs(hash(folder_name)))
              return f"{series_code.lower()}-{raw}.rst"

          def special_problem_dirs(root):
              base = DOOCS / root
              if not base.exists():
                  return []
              result = []
              for readme in base.rglob("README.md"):
                  if readme.parent == base:
                      continue
                  relative = readme.relative_to(base)
                  if len(relative.parts) != 2:
                      continue
                  result.append(readme)
              return sorted(result)

          def write_special():
              created = 0
              counts = {}
              records = []
              for root, config in SERIES.items():
                  count = 0
                  target_dir = ROOT / "special" / config["directory"]
                  target_dir.mkdir(parents=True, exist_ok=True)
                  for readme in special_problem_dirs(root):
                      markdown = readme.read_text(encoding="utf-8")
                      display, original_url = first_heading(markdown)
                      folder_name = readme.parent.name
                      if not display:
                          display = folder_name
                      canonical, number, title = parse_special(root, folder_name, display)
                      path = target_dir / file_key(config["code"], number, folder_name)
                      source_relative = readme.parent.relative_to(DOOCS).as_posix()
                      source_url = (
                          "https://github.com/doocs/leetcode/tree/main/"
                          + urllib.parse.quote(source_relative, safe="/")
                      )
                      if not original_url:
                          original_url = source_url
                      title_line = f"{canonical}. {title}" if title else canonical
                      body = (
                          f"{title_line}\n"
                          f"{'=' * len(title_line)}\n\n"
                          f":题号: {canonical}\n"
                          f":题名: {title}\n"
                          f":系列: {config['label']}\n"
                          f":类型: Algorithms（元数据占位）\n"
                          f":原题: `LeetCode {canonical} <{original_url}>`_\n"
                          f":资料源: `doocs/leetcode <{source_url}>`_\n"
                          f":处理状态: 题目文件已建立；题目信息、题目重述与自建示例待后续补充。\n"
                      )
                      if not path.exists():
                          path.write_text(body, encoding="utf-8")
                          created += 1
                      count += 1
                      records.append({
                          "series": config["label"],
                          "id": canonical,
                          "title": title,
                          "path": path.as_posix(),
                          "url": original_url,
                      })
                  counts[config["label"]] = count
              return counts, records, created

          try:
              rows = graphql_questions()
              numeric_source = "LeetCode GraphQL"
          except Exception as exc:
              print(f"GraphQL unavailable: {exc}; falling back to doocs index")
              rows = fallback_numeric_questions()
              numeric_source = "doocs/leetcode"

          numeric, numeric_created = write_numeric(rows, numeric_source)
          special_counts, special_records, special_created = write_special()

          catalog = {
              "generated_from": {
                  "ordinary": numeric_source,
                  "special": "doocs/leetcode",
              },
              "ordinary_question_count": len(numeric),
              "ordinary_max_frontend_id": max(numeric, default=None),
              "special_question_count": len(special_records),
              "special_series": special_counts,
              "ordinary_files_created": numeric_created,
              "special_files_created": special_created,
          }

          catalog_dir = ROOT / "_catalog"
          catalog_dir.mkdir(exist_ok=True)
          (catalog_dir / "catalog.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          heading = "LeetCode 完整题库"
          lines = [
              heading,
              "=" * len(heading),
              "",
              f":普通数字题数量: {len(numeric)}",
              f":普通数字题最大编号: {max(numeric, default='无')}",
              f":特殊题号数量: {len(special_records)}",
              f":普通题数据源: {numeric_source}",
              f":特殊题数据源: doocs/leetcode",
              "",
              "特殊题号系列",
              "------------",
              "",
          ]
          for name, count in special_counts.items():
              lines.append(f"* {name}: {count}")
          lines.extend([
              "",
              "说明",
              "----",
              "",
              "普通数字题按每 100 题一个目录组织；特殊题号位于 ``special/`` 下的独立系列目录。",
              "该索引记录当前数据源可见的完整题库，后续新增题目可使用同一生成逻辑增量同步。",
              "",
          ])
          (catalog_dir / "README.rst").write_text("\n".join(lines), encoding="utf-8")

          print(json.dumps(catalog, ensure_ascii=False, indent=2))
          PY

      - name: Commit generated catalog and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-complete-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: establish complete LeetCode catalog [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
