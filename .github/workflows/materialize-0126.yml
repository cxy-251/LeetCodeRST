name: Materialize 0126 quality batch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/generate-0126-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Write formal batch files
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-upload-0126/part_* | base64 --decode > /tmp/0126.rst.gz
          printf '%s  %s\n' \
            '9bcd801f45545d3debedbf50582fb96451f439d6e8155ceddabccb653c61f464' \
            /tmp/0126.rst.gz | sha256sum -c -
          gzip -t /tmp/0126.rst.gz
          gzip -dc /tmp/0126.rst.gz \
            > problems/0101-0200/0126-word-ladder-ii.rst

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1))

          replace(
              "AGENTS.md",
              "`0001–0125` 的多语言教程已经完成；`0051–0100` 的第二轮逐题审查和规则归并也已完成。\n当前阶段由 `state/PROGRESS.toml` 决定，下一批是 `0126`。",
              "`0001–0126` 的多语言教程已经完成；`0051–0100` 的第二轮逐题审查和规则归并也已完成。\n当前阶段由 `state/PROGRESS.toml` 决定，下一批是 `0127–0128`。",
          )

          replace(
              "README.rst",
              "``0001`` 至 ``0125`` 的多语言教程已经完成。``0051`` 至 ``0100`` 的第二轮逐题审查、81 条规则归并和\n14 项事实更正也已完成。\n\n``0124`` 至 ``0125`` 按难度预算 5 分完成：Hard、Easy。下一批是单题 ``0126``，Hard = 4；\n``0127`` 同样是 Hard，同一轮不安排两道 Hard。新题继续直接执行\n``docs/FORWARD_RULES_0101_0150.rst``。",
              "``0001`` 至 ``0126`` 的多语言教程已经完成。``0051`` 至 ``0100`` 的第二轮逐题审查、81 条规则归并和\n14 项事实更正也已完成。\n\n``0126`` 按难度预算 4 分完成：Hard。下一批是 ``0127–0128``，由 Hard、Medium 组成，\n合计 6 分；``0129`` 为 Medium，加入后会超过单批预算。新题继续直接执行\n``docs/FORWARD_RULES_0101_0150.rst``。",
          )

          replace(
              "docs/AUTOMATION_QUALITY_GATE.rst",
              "当前 ``state/PROGRESS.toml`` 的阶段为 ``generation_ready``，``0101`` 至 ``0125`` 已完成，下一批从\n``0126`` 开始。历史审查资料已经归档，不属于新题生成时的默认读取清单。",
              "当前 ``state/PROGRESS.toml`` 的阶段为 ``generation_ready``，``0101`` 至 ``0126`` 已完成，下一批从\n``0127`` 开始。历史审查资料已经归档，不属于新题生成时的默认读取清单。",
          )

          index = Path("problems/0101-0200/README.rst")
          text = index.read_text()
          text = text.replace(
              "本目录按题号顺序保存 0101 至 0200 的题目教程。当前已完成 0101 至 0125。",
              "本目录按题号顺序保存 0101 至 0200 的题目教程。当前已完成 0101 至 0126。",
              1,
          )
          anchor = "#. `0125. Valid Palindrome <0125-valid-palindrome.rst>`_\n"
          if anchor not in text:
              raise SystemExit("missing 0125 index anchor")
          text = text.replace(
              anchor,
              anchor + "#. `0126. Word Ladder II <0126-word-ladder-ii.rst>`_\n",
              1,
          )
          text = re.sub(
              r"本批次\n------\n.*?\n执行规则\n--------",
              "本批次\n------\n\n``0126`` Hard = 4，作为单题批次完成。``0127`` 同样是 Hard，不能与 ``0126`` 同批。\n\n执行规则\n--------",
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"下一动作\n--------\n.*\Z",
              "下一动作\n--------\n\n下一批为 ``0127–0128``：Hard + Medium = 6。``0129`` 为 Medium，加入后会超过预算。\n",
              text,
              count=1,
              flags=re.S,
          )
          index.write_text(text)

          Path("state/PROGRESS.toml").write_text('''[project]
          name = "leetcode-multilang-rst"
          phase = "generation_ready"
          format = "rst"
          ordering = "leetcode_number_ascending"
          execution_mode = "conversation_only"
          git_workflow = "conversation_direct_main"
          build_required = false
          content_language = "zh-CN"
          code_comment_language = "zh-CN"

          [progress]
          next_problem = 127
          completed_count = 126
          completed_ranges = ["0001-0126"]
          premium_skipped = []
          blocked = []
          needs_revision = []

          [last_batch]
          status = "completed"
          kind = "problem_generation"
          start = 126
          end = 126
          completed = 1
          difficulty_budget = 4
          summary = "按 Easy=1、Medium=2、Hard=4 的预算完成 0126；单题具备完整教学正文、十语言实现与分语言验证证据。"

          [next_batch]
          status = "generation_ready"
          kind = "problem_generation"
          start = 127
          end = 128
          difficulty_budget = 6
          purpose = "继续执行 docs/FORWARD_RULES_0101_0150.rst；0127 为 Hard、0128 为 Medium，合计 6 分；0129 为 Medium，加入后超过预算。"

          [review]
          status = "completed"
          mode = "second_round_content_review"
          source = "complete_rst_content"
          start = 51
          end = 100
          reviewed_count = 50
          modify_historical_rst = false
          index = "state/REVIEW_INDEX.toml"
          first_round_archive = "archive/reviews/0001-0050/MANIFEST.rst"
          second_round_archive = "archive/reviews/0051-0100/MANIFEST.rst"

          [rule_consolidation]
          status = "completed"
          source_start = 51
          source_end = 100
          source_batch_count = 10
          absorbed_promoted_rule_count = 81
          active_correction_count = 14
          record = "archive/reviews/0051-0100/RULE_CONSOLIDATION.toml"
          output = "docs/FORWARD_RULES_0101_0150.rst"

          [validation]
          rst_problem_files = 1
          language_code_blocks = 10
          line_width_hard_limit = 100
          line_width_violations = 0
          rst_parse_warnings = 0
          python_ast_passed = 1
          python_random_word_ladder_cases = 3000
          c_strict_compile_passed = 1
          c_random_word_ladder_cases = 500
          cpp_strict_compile_passed = 1
          cpp_random_word_ladder_cases = 500
          c_cpp_sanitizer_runs_passed = 2
          java_compile_and_run_passed = 1
          java_random_word_ladder_cases = 500
          go_compile_and_run_passed = 1
          go_random_word_ladder_cases = 500
          typescript_strict_and_run_passed = 1
          typescript_random_word_ladder_cases = 500
          rust_static_checked = 1
          csharp_static_checked = 1
          julia_static_checked = 1
          r_static_checked = 1
          runtime_test_claimed_for_static_only_languages = false

          [artifact_lifecycle]
          policy = "docs/ARTIFACT_LIFECYCLE_POLICY.rst"
          archive_index = "archive/README.rst"
          active_review_batch_files = 0
          active_review_finding_files = 0
          last_archive = "archive/reviews/0051-0100/MANIFEST.rst"
          temporary_marker_present = false
          disposable_generation_reports_committed = false

          [quality_scope]
          historical_start = 1
          historical_end = 126
          historical_policy = "已完成题目默认保持原样；事实更正前向生效，只有用户明确指定时才修复历史 RST。"
          forward_rule_start = 127
          forward_rule_end = 150
          forward_rule_policy = "0127-0150 继续读取已归并的完整前向规则和 active corrections。"

          [execution]
          trigger = "explicit_user_message_in_active_conversation"
          cadence = "single_reply_cycle"
          write_target = "main"
          commit_shape = "one_atomic_commit"
          collaboration_mode = "branch_or_pr_when_user_selects_review_workflow"
          policy = "docs/AUTOMATION_DIRECT_MAIN_POLICY.rst"

          [concept_ledger]
          index = "state/CONCEPT_LEDGER.toml"
          latest_record = "state/concepts/0126.toml"

          [next_action]
          summary = "按照连续难度预算生成 0127-0128；Hard、Medium 合计 6 分，0129 Medium 不再加入。"

          [last_update]
          summary = "0126 已按逐题闭合方式完成；最短层 BFS、多前驱 DAG、目标层收尾和输出敏感复杂度均通过分语言验证。"
          '''.replace("          ", ""))

          review = Path("state/REVIEW_INDEX.toml")
          review_text = review.read_text()
          review_text = re.sub(
              r"\[next_action\]\nkind = \"problem_generation\"\nstatus = \"ready\"\nstart = 126\nend = 126\npurpose = .*?\n\n\[artifact_lifecycle\]",
              "[next_action]\nkind = \"problem_generation\"\nstatus = \"ready\"\nstart = 127\nend = 128\npurpose = \"Generate problems 0127-0128 using docs/FORWARD_RULES_0101_0150.rst; Hard 0127 and Medium 0128 consume 6 points, while Medium 0129 would exceed the batch budget.\"\n\n[artifact_lifecycle]",
              review_text,
              count=1,
              flags=re.S,
          )
          review.write_text(review_text)

          Path("state/CONCEPT_LEDGER.toml").write_text('''[meta]
          version = 12
          last_problem = 126
          format = "segmented"

          [records]
          legacy = "state/concepts/0001-0050.toml"
          previous = "state/concepts/0051-0100.toml"
          current = "state/concepts/0101-0104.toml"
          recent = "state/concepts/0105-0107.toml"
          prior = "state/concepts/0108-0112.toml"
          penultimate = "state/concepts/0113-0114.toml"
          latest_previous = "state/concepts/0115-0116.toml"
          prior_latest = "state/concepts/0117-0120.toml"
          latest_before_previous = "state/concepts/0121-0122.toml"
          latest_previous_batch = "state/concepts/0123.toml"
          latest_before_current = "state/concepts/0124-0125.toml"
          latest = "state/concepts/0126.toml"

          [resolution]
          statement = "按 legacy、previous、current、recent、prior、penultimate、latest_previous、prior_latest、latest_before_previous、latest_previous_batch、latest_before_current、latest 顺序读取；后续分段中的同名 updates 覆盖更早记录的 last_problem、occurrences、teaching_state 和 note。"
          '''.replace("          ", ""))

          Path("state/concepts/0126.toml").write_text('''[meta]
          version = 1
          range = "0126"
          last_problem = 126
          inherits = "state/concepts/0124-0125.toml"

          [updates]
          "complexity.output_space_exclusion" = "此前 32 次区分工作状态与返回载荷；0126 将 BFS 距离、前驱 DAG、回溯路径与全部序列字符串载荷分别计费，累计 33 次。"

          [concepts]
          "algorithm.shortest_path_predecessor_dag" = "kind=algorithm; introduced=0126; last=0126; occurrences=1; teaching_state=explained; note=BFS 只保存最短距离与同层多前驱，把全部最短序列压缩为前驱 DAG，再按输出规模回溯物化。"
          "boundary.bfs_finish_target_parent_layer" = "kind=boundary; introduced=0126; last=0126; occurrences=1; teaching_state=explained; note=首次发现终点后仍处理目标上一层全部节点，收齐其他最短前驱；队首进入目标层时停止，避免探索更深路径。"
          "proof.distance_strictly_decreases_in_backtracking" = "kind=proof; introduced=0126; last=0126; occurrences=1; teaching_state=explained; note=每条前驱边都使 BFS 距离减一，因此回溯天然无环、终止，并且只生成最短序列。"
          "complexity.enumeration_output_payload" = "kind=complexity; introduced=0126; last=0126; occurrences=1; teaching_state=explained; note=设答案数 P、每条含 D 个长度 L 的单词，完整枚举存在 Theta(PDL) 时间与返回载荷下界，不能只报告图搜索成本。"
          "boundary.word_ladder_same_level_multiple_parents" = "kind=boundary; introduced=0126; last=0126; occurrences=1; teaching_state=explained; note=候选首次发现时入队并记录首个前驱；同一最短层再次发现时追加前驱，较深层到达则忽略。"
          '''.replace("          ", ""))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          article = Path("problems/0101-0200/0126-word-ladder-ii.rst")
          text = article.read_text()
          languages = [
              "c", "cpp", "python", "java", "rust",
              "go", "typescript", "csharp", "julia", "r",
          ]
          for language in languages:
              count = len(re.findall(
                  rf"^\.\. code-block:: {language}$",
                  text,
                  re.M,
              ))
              if count != 1:
                  raise SystemExit(f"{language} code block count: {count}")
          for number, line in enumerate(text.splitlines(), 1):
              if len(line) > 100:
                  raise SystemExit(f"line {number} exceeds 100 characters")
          if "0126. Word Ladder II" not in text:
              raise SystemExit("missing article title")
          for path in [
              "state/PROGRESS.toml",
              "state/REVIEW_INDEX.toml",
              "state/CONCEPT_LEDGER.toml",
              "state/concepts/0126.toml",
          ]:
              with open(path, "rb") as stream:
                  tomllib.load(stream)
          PY

          rm -rf .batch-upload-0126
          rm -f .github/workflows/materialize-0126.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: materialize 0126 quality batch"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
