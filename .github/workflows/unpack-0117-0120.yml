name: Unpack 0117-0120 quality batch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.head_ref == 'agent/generate-0117-0120-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize formal files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .batch-upload-0117-0120 ]]; then
            exit 0
          fi
          cat .batch-upload-0117-0120/part_* | base64 --decode > /tmp/batch0117_0120.tar.gz
          printf '%s  %s\n' \
            '92295ef6822527b1608bfadf0de99be55660658ce6002ff58396b126c53109bc' \
            /tmp/batch0117_0120.tar.gz | sha256sum -c -
          tar -xzf /tmp/batch0117_0120.tar.gz
          rm -rf .batch-upload-0117-0120
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "content: materialize 0117-0120 quality batch"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
