name: Diagnose 0124-0125 payload

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/generate-0124-0125-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record payload diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat .batch-upload-0124-0125/part_* > /tmp/batch0124-0125.b64
          base64 --decode /tmp/batch0124-0125.b64 > /tmp/batch0124-0125.tar.gz
          {
            echo "payload_sha=$(sha256sum /tmp/batch0124-0125.tar.gz | awk '{print $1}')"
            echo "payload_size=$(wc -c < /tmp/batch0124-0125.tar.gz)"
            for file in .batch-upload-0124-0125/part_*; do
              echo "$(basename "$file")_blob=$(git hash-object "$file")"
            done
            echo "tar_entries:"
            tar -tzf /tmp/batch0124-0125.tar.gz
          } > .batch-upload-0124-0125/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .batch-upload-0124-0125/status.txt
          git commit -m "chore: record 0124-0125 payload diagnostics"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
