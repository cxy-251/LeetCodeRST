name: Materialize 0124-0125 quality batch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/generate-0124-0125-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize formal files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .batch-upload-0124-0125/part_00 ]]; then
            exit 0
          fi

          cat .batch-upload-0124-0125/part_* > /tmp/batch0124-0125.b64
          base64 --decode /tmp/batch0124-0125.b64 > /tmp/batch0124-0125.tar.gz
          printf '%s  %s\n' \
            'f3f10f5833c1c802c62d0de1f14bb80b5ce6577becd5c96893402de4d14d8e3c' \
            /tmp/batch0124-0125.tar.gz | sha256sum -c -
          gzip -t /tmp/batch0124-0125.tar.gz
          tar -xzf /tmp/batch0124-0125.tar.gz -C problems/0101-0200

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1))

          replace(
              "AGENTS.md",
              "`0001–0123` 的多语言教程已经完成；`0051–0100` 的第二轮逐题审查和规则归并也已完成。\n当前阶段由 `state/PROGRESS.toml` 决定，下一批是 `0124–0125`。",
              "`0001–0125` 的多语言教程已经完成；`0051–0100` 的第二轮逐题审查和规则归并也已完成。\n当前阶段由 `state/PROGRESS.toml` 决定，下一批是 `0126`。",
          )

          replace(
              "README.rst",
              "``0001`` 至 ``0123`` 的多语言教程已经完成。``0051`` 至 ``0100`` 的第二轮逐题审查、81 条规则归并和\n14 项事实更正也已完成。\n\n``0123`` 按难度预算 4 分完成：Hard。下一批是 ``0124–0125``，由 Hard、Easy 组成，\n合计 5 分；``0126`` 为 Hard，加入后会违反单批只安排一道 Hard 的规则。新题继续直接执行\n``docs/FORWARD_RULES_0101_0150.rst``。",
              "``0001`` 至 ``0125`` 的多语言教程已经完成。``0051`` 至 ``0100`` 的第二轮逐题审查、81 条规则归并和\n14 项事实更正也已完成。\n\n``0124`` 至 ``0125`` 按难度预算 5 分完成：Hard、Easy。下一批是单题 ``0126``，Hard = 4；\n``0127`` 同样是 Hard，同一轮不安排两道 Hard。新题继续直接执行\n``docs/FORWARD_RULES_0101_0150.rst``。",
          )

          replace(
              "docs/AUTOMATION_QUALITY_GATE.rst",
              "当前 ``state/PROGRESS.toml`` 的阶段为 ``generation_ready``，``0101`` 至 ``0123`` 已完成，下一批从\n``0124`` 开始。历史审查资料已经归档，不属于新题生成时的默认读取清单。",
              "当前 ``state/PROGRESS.toml`` 的阶段为 ``generation_ready``，``0101`` 至 ``0125`` 已完成，下一批从\n``0126`` 开始。历史审查资料已经归档，不属于新题生成时的默认读取清单。",
          )

          index = Path("problems/0101-0200/README.rst")
          text = index.read_text()
          text = text.replace(
              "本目录按题号顺序保存 0101 至 0200 的题目教程。当前已完成 0101 至 0123。",
              "本目录按题号顺序保存 0101 至 0200 的题目教程。当前已完成 0101 至 0125。",
              1,
          )
          anchor = "#. `0123. Best Time to Buy and Sell Stock III\n   <0123-best-time-to-buy-and-sell-stock-iii.rst>`_\n"
          if anchor not in text:
              raise SystemExit("missing 0123 index anchor")
          text = text.replace(
              anchor,
              anchor
              + "#. `0124. Binary Tree Maximum Path Sum\n"
              + "   <0124-binary-tree-maximum-path-sum.rst>`_\n"
              + "#. `0125. Valid Palindrome <0125-valid-palindrome.rst>`_\n",
              1,
          )
          text = re.sub(
              r"本批次\n------\n.*?\n执行规则\n--------",
              "本批次\n------\n\n``0124–0125`` 的难度预算为：\n\n"
              "* ``0124`` Hard = 4；\n"
              "* ``0125`` Easy = 1；\n"
              "* 总分为 5；\n"
              "* ``0126`` 为 Hard，加入后会违反单批只安排一道 Hard 的规则。\n\n"
              "执行规则\n--------",
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"下一动作\n--------\n.*\Z",
              "下一动作\n--------\n\n"
              "下一批只处理 ``0126``，Hard = 4。``0127`` 同样是 Hard，不能与其同批。\n",
              text,
              count=1,
              flags=re.S,
          )
          index.write_text(text)

          Path("state/PROGRESS.toml").write_text('''[project]
          name = "leetcode-multilang-rst"
          phase = "generation_ready"
          format = "rst"
          ordering = "leetcode_number_ascending"
          execution_mode = "conversation_only"
          git_workflow = "conversation_direct_main"
          build_required = false
          content_language = "zh-CN"
          code_comment_language = "zh-CN"

          [progress]
          next_problem = 126
          completed_count = 125
          completed_ranges = ["0001-0125"]
          premium_skipped = []
          blocked = []
          needs_revision = []

          [last_batch]
          status = "completed"
          kind = "problem_generation"
          start = 124
          end = 125
          completed = 2
          difficulty_budget = 5
          summary = "按 Easy=1、Medium=2、Hard=4 的预算完成 0124-0125；两题均具备完整教学正文、十语言实现与分语言验证证据。"

          [next_batch]
          status = "generation_ready"
          kind = "problem_generation"
          start = 126
          end = 126
          difficulty_budget = 4
          purpose = "继续执行 docs/FORWARD_RULES_0101_0150.rst；0126 为 Hard，单题 4 分；0127 同样是 Hard，同一轮不安排两道 Hard。"

          [review]
          status = "completed"
          mode = "second_round_content_review"
          source = "complete_rst_content"
          start = 51
          end = 100
          reviewed_count = 50
          modify_historical_rst = false
          index = "state/REVIEW_INDEX.toml"
          first_round_archive = "archive/reviews/0001-0050/MANIFEST.rst"
          second_round_archive = "archive/reviews/0051-0100/MANIFEST.rst"

          [rule_consolidation]
          status = "completed"
          source_start = 51
          source_end = 100
          source_batch_count = 10
          absorbed_promoted_rule_count = 81
          active_correction_count = 14
          record = "archive/reviews/0051-0100/RULE_CONSOLIDATION.toml"
          output = "docs/FORWARD_RULES_0101_0150.rst"

          [validation]
          rst_problem_files = 2
          language_code_blocks = 20
          line_width_hard_limit = 100
          line_width_violations = 0
          rst_parse_warnings = 0
          python_ast_passed = 2
          python_random_tree_cases = 3000
          python_exhaustive_palindrome_cases = 3906
          python_random_palindrome_cases = 5000
          c_strict_compile_passed = 2
          c_random_tree_cases = 500
          c_random_palindrome_cases = 1000
          cpp_strict_compile_passed = 2
          cpp_random_tree_cases = 500
          cpp_random_palindrome_cases = 1000
          c_cpp_sanitizer_runs_passed = 4
          java_compile_and_run_passed = 2
          java_random_tree_cases = 500
          java_random_palindrome_cases = 1000
          go_compile_and_run_passed = 2
          go_random_tree_cases = 500
          go_random_palindrome_cases = 1000
          typescript_strict_and_run_passed = 2
          typescript_random_tree_cases = 500
          typescript_random_palindrome_cases = 1000
          rust_static_checked = 2
          csharp_static_checked = 2
          julia_static_checked = 2
          r_static_checked = 2
          runtime_test_claimed_for_static_only_languages = false

          [artifact_lifecycle]
          policy = "docs/ARTIFACT_LIFECYCLE_POLICY.rst"
          archive_index = "archive/README.rst"
          active_review_batch_files = 0
          active_review_finding_files = 0
          last_archive = "archive/reviews/0051-0100/MANIFEST.rst"
          temporary_marker_present = false
          disposable_generation_reports_committed = false

          [quality_scope]
          historical_start = 1
          historical_end = 125
          historical_policy = "已完成题目默认保持原样；事实更正前向生效，只有用户明确指定时才修复历史 RST。"
          forward_rule_start = 126
          forward_rule_end = 150
          forward_rule_policy = "0126-0150 继续读取已归并的完整前向规则和 active corrections。"

          [execution]
          trigger = "explicit_user_message_in_active_conversation"
          cadence = "single_reply_cycle"
          write_target = "main"
          commit_shape = "one_atomic_commit"
          collaboration_mode = "branch_or_pr_when_user_selects_review_workflow"
          policy = "docs/AUTOMATION_DIRECT_MAIN_POLICY.rst"

          [concept_ledger]
          index = "state/CONCEPT_LEDGER.toml"
          latest_record = "state/concepts/0124-0125.toml"

          [next_action]
          summary = "按照连续难度预算生成 0126；Hard 单题 4 分，0127 也是 Hard，不与其同批。"

          [last_update]
          summary = "0124-0125 已按逐题闭合方式完成；树形最大路径双状态与 ASCII 过滤双指针均通过分语言验证。"
          '''.replace("          ", ""))

          review = Path("state/REVIEW_INDEX.toml")
          review_text = review.read_text()
          review_text = re.sub(
              r"\[next_action\]\nkind = \"problem_generation\"\nstatus = \"ready\"\nstart = 124\nend = 125\npurpose = .*?\n\n\[artifact_lifecycle\]",
              "[next_action]\nkind = \"problem_generation\"\nstatus = \"ready\"\n"
              "start = 126\nend = 126\n"
              "purpose = \"Generate problem 0126 using docs/FORWARD_RULES_0101_0150.rst; Hard 0126 consumes 4 points, while Hard 0127 cannot share the same batch.\"\n\n"
              "[artifact_lifecycle]",
              review_text,
              count=1,
              flags=re.S,
          )
          review.write_text(review_text)

          Path("state/CONCEPT_LEDGER.toml").write_text('''[meta]
          version = 11
          last_problem = 125
          format = "segmented"

          [records]
          legacy = "state/concepts/0001-0050.toml"
          previous = "state/concepts/0051-0100.toml"
          current = "state/concepts/0101-0104.toml"
          recent = "state/concepts/0105-0107.toml"
          prior = "state/concepts/0108-0112.toml"
          penultimate = "state/concepts/0113-0114.toml"
          latest_previous = "state/concepts/0115-0116.toml"
          prior_latest = "state/concepts/0117-0120.toml"
          latest_before_previous = "state/concepts/0121-0122.toml"
          latest_previous_batch = "state/concepts/0123.toml"
          latest = "state/concepts/0124-0125.toml"

          [resolution]
          statement = "按 legacy、previous、current、recent、prior、penultimate、latest_previous、prior_latest、latest_before_previous、latest_previous_batch、latest 顺序读取；后续分段中的同名 updates 覆盖更早记录的 last_problem、occurrences、teaching_state 和 note。"
          '''.replace("          ", ""))

          Path("state/concepts/0124-0125.toml").write_text('''[meta]
          version = 1
          range = "0124-0125"
          last_problem = 125
          inherits = "state/concepts/0123.toml"

          [updates]
          "complexity.output_space_exclusion" = "此前 30 次区分工作状态与返回载荷；0124 只返回标量并计入 O(h) 递归栈，0125 只返回布尔值并区分 R 的输入物化，累计 32 次。"

          [concepts]
          "algorithm.tree_max_path_dual_state" = "kind=algorithm; introduced=0124; last=0124; occurrences=1; teaching_state=explained; note=后序遍历向父节点返回单分支最大收益，同时用左右非负收益在当前节点闭合任意端点完整路径。"
          "proof.tree_path_unique_highest_node" = "kind=proof; introduced=0124; last=0124; occurrences=1; teaching_state=explained; note=任意树上简单路径存在唯一最高节点；路径要么位于单个子树，要么由该节点连接左右各一条向下链。"
          "boundary.nonempty_negative_answer_initialization" = "kind=boundary; introduced=0124; last=0124; occurrences=1; teaching_state=explained; note=孩子负收益可按零截断，但最终路径必须非空；全局最佳值必须从负无穷或真实节点初始化，不能发布空路径零。"
          "proof.tree_return_chain_no_branch" = "kind=proof; introduced=0124; last=0124; occurrences=1; teaching_state=explained; note=返回父节点的状态只能选择左右一侧以保持链形；双分支只能在当前节点形成闭合候选，否则继续向上会产生分叉。"
          "algorithm.ascii_filtered_two_pointer" = "kind=algorithm; introduced=0125; last=0125; occurrences=1; teaching_state=explained; note=左右指针在原字符串上跳过非 ASCII 字母数字字符，比较归一化端点，不构造完整清洗字符串。"
          "boundary.ascii_character_contract" = "kind=boundary; introduced=0125; last=0125; occurrences=1; teaching_state=explained; note=显式限定 0-9、A-Z、a-z，避免各语言 Unicode 字符分类和区域设置造成语义漂移。"
          "language.r_ascii_raw_materialization" = "kind=language_boundary; introduced=0125; last=0125; occurrences=1; teaching_state=explained; note=R charToRaw 与整数转换物化 O(n) 字节向量；双指针核心状态为 O(1)，完整适配器额外和峰值空间仍为 O(n)。"
          '''.replace("          ", ""))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          articles = [
              Path("problems/0101-0200/0124-binary-tree-maximum-path-sum.rst"),
              Path("problems/0101-0200/0125-valid-palindrome.rst"),
          ]
          languages = [
              "c", "cpp", "python", "java", "rust",
              "go", "typescript", "csharp", "julia", "r",
          ]
          for article in articles:
              text = article.read_text()
              for language in languages:
                  count = len(re.findall(
                      rf"^\.\. code-block:: {language}$",
                      text,
                      re.M,
                  ))
                  if count != 1:
                      raise SystemExit(
                          f"{article}: {language} code block count {count}"
                      )
              for number, line in enumerate(text.splitlines(), 1):
                  if len(line) > 100:
                      raise SystemExit(
                          f"{article}:{number} exceeds 100 characters"
                      )
              for target in re.findall(r"<([^>]+\.rst)>`_", text):
                  resolved = (article.parent / target).resolve()
                  if not resolved.exists():
                      raise SystemExit(
                          f"broken relative link in {article}: {target}"
                      )

          for path in [
              "state/PROGRESS.toml",
              "state/REVIEW_INDEX.toml",
              "state/CONCEPT_LEDGER.toml",
              "state/concepts/0124-0125.toml",
          ]:
              with open(path, "rb") as stream:
                  tomllib.load(stream)
          PY

          rm -rf .batch-upload-0124-0125
          rm -f .github/workflows/materialize-0124-0125.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "content: materialize 0124-0125 quality batch"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
