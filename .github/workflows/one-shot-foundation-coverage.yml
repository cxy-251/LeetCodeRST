name: One-shot LeetCode foundation coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-foundation-coverage.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate missing problem files
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path

          MIN_ID = 1001
          MAX_ID = 3999

          def graphql_questions():
              endpoint = "https://leetcode.com/graphql"
              query = r'''
              query problemsetQuestionList($categorySlug: String, $limit: Int, $skip: Int, $filters: QuestionListFilterInput) {
                problemsetQuestionList: questionList(categorySlug: $categorySlug, limit: $limit, skip: $skip, filters: $filters) {
                  total: totalNum
                  questions: data {
                    frontendQuestionId: questionFrontendId
                    paidOnly: isPaidOnly
                    difficulty
                    title
                    titleSlug
                    topicTags { name slug }
                  }
                }
              }
              '''
              out = {}
              skip = 0
              while True:
                  payload = json.dumps({
                      "query": query,
                      "variables": {
                          "categorySlug": "",
                          "skip": skip,
                          "limit": 100,
                          "filters": {"orderBy": "FRONTEND_ID", "sortOrder": "ASCENDING"},
                      },
                  }).encode()
                  request = urllib.request.Request(
                      endpoint,
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Mozilla/5.0",
                          "Referer": "https://leetcode.com/problemset/",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      page = json.load(response)["data"]["problemsetQuestionList"]
                  rows = page.get("questions") or []
                  for row in rows:
                      raw_id = row.get("frontendQuestionId") or ""
                      if raw_id.isdigit():
                          out[int(raw_id)] = row
                  skip += len(rows)
                  total = int(page.get("total") or 0)
                  if not rows or skip >= total:
                      break
                  time.sleep(0.15)
              return out

          def fallback_questions():
              url = "https://raw.githubusercontent.com/doocs/leetcode/main/solution/README_EN.md"
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  text = response.read().decode("utf-8")
              row_re = re.compile(
                  r"^\|\s+(\d{4})\s+\|\s+\[([^\]]+)\]\([^)]+\)\s+\|\s+(.*?)\s+\|\s+(Easy|Medium|Hard)\s+\|\s+(.*?)\s+\|$"
              )
              out = {}
              for line in text.splitlines():
                  match = row_re.match(line)
                  if not match:
                      continue
                  qid, title, tags_text, difficulty, remark = match.groups()
                  title = html.unescape(title)
                  slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")
                  tags = re.findall(r"`([^`]+)`", tags_text)
                  out[int(qid)] = {
                      "frontendQuestionId": qid,
                      "paidOnly": "🔒" in remark,
                      "difficulty": difficulty,
                      "title": title,
                      "titleSlug": slug,
                      "topicTags": [{"name": tag, "slug": ""} for tag in tags],
                  }
              return out

          try:
              questions = graphql_questions()
              if len(questions) < 3000 or max(questions, default=0) < MAX_ID:
                  raise RuntimeError(f"incomplete GraphQL list: {len(questions)} rows")
              source = "LeetCode GraphQL"
          except Exception as exc:
              print(f"GraphQL unavailable: {exc}; using doocs index")
              questions = fallback_questions()
              source = "doocs/leetcode"

          created = 0
          skipped = 0
          missing_metadata = []

          for qid in range(MIN_ID, MAX_ID + 1):
              row = questions.get(qid)
              if row is None:
                  missing_metadata.append(qid)
                  continue

              title = str(row["title"]).strip()
              slug = str(row["titleSlug"]).strip()
              difficulty = str(row.get("difficulty") or "Unknown")
              tags = [str(tag.get("name") or "").strip() for tag in row.get("topicTags") or []]
              tags = [tag for tag in tags if tag]

              if any(tag.lower() == "database" for tag in tags):
                  problem_type = "Database"
              elif any(tag.lower() == "shell" for tag in tags):
                  problem_type = "Shell"
              elif row.get("paidOnly"):
                  problem_type = "Premium"
              else:
                  problem_type = "Algorithms"

              start = ((qid - 1) // 100) * 100 + 1
              end = start + 99
              directory = f"{start:04d}-{end:04d}"
              path = Path(directory) / f"{qid:04d}-{slug}.rst"
              if path.exists():
                  skipped += 1
                  continue

              title_line = f"{qid:04d}. {title}"
              body = (
                  f"{title_line}\n"
                  f"{'=' * len(title_line)}\n\n"
                  f":题号: {qid:04d}\n"
                  f":题名: {title}\n"
                  f":类型: {problem_type}（元数据占位）\n"
                  f":难度: {difficulty}\n"
                  f":原题: `LeetCode {qid:04d} <https://leetcode.com/problems/{slug}/>`_\n"
                  f":数据源: {source}\n"
                  f":处理状态: 题目文件已建立；题目信息、题目重述与自建示例待下一轮补充。\n"
              )
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(body, encoding="utf-8")
              created += 1

          print(f"created={created}, skipped={skipped}, metadata_missing={len(missing_metadata)}")
          if missing_metadata:
              print("metadata missing IDs:", ",".join(map(str, missing_metadata)))
          PY

      - name: Commit generated files and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-foundation-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: cover missing foundation files 1001-3999 [skip ci]"
          git push origin HEAD:main
